4-32、114-37、114-43","note":"<p><strong>適用細則<\/strong>：授信篇第1章第6節（保證）、第12章第1節（保證）、銀行法第12-2條。<\/p><ul><li><strong>一般保證業務<\/strong>：預開保證書之保證期間應含預開天數及銀行保證天數；保證責任解除之情形有明文列舉。<\/li><li><strong>銀行法 12-2<\/strong>：自用住宅放款及消費性放款而徵取之一般保證人，保證契約有效期間<strong>不得逾 15 年<\/strong>；逾 15 年（含展期）者，保證人須親簽「宣告保證人責任範圍暨保證期間同意書」。<\/li><li><strong>未成年人<\/strong>：不得徵未成年人為保證人（縱經法定代理人同意亦不宜）；受理未成年人為借款人有嚴格限制。<\/li><li><strong>董事會決議錄<\/strong>：徵取銀行法第 30 條反面適用等情形應徵取「董事會決議錄」。<\/li><li><strong>董監卸任保證人<\/strong>：不願續任者，應辦條件變更或另徵適格連帶保證人（非徵「代位清償人同意書」）。<\/li><\/ul>","change":"","questions":[{"year":"109","no":17,"part":"第一部分","score":"2","ans":"1","topic":"H","stem":"關於聯徵中心「查調證券商授信業務負面信用資料」(T70)功能，下列敘述何者錯誤？","opts":["個人戶僅擔任負責人(非保證人)需查詢","於辦理授信業務特定目的始得查詢","僅辦理公司信用卡，不得查詢","應取得當事人書面同意始得查詢"],"ana":["•(1) 錯誤：依據授信及聯徵查詢規範（T70 產品），若該自然人<strong>僅擔任公司負責人，且「未實際擔任該筆借款之保證人」<\/strong>時，<strong>不得<\/strong>查詢其個人之 T70 證券負面信用資料。"],"labels":["1","2","3","4"],"plain":"關於聯徵中心「查調證券商授信業務負面信用資料」(T70)功能，下列敘述何者錯誤？個人戶僅擔任負責人(非保證人)需查詢於辦理授信業務特定目的始得查詢僅辦理公司信用卡，不得查詢應取得當事人書面同意始得查詢•(1) 錯誤：依據授信及聯徵查詢規範（T70 產品），若該自然人僅擔任公司負責人，且「未實際擔任該筆借款之保證人」時，不得查詢其個人之 T70 證券負面信用資料。"},{"year":"109","no":27,"part":"第二部分","score":"1.5","ans":"1","topic":"H","stem":"辦理「一般保證業務」，得辦理保證責任解除之情形，下列何者為非？","opts":["授信戶於本行之授信額度已屆期不再續約","接到解除保證責任通知書或同意書","收回本行簽發之保證書","保證標的業已消滅並取得證明文件"],"ana":["•(1) <strong>非解除保證責任之情形<\/strong>：僅「授信額度屆期不再續約」，並不代表既有已動撥未清償之保證債務已清償完毕。在債務完全結清或取得債權人免責同意前，<strong>保證人對已發生之債務仍負有保證責任，不能直接辦理解除保證責任<\/strong>。"],"labels":["1","2","3","4"],"plain":"辦理「一般保證業務」，得辦理保證責任解除之情形，下列何者為非？授信戶於本行之授信額度已屆期不再續約接到解除保證責任通知書或同意書收回本行簽發之保證書保證標的業已消滅並取得證明文件•(1) 非解除保證責任之情形：僅「授信額度屆期不再續約」，並不代表既有已動撥未清償之保證債務已清償完毕。在債務完全結清或取得債權人免責同意前，保證人對已發生之債務仍負有保證責任，不能直接辦理解除保證責任。"},{"year":"109","no":34,"part":"第二部分","score":"1.5","ans":"2","topic":"H","stem":"有關徵提保證人之相關規範，下列何者為是？","opts":["經取得法定代理人同意後，得徵取未成年人為保證人","依法律或公司章程規定以保證為業務之公司，始得接受其為保證人","因擔任法人董事為該法人擔任保證人者，卸職後仍須對借戶新發生之借款負保證責任","為求作業方便，不論借、保戶資歷，得逕以借、保戶相互聯保或一人承保多戶方式辦理申請"],"ana":["•(2) <strong>正確<\/strong>：依據中華民國公司法第 16 條，公司除依其他法律或公司章程規定得為保證者外，不得為任何保證人。因此，本行僅能接受章程允許保證之公司作為保證人。","•(1) 錯誤：未成年人不能擔任他人借款之保證人，即使法定代理人同意亦不適格。(3) 錯誤：依民法第 753-1 條，董事卸任後，對卸任後新發生之債務原則上不負保證責任。"],"labels":["1","2","3","4"],"plain":"有關徵提保證人之相關規範，下列何者為是？經取得法定代理人同意後，得徵取未成年人為保證人依法律或公司章程規定以保證為業務之公司，始得接受其為保證人因擔任法人董事為該法人擔任保證人者，卸職後仍須對借戶新發生之借款負保證責任為求作業方便，不論借、保戶資歷，得逕以借、保戶相互聯保或一人承保多戶方式辦理申請•(2) 正確：依據中華民國公司法第 16 條，公司除依其他法律或公司章程規定得為保證者外，不得為任何保證人。因此，本行僅能接受章程允許保證之公司作為保證人。•(1) 錯誤：未成年人不能擔任他人借款之保證人，即使法定代理人同意亦不適格。(3) 錯誤：依民法第 753-1 條，董事卸任後，對卸任後新發生之債務原則上不負保證責任。"},{"year":"109","no":40,"part":"第二部分","score":"1.5","ans":"3","topic":"H","stem":"借款人申請塗銷抵押權時，應先審查塗銷抵押權對本行債權有無不利影響，並辦理抵押權塗銷查詢作業。下列何者為應辦理之查詢對象？A. 借款人 B. 保證人 C. 擔保物提供人","opts":["僅A","AB","AC","ABC"],"ana":["辦理塗銷抵押權前，為了避免發生「借款人尚有其他債務未清償卻將抵押物放行」之後遺症，經辦必須於端末系統查詢與核對。其法查之「塗銷抵押權查詢」對象，主要為對該擔保物有直接物權及債務關聯之 <strong>「借款人」（A）及「擔保物提供人」（C）<\/strong>，故選 (3) AC。"],"labels":["1","2","3","4"],"plain":"借款人申請塗銷抵押權時，應先審查塗銷抵押權對本行債權有無不利影響，並辦理抵押權塗銷查詢作業。下列何者為應辦理之查詢對象？A. 借款人 B. 保證人 C. 擔保物提供人僅AABACABC辦理塗銷抵押權前，為了避免發生「借款人尚有其他債務未清償卻將抵押物放行」之後遺症，經辦必須於端末系統查詢與核對。其法查之「塗銷抵押權查詢」對象，主要為對該擔保物有直接物權及債務關聯之 「借款人」（A）及「擔保物提供人」（C），故選 (3) AC。"},{"year":"110","no":4,"part":"第一部分","score":"2","ans":"3","topic":"H","stem":"辦理一般保證業務，下列敘述何者錯誤？","opts":["預開保證書時，保證期間應包含預開天數及銀行保證天數","人力仲介業委託簽發「保證金保證書」，應申請授信審核處或區域中心核准","申請聘僱外籍勞工之「保證金保證書」，未經勞動部勞動力發展署通知解除，仍得中止本行保證責任","一案有多筆保證之工程保證案件，應逐案填寫「工程類保證書控管明計表」"],"ana":["•申請聘僱外籍勞工之「保證金保證書」，<strong>必須經勞動部勞動力發展署（主管機關）正式書面通知解除保證責任後，本行始得終止（解除）保證責任<\/strong>，行方不能在未經通知下逕自中止保證責任。故 (3) 錯誤。"],"labels":["1","2","3","4"],"plain":"辦理一般保證業務，下列敘述何者錯誤？預開保證書時，保證期間應包含預開天數及銀行保證天數人力仲介業委託簽發「保證金保證書」，應申請授信審核處或區域中心核准申請聘僱外籍勞工之「保證金保證書」，未經勞動部勞動力發展署通知解除，仍得中止本行保證責任一案有多筆保證之工程保證案件，應逐案填寫「工程類保證書控管明計表」•申請聘僱外籍勞工之「保證金保證書」，必須經勞動部勞動力發展署（主管機關）正式書面通知解除保證責任後，本行始得終止（解除）保證責任，行方不能在未經通知下逕自中止保證責任。故 (3) 錯誤。"},{"year":"110","no":8,"part":"第一部分","score":"2","ans":"3","topic":"H","stem":"本行110.1.1核准法人授信戶(循)短放新臺幣10,000仟元，徵取借戶董事長A及董事B為保證人，110.2.2貸放一筆2,000仟元，110.3.3借戶通知保證人B已卸任該公司董事且未簽立續任保證人同意書，110.4.4貸放一筆4,000仟元，下列何者正確？","opts":["保證人B對2筆貸放皆不負保證責任","保證人A僅對110.2.2之貸放負保證責任","僅保證人A對110.4.4之貸放負保證責任","需向保證人A徵取「代位清償人同意書」"],"ana":["•依民法第 753-1 條，董事因職務關係擔任保證人者，於卸職後對新發生之債務不負保證責任。","•董事B在 110.3.3 卸任董事，其對於卸任前（110.2.2）已動撥之 2,000 仟元債務「仍須負保證責任」；但對於卸任後（110.4.4）新發生的 4,000 仟元債務則不負保證責任。","•董事長A未卸任，對新舊動撥債務均負保證責任。因此，110.4.4 的新撥款<strong>僅有保證人A負保證責任<\/strong>。故 (3) 正確。"],"labels":["1","2","3","4"],"plain":"本行110.1.1核准法人授信戶(循)短放新臺幣10,000仟元，徵取借戶董事長A及董事B為保證人，110.2.2貸放一筆2,000仟元，110.3.3借戶通知保證人B已卸任該公司董事且未簽立續任保證人同意書，110.4.4貸放一筆4,000仟元，下列何者正確？保證人B對2筆貸放皆不負保證責任保證人A僅對110.2.2之貸放負保證責任僅保證人A對110.4.4之貸放負保證責任需向保證人A徵取「代位清償人同意書」•依民法第 753-1 條，董事因職務關係擔任保證人者，於卸職後對新發生之債務不負保證責任。•董事B在 110.3.3 卸任董事，其對於卸任前（110.2.2）已動撥之 2,000 仟元債務「仍須負保證責任」；但對於卸任後（110.4.4）新發生的 4,000 仟元債務則不負保證責任。•董事長A未卸任，對新舊動撥債務均負保證責任。因此，110.4.4 的新撥款僅有保證人A負保證責任。故 (3) 正確。"},{"year":"110","no":12,"part":"第一部分","score":"2","ans":"1","topic":"H","stem":"辦理「法拍屋、金拍屋、銀拍(售)屋」優惠貸款之無擔保代墊款，下列敘述何者錯誤？","opts":["期限最長6個月","償還方式為按月繳息，到期清償本金","額度應與房屋擔保貸款以A、B件方式併同申請","至少應徵提具資力之一般保證人1人"],"ana":["•(1) 錯誤：法拍屋、金拍屋代墊款屬於短期的過渡性融資，其<strong>期限最長為「3個月」<\/strong>（並非6個月）。待取得產權並辦妥本行第一順位抵押權設定後，應即轉為房屋擔保貸款清償。"],"labels":["1","2","3","4"],"plain":"辦理「法拍屋、金拍屋、銀拍(售)屋」優惠貸款之無擔保代墊款，下列敘述何者錯誤？期限最長6個月償還方式為按月繳息，到期清償本金額度應與房屋擔保貸款以A、B件方式併同申請至少應徵提具資力之一般保證人1人•(1) 錯誤：法拍屋、金拍屋代墊款屬於短期的過渡性融資，其期限最長為「3個月」（並非6個月）。待取得產權並辦妥本行第一順位抵押權設定後，應即轉為房屋擔保貸款清償。"},{"year":"110","no":13,"part":"第一部分","score":"2","ans":"2","topic":"H","stem":"辦理「自行特定金錢信託受益權質借」業務，下列敘述何者正確？A.對象限為專業投資人(不含中華民國境外之個人戶)B.貸款期限最長1年C.受益權商品風險等級為中高(RR4)~高度(RR5)，最高貸款成數5成D.不得徵提保證人","opts":["ABCD","ABD","BCD","ABC"],"ana":["•<strong>A、B、D 為正確敘述<\/strong>：對象限本國專業投資人（A）；最長期限為 1 年（B）；質借時原則上不得徵提保證人（D）。","•<strong>C 錯誤<\/strong>：其貸款成數並非僅以 RR4/RR5 且最高 5 成之簡單方式劃分，故不選包含 C 之選項。因此答案為 (2) ABD。"],"labels":["1","2","3","4"],"plain":"辦理「自行特定金錢信託受益權質借」業務，下列敘述何者正確？A.對象限為專業投資人(不含中華民國境外之個人戶)B.貸款期限最長1年C.受益權商品風險等級為中高(RR4)~高度(RR5)，最高貸款成數5成D.不得徵提保證人ABCDABDBCDABC•A、B、D 為正確敘述：對象限本國專業投資人（A）；最長期限為 1 年（B）；質借時原則上不得徵提保證人（D）。•C 錯誤：其貸款成數並非僅以 RR4/RR5 且最高 5 成之簡單方式劃分，故不選包含 C 之選項。因此答案為 (2) ABD。"},{"year":"110","no":26,"part":"第二部分","score":"1.5","ans":"4","topic":"H","stem":"為利控管大陸暴險，應審慎辧理大陸地區授信案件，加張徵取符合「風險移轉」之保證或擔保品，下列敘述何者正確？","opts":["徵取本行企金信評優於5等(含)之母公司或關係企業擔任授信戶之保證人","徵取十足備償存款","改以「短期貿易融資」方式承作以作為扣減項","以上皆是"],"ana":["•大陸暴險額度中，(1) 徵提評等 5 等以上之關係企業/母公司擔任保證人、(2) 徵提十足備償存款設質，以及 (3) 承作自償性短期貿易融資，均屬<strong>符合「風險移轉」得予自暴險額度中扣減之合格擔保或方式<\/strong>。故 (1)、(2)、(3) 皆正確。"],"labels":["1","2","3","4"],"plain":"為利控管大陸暴險，應審慎辧理大陸地區授信案件，加張徵取符合「風險移轉」之保證或擔保品，下列敘述何者正確？徵取本行企金信評優於5等(含)之母公司或關係企業擔任授信戶之保證人徵取十足備償存款改以「短期貿易融資」方式承作以作為扣減項以上皆是•大陸暴險額度中，(1) 徵提評等 5 等以上之關係企業/母公司擔任保證人、(2) 徵提十足備償存款設質，以及 (3) 承作自償性短期貿易融資，均屬符合「風險移轉」得予自暴險額度中扣減之合格擔保或方式。故 (1)、(2)、(3) 皆正確。"},{"year":"110","no":46,"part":"第二部分","score":"1.5","ans":"2","topic":"H","stem":"有關本行對逾放(含呆帳)案件債務人之財產所得強制執行相關規定，下列敘述何者錯誤？","opts":["強制執行前，應以「逾放(含呆帳)案件聲請法院強制執行前檢核表」逐項檢視，以確認本行債權是否存在","前揭檢核表，經催收經辦確認完即可，不用交由催收主管覆核","接獲第一金AMC以「第一金AMC受託催收逾放個案聯繫單」查詢時，應將檢核表及相關文件影本作為回覆聯繫單之附件","前揭查詢對象包括借戶、保證人或票據債務人"],"ana":["•(2) 錯誤：聲請強制執行前之檢核表，<strong>「必須交由催收單位主管（及副理、經理）親自覆核簽章」<\/strong>，以落實法律程序核對，不可僅由經辦自行確認。"],"labels":["1","2","3","4"],"plain":"有關本行對逾放(含呆帳)案件債務人之財產所得強制執行相關規定，下列敘述何者錯誤？強制執行前，應以「逾放(含呆帳)案件聲請法院強制執行前檢核表」逐項檢視，以確認本行債權是否存在前揭檢核表，經催收經辦確認完即可，不用交由催收主管覆核接獲第一金AMC以「第一金AMC受託催收逾放個案聯繫單」查詢時，應將檢核表及相關文件影本作為回覆聯繫單之附件前揭查詢對象包括借戶、保證人或票據債務人•(2) 錯誤：聲請強制執行前之檢核表，「必須交由催收單位主管（及副理、經理）親自覆核簽章」，以落實法律程序核對，不可僅由經辦自行確認。"},{"year":"111","no":9,"part":"第一部分","score":"2","ans":"1","topic":"H","stem":"對於本行擔任連帶保證銀行之保證書，該保證書於業主求償前，本行所負保證責任仍屬尚未實際發生之或有債務，倘營業單位評估確有立即抵銷借保戶存款之必要時，應","opts":["事先申請債權管理處審核後憑辦","營業單位可自行決定抵銷","營業單位可先抵銷再報債權管理處備查","以上皆非"],"ana":["•由於保證責任在業主實行索賠前，法律上仍屬於未顯現、未實際發生的或有負債。","•為了防範法律抵銷效力爭議，營業單位若經評估有立即辦理存款抵銷之必要，<strong>「必須事先向總行債權管理處提出申請，經核准後始得憑以辦理」<\/strong>。不可自行決定或先斬後奏，故選 (1)。"],"labels":["1","2","3","4"],"plain":"對於本行擔任連帶保證銀行之保證書，該保證書於業主求償前，本行所負保證責任仍屬尚未實際發生之或有債務，倘營業單位評估確有立即抵銷借保戶存款之必要時，應事先申請債權管理處審核後憑辦營業單位可自行決定抵銷營業單位可先抵銷再報債權管理處備查以上皆非•由於保證責任在業主實行索賠前，法律上仍屬於未顯現、未實際發生的或有負債。•為了防範法律抵銷效力爭議，營業單位若經評估有立即辦理存款抵銷之必要，「必須事先向總行債權管理處提出申請，經核准後始得憑以辦理」。不可自行決定或先斬後奏，故選 (1)。"},{"year":"111","no":11,"part":"第一部分","score":"2","ans":"4","topic":"H","stem":"下列徵信作業規範何者錯誤？","opts":["土、建融授信案件以多戶分別申貸時，徵信作業權限係依各自本身額度計算歸屬","110會計年度起，第一上市(櫃)公司之第二季財報應經會計師查核簽證","法人負責人未擔任保證人時，不受財務報表決算日距改編日期不得逾8個月之規定限制","111會計年度起，實收資本額達新臺幣10億元以上之上市(櫃)公司，其公告申報年度財報不得逾會計年度終了後75日"],"ana":["•(4) <strong>錯誤<\/strong>：依據最新證券交易法規，自 111 會計年度起，實收資本額達新臺幣 10 億元以上之上市櫃公司，其公告申報年度財務報告之限期，<strong>已縮短至「不得逾會計年度終了後 70日」<\/strong>（而非 75 日）。故 (4) 數據不符法規，為錯誤選項。"],"labels":["1","2","3","4"],"plain":"下列徵信作業規範何者錯誤？土、建融授信案件以多戶分別申貸時，徵信作業權限係依各自本身額度計算歸屬110會計年度起，第一上市(櫃)公司之第二季財報應經會計師查核簽證法人負責人未擔任保證人時，不受財務報表決算日距改編日期不得逾8個月之規定限制111會計年度起，實收資本額達新臺幣10億元以上之上市(櫃)公司，其公告申報年度財報不得逾會計年度終了後75日•(4) 錯誤：依據最新證券交易法規，自 111 會計年度起，實收資本額達新臺幣 10 億元以上之上市櫃公司，其公告申報年度財務報告之限期，已縮短至「不得逾會計年度終了後 70日」（而非 75 日）。故 (4) 數據不符法規，為錯誤選項。"},{"year":"111","no":27,"part":"第二部分","score":"1.5","ans":"1","topic":"H","stem":"有關備付(本息)本票之敘述，下列何者為非？","opts":["得依總額度或逐筆貸放金額徵取100%備付(本息)本票","對於已徵取十足本行存單或本行活存且設定質權為擔保者，得酌情免徵","辦理一般保證業務，須向借戶徵取","無到期日之備付(本息) 本票，額度生效日至本票發票日之期間逾3年時，應重徵之"],"ana":["•(1) <strong>錯誤<\/strong>：本行徵提之備付（本息）本票，為了涵蓋利息與違約金等債權保障，其本票面額<strong>一律「按額度或貸放金額之 110%」徵取<\/strong>，並非僅 100%。故 (1) 為非。"],"labels":["1","2","3","4"],"plain":"有關備付(本息)本票之敘述，下列何者為非？得依總額度或逐筆貸放金額徵取100%備付(本息)本票對於已徵取十足本行存單或本行活存且設定質權為擔保者，得酌情免徵辦理一般保證業務，須向借戶徵取無到期日之備付(本息) 本票，額度生效日至本票發票日之期間逾3年時，應重徵之•(1) 錯誤：本行徵提之備付（本息）本票，為了涵蓋利息與違約金等債權保障，其本票面額一律「按額度或貸放金額之 110%」徵取，並非僅 100%。故 (1) 為非。"},{"year":"111","no":35,"part":"第二部分","score":"1.5","ans":"3","topic":"H","stem":"借戶為股份有限公司並設有董事會，於何種情形應徵取「董事會決議錄」？ A.徵 取銀行法第30條之反面承諾書 B.開立備償借款專戶供關係企業授信使用 C.如為 授信新戶，應於額度動用或簽約前徵取「借款決議錄」 D.如為授信舊戶，該公司 於董事任期屆滿前改選部分董事，應一律重新徵取，不得續用原「借款決議錄」","opts":["ACD","BCD","ABC","ABCD"],"ana":["•董事會決議錄徵提原則：董事會任期內僅改選或改派「部分」董事，若全體董事無全面改選異動，<strong>得不須重徵決議錄<\/strong>。故 D 為非，其餘 A、B、C 均為必須徵取董事會決議錄之標準時機，答案選 (3)。"],"labels":["1","2","3","4"],"plain":"借戶為股份有限公司並設有董事會，於何種情形應徵取「董事會決議錄」？ A.徵 取銀行法第30條之反面承諾書 B.開立備償借款專戶供關係企業授信使用 C.如為 授信新戶，應於額度動用或簽約前徵取「借款決議錄」 D.如為授信舊戶，該公司 於董事任期屆滿前改選部分董事，應一律重新徵取，不得續用原「借款決議錄」ACDBCDABCABCD•董事會決議錄徵提原則：董事會任期內僅改選或改派「部分」董事，若全體董事無全面改選異動，得不須重徵決議錄。故 D 為非，其餘 A、B、C 均為必須徵取董事會決議錄之標準時機，答案選 (3)。"},{"year":"112","no":17,"part":"第一部分","score":"2","ans":"1","topic":"H","stem":"有關徵提保證人之相關規範，下列何者正確？","opts":["依法律 or 公司章程規定以保證為業務之公司，始得接受其為保證人","為求作業方便，不論借、保戶資力，得逕以借、保戶相互聯保或一人承保多戶方式辦理申請","得徵取未成年人為保證人","因擔任法人董事為該法人擔任保證人者，卸職後仍須對借戶新發生之借款負保證責任"],"ana":["•(1) <strong>正確<\/strong>：依據中華民國公司法第 16 條，公司除非依其他法律或公司章程規定得為保證者外，不得為任何保證人。因此，本行僅能徵提合規之保證公司。","•(3) 錯誤：未成年人不能擔任連帶保證人。 (4) 錯誤：依民法第 753-1 條，董事卸任後對卸任後新發生的債務自動免除保證責任。"],"labels":["1","2","3","4"],"plain":"有關徵提保證人之相關規範，下列何者正確？依法律 or 公司章程規定以保證為業務之公司，始得接受其為保證人為求作業方便，不論借、保戶資力，得逕以借、保戶相互聯保或一人承保多戶方式辦理申請得徵取未成年人為保證人因擔任法人董事為該法人擔任保證人者，卸職後仍須對借戶新發生之借款負保證責任•(1) 正確：依據中華民國公司法第 16 條，公司除非依其他法律或公司章程規定得為保證者外，不得為任何保證人。因此，本行僅能徵提合規之保證公司。•(3) 錯誤：未成年人不能擔任連帶保證人。 (4) 錯誤：依民法第 753-1 條，董事卸任後對卸任後新發生的債務自動免除保證責任。"},{"year":"112","no":26,"part":"第二部分","score":"1.5","ans":"3","topic":"H","stem":"有關境外公司基本資料之徵取，下列何者為非？","opts":["同一關係企業及集團企業資料表","組織章程或合夥契約影本","負責人及保證人僅須留存一種身分證件影本","如係設立於免稅地之境外公司，應加徵最近年度政府規費繳訖證明單及存續證明"],"ana":["•(3) <strong>敘述錯誤<\/strong>：辦理境外公司（紙上公司等）之基本資料徵提時，針對外國籍負責人及保證人，其身分證件<strong>必須徵提並留存「兩種（雙重身分證件）」影本<\/strong>（例如：有效護照加計另一附照片之居留證或駕照），不可僅留存一種。"],"labels":["1","2","3","4"],"plain":"有關境外公司基本資料之徵取，下列何者為非？同一關係企業及集團企業資料表組織章程或合夥契約影本負責人及保證人僅須留存一種身分證件影本如係設立於免稅地之境外公司，應加徵最近年度政府規費繳訖證明單及存續證明•(3) 敘述錯誤：辦理境外公司（紙上公司等）之基本資料徵提時，針對外國籍負責人及保證人，其身分證件必須徵提並留存「兩種（雙重身分證件）」影本（例如：有效護照加計另一附照片之居留證或駕照），不可僅留存一種。"},{"year":"112","no":27,"part":"第二部分","score":"1.5","ans":"4","topic":"H","stem":"下列何種異常情況免於徵信報告揭露？","opts":["負責人或保證人有信用不良情形者","已知借戶曾有償還異常紀錄，然查詢聯徵中心信用資訊時，因已逾聯徵資訊揭露期限而顯示為正常者","借戶與關係人間之不動產交易價格異於市場行情者","以上皆非"],"ana":["•依誠信及客觀揭露原則，(1) 關係人信用不良、(2) 歷史異常雖已逾揭露期但已知悉、(3) 關係人交易有違常情，<strong>上述三種情形一律「必須確實揭露於徵信報告中」，絕無免予揭露之例外，故選 (4) 以上皆非<\/strong>。"],"labels":["1","2","3","4"],"plain":"下列何種異常情況免於徵信報告揭露？負責人或保證人有信用不良情形者已知借戶曾有償還異常紀錄，然查詢聯徵中心信用資訊時，因已逾聯徵資訊揭露期限而顯示為正常者借戶與關係人間之不動產交易價格異於市場行情者以上皆非•依誠信及客觀揭露原則，(1) 關係人信用不良、(2) 歷史異常雖已逾揭露期但已知悉、(3) 關係人交易有違常情，上述三種情形一律「必須確實揭露於徵信報告中」，絕無免予揭露之例外，故選 (4) 以上皆非。"},{"year":"112","no":48,"part":"第二部分","score":"1.5","ans":"4","topic":"H","stem":"有關「法定代位清償人同意書」之使用，何者為非？","opts":["徵有多名保證人且僅免除其中一人之保證責任時，應徵取之","塗銷部分抵押權而借款人尚有其他授信時，應徵取之","擔保物提供人屬法定代位清償人","同意解除向後發生之保證責任，應徵取「免除」格式之同意書"],"ana":["•(4) <strong>敘述錯誤<\/strong>：若同意解除的是「保證契約成立後，向後（未來）所新發生」之保證責任，此在契約關係處理上<strong>應徵取「終止」格式之同意書<\/strong>（而非免除格式）；「免除」格式係適用於對「已發生之既有特定債務」進行責任豁免時。"],"labels":["1","2","3","4"],"plain":"有關「法定代位清償人同意書」之使用，何者為非？徵有多名保證人且僅免除其中一人之保證責任時，應徵取之塗銷部分抵押權而借款人尚有其他授信時，應徵取之擔保物提供人屬法定代位清償人同意解除向後發生之保證責任，應徵取「免除」格式之同意書•(4) 敘述錯誤：若同意解除的是「保證契約成立後，向後（未來）所新發生」之保證責任，此在契約關係處理上應徵取「終止」格式之同意書（而非免除格式）；「免除」格式係適用於對「已發生之既有特定債務」進行責任豁免時。"},{"year":"113","no":1,"part":"第一部分","score":"2","ans":"2","topic":"H","stem":"有關保證人徵提，下列敘述何者有誤？","opts":["徵提保證人應衡酌其資歷及保證能力","不得徵取未成年人為保證人，惟如符合民法第1088 條「為子女之利益」意旨者，才得受理","保證契約屬未定期間最高限額保證者，銀行應每年一次以書面通知函告知其連帶保證人最高限額保證金額及通知當月基準日所負保證債務金額","除除外規定外，本行擔保放款以一人保證，無擔保放款以二人保證為原則"],"ana":["•依本行「授信通則及保證人徵提規範」，未成年人屬於限制行為能力或無行為能力人，依法<strong>絕對不能擔任他人借款之連帶保證人<\/strong>，亦<strong>不得<\/strong>以民法第 1088 條「為子女之利益」為藉口而予以徵提。故 (2) 敘述為嚴重錯誤。"],"labels":["1","2","3","4"],"plain":"有關保證人徵提，下列敘述何者有誤？徵提保證人應衡酌其資歷及保證能力不得徵取未成年人為保證人，惟如符合民法第1088 條「為子女之利益」意旨者，才得受理保證契約屬未定期間最高限額保證者，銀行應每年一次以書面通知函告知其連帶保證人最高限額保證金額及通知當月基準日所負保證債務金額除除外規定外，本行擔保放款以一人保證，無擔保放款以二人保證為原則•依本行「授信通則及保證人徵提規範」，未成年人屬於限制行為能力或無行為能力人，依法絕對不能擔任他人借款之連帶保證人，亦不得以民法第 1088 條「為子女之利益」為藉口而予以徵提。故 (2) 敘述為嚴重錯誤。"},{"year":"113","no":24,"part":"第二部分","score":"1.5","ans":"1","topic":"H","stem":"本行113年4月核准甲公司短放新臺幣10,000仟元，徵取借戶董事長A及董事B為保證人，113年5月貸放一筆2,000仟元，6月保證人B卸任該公司董事且未簽立續任保證人同意書，113年7月再貸放一筆3,000仟元，下列何者正確？","opts":["僅保證人A對113年7月之貸放負保證責任","保證人B對2筆貸放皆不負保證責任","保證人A僅對113年5月之貸放負保證責任","需向保證人A徵取「代位清償人同意書」"],"ana":["•依民法第 753-1 條，董事B於 6 月卸任，對卸任後新動撥之 113年7月之 3,000仟元貸款<strong>不負保證責任<\/strong>。","•但董事B對卸任前已動撥之 113年5月之 2,000仟元貸款<strong>仍須負擔保證責任<\/strong>。","•董事長A未卸任，對新舊撥款均負連保責任，因此 7 月之新撥款<strong>僅有保證人A負連保責任<\/strong>。故選 (1)。"],"labels":["1","2","3","4"],"plain":"本行113年4月核准甲公司短放新臺幣10,000仟元，徵取借戶董事長A及董事B為保證人，113年5月貸放一筆2,000仟元，6月保證人B卸任該公司董事且未簽立續任保證人同意書，113年7月再貸放一筆3,000仟元，下列何者正確？僅保證人A對113年7月之貸放負保證責任保證人B對2筆貸放皆不負保證責任保證人A僅對113年5月之貸放負保證責任需向保證人A徵取「代位清償人同意書」•依民法第 753-1 條，董事B於 6 月卸任，對卸任後新動撥之 113年7月之 3,000仟元貸款不負保證責任。•但董事B對卸任前已動撥之 113年5月之 2,000仟元貸款仍須負擔保證責任。•董事長A未卸任，對新舊撥款均負連保責任，因此 7 月之新撥款僅有保證人A負連保責任。故選 (1)。"},{"year":"113","no":26,"part":"第二部分","score":"1.5","ans":"1","topic":"H","stem":"借款人申請塗銷不動產抵押權時，應先審查塗銷抵押權對本行債權之影響，並辦理抵押權塗銷查詢作業，下列何者為應辦理之查詢對象？A. 借款人 B. 企業授信戶之負責人 C. 擔保物提供人 D. 保證人","opts":["AC","AD","ACD","ABCD"],"ana":["•塗銷抵押權核對時，端末查詢與法核之查詢對象為 <strong>「A. 借款人」<\/strong> 及 <strong>「C. 擔保物提供人（物權所有權人）」<\/strong>，以確保該擔保物之所有人與主債務人對本行已無其他關聯之借貸債務。"],"labels":["1","2","3","4"],"plain":"借款人申請塗銷不動產抵押權時，應先審查塗銷抵押權對本行債權之影響，並辦理抵押權塗銷查詢作業，下列何者為應辦理之查詢對象？A. 借款人 B. 企業授信戶之負責人 C. 擔保物提供人 D. 保證人ACADACDABCD•塗銷抵押權核對時，端末查詢與法核之查詢對象為 「A. 借款人」 及 「C. 擔保物提供人（物權所有權人）」，以確保該擔保物之所有人與主債務人對本行已無其他關聯之借貸債務。"},{"year":"114","no":32,"part":"第二部分","score":"1.5","ans":"4","topic":"H","stem":"對於本行履行保證責任墊付款項，營業單位評估發現有無法收回或甚難收回之虞時，應即辦理轉列「非放款轉列催收款項」會計項目，以不超過逾墊款日起起算多久內辦理為限？","opts":["2 個月","3 個月","4 個月","6 個月"],"ana":["•履行保證責任之代墊款（或墊付款），若經催討無效且經评估甚難收回，為符合資產品質評估準則，最遲<strong>必須於墊款日起起算「6 個月（六個月）」內，確實將該墊款轉列至「非放款轉列催收款項」<\/strong>，不得長期滯留於墊款科目。"],"labels":["1","2","3","4"],"plain":"對於本行履行保證責任墊付款項，營業單位評估發現有無法收回或甚難收回之虞時，應即辦理轉列「非放款轉列催收款項」會計項目，以不超過逾墊款日起起算多久內辦理為限？2 個月3 個月4 個月6 個月•履行保證責任之代墊款（或墊付款），若經催討無效且經评估甚難收回，為符合資產品質評估準則，最遲必須於墊款日起起算「6 個月（六個月）」內，確實將該墊款轉列至「非放款轉列催收款項」，不得長期滯留於墊款科目。"},{"year":"114","no":37,"part":"第二部分","score":"1.5","ans":"1","topic":"H","stem":"借款人申請塗銷不動產抵押權時，應先審查塗銷抵押權對本行債權之影響，並辦理抵押權塗銷查詢作業，下列何者為應辦理之查詢對象？A.借款人 B.企業授信戶之負責人 C.擔保物提供人 D.保證人","opts":["AC","AD","ACD","ABCD"],"ana":["•(1) <strong>正確<\/strong>：辦理塗銷抵押權核對時，為確認物權之變更與本行存款抵銷、他案連保債務有無未結清異常，應確實辦理系統發查與核對之對象，僅為 <strong>「A. 借款人」<\/strong> 及 <strong>「C. 擔保物提供人（物權所有權人）」<\/strong>，其餘非屬抵押物產權主體。"],"labels":["1","2","3","4"],"plain":"借款人申請塗銷不動產抵押權時，應先審查塗銷抵押權對本行債權之影響，並辦理抵押權塗銷查詢作業，下列何者為應辦理之查詢對象？A.借款人 B.企業授信戶之負責人 C.擔保物提供人 D.保證人ACADACDABCD•(1) 正確：辦理塗銷抵押權核對時，為確認物權之變更與本行存款抵銷、他案連保債務有無未結清異常，應確實辦理系統發查與核對之對象，僅為 「A. 借款人」 及 「C. 擔保物提供人（物權所有權人）」，其餘非屬抵押物產權主體。"},{"year":"114","no":43,"part":"第二部分","score":"1.5","ans":"1","topic":"H","stem":"關於聯徵中心「查調證券商授信業務負面信用資料」(T70)功能，下列敘述何者錯誤？","opts":["個人戶僅擔任負責人(非保證人)須查詢","於辦理授信業務特定目的始得查詢","僅辦理公司信用卡，不得查詢","應取得當事人書面同意始得查詢"],"ana":["•(1) <strong>敘述錯誤<\/strong>：依聯徵查詢規範，當個人戶 <strong>「僅擔任公司之負責人（且其未在該案中擔任借款連帶保證人）」<\/strong> 時，行方在法律上與個資合意上<strong>「不得（無需）查詢」<\/strong>其個人之 T70證券負面信用紀錄。故 (1) 稱「須查詢」為錯誤。---"],"labels":["1","2","3","4"],"plain":"關於聯徵中心「查調證券商授信業務負面信用資料」(T70)功能，下列敘述何者錯誤？個人戶僅擔任負責人(非保證人)須查詢於辦理授信業務特定目的始得查詢僅辦理公司信用卡，不得查詢應取得當事人書面同意始得查詢•(1) 敘述錯誤：依聯徵查詢規範，當個人戶 「僅擔任公司之負責人（且其未在該案中擔任借款連帶保證人）」 時，行方在法律上與個資合意上「不得（無需）查詢」其個人之 T70證券負面信用紀錄。故 (1) 稱「須查詢」為錯誤。---"}],"plain":"適用細則：授信篇第1章第6節（保證）、第12章第1節（保證）、銀行法第12-2條。一般保證業務：預開保證書之保證期間應含預開天數及銀行保證天數；保證責任解除之情形有明文列舉。銀行法 12-2：自用住宅放款及消費性放款而徵取之一般保證人，保證契約有效期間不得逾 15 年；逾 15 年（含展期）者，保證人須親簽「宣告保證人責任範圍暨保證期間同意書」。未成年人：不得徵未成年人為保證人（縱經法定代理人同意亦不宜）；受理未成年人為借款人有嚴格限制。董事會決議錄：徵取銀行法第 30 條反面適用等情形應徵取「董事會決議錄」。董監卸任保證人：不願續任者，應辦條件變更或另徵適格連帶保證人（非徵「代位清償人同意書」）。"},{"letter":"I","title":"信用保證基金（信保・青創・微型・紓困）","meta":"本主題共 **39 題**：109-30、109-31、109-32、109-51、110-05、110-06、110-07、110-15、110-16、110-28、110-30、110-31、111-04、111-05、111-15、111-21、111-30、111-31、111-32、112-03、112-04、112-30、112-31、112-32、112-33、112-35、112-36、112-46、113-10、113-11、113-29、113-35、113-38、113-48、114-09、114-22、114-23、114-24、114-26","note":"<p><strong>適用細則<\/strong>：授信篇第26章（含第12節青創）、中小企業信用保證基金保證作業手冊、各專案貸款要點。<\/p><ul><li><strong>通知信保基金信用惡化<\/strong>：授信單位應於<strong>知悉之日起 2 個月內<\/strong>通知（停業、未依約分期攤還、跳票等列舉情事）。<\/li><li><strong>保證手續費<\/strong>：依保證金額按年計收，於授信翌日起一定曆日／營業日內繳納（依各版本要點）。<\/li><li><strong>逾期未展延<\/strong>：信用保證案件於到期後一定月數內未辦展延／分期且未通知逾期者，信保基金得逕行免除保證責任。<\/li><li><strong>各專案<\/strong>：深化中小企業專案貸款、微型創業鳳凰貸款、勞工紓困貸款、企業小頭家貸款之對象、額度、期限與保證成數為常考。<\/li><\/ul>","change":"<p style=\"color:var(--ink-2);font-size:13.5px\"><span style=\"color:var(--seal)\">⚠️<\/span> <strong>異動（經濟部「青年創業貸款要點」第8、9點，2026.7.1 生效）<\/strong>：<\/p><p style=\"color:var(--ink-2);font-size:13.5px\">- <strong>歸戶金額 150 萬元以下之部分，信保基金保證成數 9.5 成<\/strong>。<\/p><p style=\"color:var(--ink-2);font-size:13.5px\">- 歸戶 <strong>150 萬元以下者，僅得徵提代表人／負責人為保證人<\/strong>；逾 150 萬元者，以一人為原則。<\/p><p style=\"color:var(--ink-2);font-size:13.5px\">- 申貸金額 <strong>150 萬元以下者，得以「申請表」取代計畫書<\/strong>。<\/p><p style=\"color:var(--ink-2);font-size:13.5px\">- 移送信保者僅得移送「青年創業貸款」方案，不得移送其他方案。<\/p><p>&gt;<\/p><p style=\"color:var(--ink-2);font-size:13.5px\">影響：青創相關舊題（109-30 為 109.8.1 版、112-04）之保證成數／保證人／文件規定，請以 2026.7.1 新版為準。<\/p>","questions":[{"year":"109","no":30,"part":"第二部分","score":"1.5","ans":"3","topic":"I","stem":"109年8月1日以後辦理青年創業及啟動金貸款並移送信保基金保證，下列何者為是？","opts":["以負責人名義申貸，歸戶金額在100萬元以下者，得徵提保證人","以負責人名義申貸，逾100萬元者以2名保證人(含配偶或股東)為原則","以事業體名義申貸者，依信保基金及承貸銀行規定辦理(如以經理權限辦理，徵提2名保證人)","以上皆非"],"ana":["•依青創貸款109年新制規定，若以<strong>事業體（企業）名義<\/strong>申貸者，其保證人之徵提係回歸承貸金融機構與信保基金之一般授信實務規定辦理（例如適用營業單位經理權限時，通常徵提 1至 2 名實際經營人或大股東擔任保證人），故 (3) 敘述為正確。","•註：100 萬元以下青創案為簡化流程，原則上免提保證人。"],"labels":["1","2","3","4"],"plain":"109年8月1日以後辦理青年創業及啟動金貸款並移送信保基金保證，下列何者為是？以負責人名義申貸，歸戶金額在100萬元以下者，得徵提保證人以負責人名義申貸，逾100萬元者以2名保證人(含配偶或股東)為原則以事業體名義申貸者，依信保基金及承貸銀行規定辦理(如以經理權限辦理，徵提2名保證人)以上皆非•依青創貸款109年新制規定，若以事業體（企業）名義申貸者，其保證人之徵提係回歸承貸金融機構與信保基金之一般授信實務規定辦理（例如適用營業單位經理權限時，通常徵提 1至 2 名實際經營人或大股東擔任保證人），故 (3) 敘述為正確。•註：100 萬元以下青創案為簡化流程，原則上免提保證人。"},{"year":"109","no":31,"part":"第二部分","score":"1.5","ans":"2","topic":"I","stem":"下列何者非授信單位於知悉之日起二個月內通知信保基金信用惡化情事？","opts":["授信對象停止營業","未能依約分期攤還已超過三個月","授信對象或其負責人受票據交換所拒絕往來處分者","應繳付之利息延滯期間已超過三個月者"],"ana":["•(2) 錯誤：依據信保基金信用惡化（ weakening）通知規定，授信對象若<strong>未能依約分期攤還本金達「一個月」<\/strong>（或本息延滯一定時點）即屬信用惡化指標，而非「超過三個月」才要通知，故(2) 敘述非屬正確的通知期限判定。"],"labels":["1","2","3","4"],"plain":"下列何者非授信單位於知悉之日起二個月內通知信保基金信用惡化情事？授信對象停止營業未能依約分期攤還已超過三個月授信對象或其負責人受票據交換所拒絕往來處分者應繳付之利息延滯期間已超過三個月者•(2) 錯誤：依據信保基金信用惡化（ weakening）通知規定，授信對象若未能依約分期攤還本金達「一個月」（或本息延滯一定時點）即屬信用惡化指標，而非「超過三個月」才要通知，故(2) 敘述非屬正確的通知期限判定。"},{"year":"109","no":32,"part":"第二部分","score":"1.5","ans":"2","topic":"I","stem":"信保基金保證手續費，應於授信翌日起","opts":["7個曆日","7個營業日","5個曆日","5個營業日 內存入信保基金指定之帳戶"],"ana":["依據信保基金作業手冊，承貸銀行於對客戶貸放送保案件後，必須依限繳付保證手續費，其期限為：自<strong>授信翌日起「7 個營業日」<\/strong>內，將手續費劃撥存入信保基金之專戶，否則將影響保證效力。"],"labels":["1","2","3","4"],"plain":"信保基金保證手續費，應於授信翌 依保證金額按年計收，於授信翌日起一定曆日／營業日內繳納（依各版本要點）。逾期未展延：信用保證案件於到期後一定月數內未辦展延／分期且未通知逾期者，信保基金得逕行免除保證責任。各專案：深化中小企業專案貸款、微型創業鳳凰貸款、勞工紓困貸款、企業小頭家貸款之對象、額度、期限與保證成數為常考。⚠️ 異動（經濟部「青年創業貸款要點」第8、9點，2026.7.1 生效）：- 歸戶金額 150 萬元以下之部分，信保基金保證成數 9.5 成。- 歸戶 150 萬元以下者，僅得徵提代表人／負責人為保證人；逾 150 萬元者，以一人為原則。- 申貸金額 150 萬元以下者，得以「申請表」取代計畫書。- 移送信保者僅得移送「青年創業貸款」方案，不得移送其他方案。&gt;影響：青創相關舊題（109-30 為 109.8.1 版、112-04）之保證成數／保證人／文件規定，請以 2026.7.1 新版為準。"},{"letter":"J","title":"擔保品（不動產／動產／股票／有價證券／船舶／信託受益權）","meta":"本主題共 **30 題**：109-14、109-37、109-38、109-47、110-10、110-34、110-37、110-57、111-10、111-20、111-34、111-36、111-40、111-46、111-51、112-10、112-49、113-03、113-14、113-17、113-21、113-25、113-27、113-28、113-36、113-46、114-07、114-15、114-36、114-60","note":"<p><strong>適用細則<\/strong>：授信篇第6章（擔保事務通則）、第7章（有價證券擔保）、第9章（不動產擔保）、第10章（動產擔保交易）、第11章（船舶擔保）、擔保品鑑價應注意事項。<\/p><ul><li><strong>抵押權設定<\/strong>：企業戶一律採最高限額抵押權；設定期限、塗銷查詢作業、擔保物權連結條款為常考。<\/li><li><strong>股票擔保<\/strong>：不得受理公司以其本公司發行之股票為擔保；信評較差標的（TCRI 8、9、D 等）之限制。<\/li><li><strong>動產擔保<\/strong>：動產設定期限（原則貸放期限加一定年限）、信託占有之要件。<\/li><li><strong>特定金錢信託受益權質借<\/strong>：資產管理專區試辦，最高成數規定（試辦得放寬不以五成為限）。<\/li><li><strong>鑑價<\/strong>：房地時價總額鑑價、停車位成交案例之檢附規定。<\/li><\/ul>","change":"<ul><li><span style=\"color:var(--seal)\">⚠️<\/span>【擔保品鑑價應注意事項，2025.11.18 修正】(1) 含停車位 6 個以上、或停車位鑑價逾總鑑價 30% 以上者，應檢附<strong>三則<\/strong>可拆分／單獨出售之停車位成交案例，其餘至少一則；(2) 受託鑑價單位之<strong>鑑價資料保存年限由 20 年調整為 15 年<\/strong>（配合徵、授信卷宗保存年限調整為 15 年）。→ 凡舊題以「保存 20 年」為正解者，現行為 <strong>15 年<\/strong>。<\/li><li>【消金資產管理專區，115 年新增】倫巴底（Lombard）金融資產組合擔保融資、自益特定金錢信託受益權質借等新種擔保業務（114-15 已入題）。<\/li><\/ul>","questions":[{"year":"109","no":14,"part":"第一部分","score":"2","ans":"2","topic":"J","stem":"有關聲請法院委託臺灣金融資產服務股份有限公司（下稱臺灣金服公司）拍賣逾期放款(含呆帳)案件擔保物，下列何者有誤？A. 應事先以「處理逾期放款申請/報告書」逐案申請債權管理處核准B. 催收單位無須向法院聲請委託，得逕洽臺灣金服公司拍賣執行擔保物C. 委託臺灣金服公司拍賣所繳納之代辦費非屬於執行費用，不得向債務人求償","opts":["A","B","C","BC"],"ana":["•<strong>B 敘述錯誤<\/strong>：拍賣強制執行屬於法院之公權力。本行作為債權人，必須先向法院聲請強制執行，並於聲請時<strong>建請法院委託<\/strong>臺灣金服公司代為拍賣。催收單位<strong>絕對無法<\/strong>跳過法院，逕自洽請臺灣金服公司執行拍賣。","•A、C 均為正確實務作業：必須報經總行債管處核准，且金服公司之代辦費性質上不屬於法院法定強制執行費，無法向債務人求償。"],"labels":["1","2","3","4"],"plain":"有關聲請法院委託臺灣金融資產服務股份有限公司（下稱臺灣金服公司）拍賣逾期放款(含呆帳)案件擔保物，下列何者有誤？A. 應事先以「處理逾期放款申請/報告書」逐案申請債權管理處核准B. 催收單位無須向法院聲請委託，得逕洽臺灣金服公司拍賣執行擔保物C. 委託臺灣金服公司拍賣所繳納之代辦費非屬於執行費用，不得向債務人求償ABCBC•B 敘述錯誤：拍賣強制執行屬於法院之公權力。本行作為債權人，必須先向法院聲請強制執行，並於聲請時建請法院委託臺灣金服公司代為拍賣。催收單位絕對無法跳過法院，逕自洽請臺灣金服公司執行拍賣。•A、C 均為正確實務作業：必須報經總行債管處核准，且金服公司之代辦費性質上不屬於法院法定強制執行費，無法向債務人求償。"},{"year":"109","no":37,"part":"第二部分","score":"1.5","ans":"1","topic":"J","stem":"有關擔保品規範，下列何者為是？","opts":["動產除另有規定外，設定期限一律以貸放期限加五年為準","不動產新買賣案件(拍賣取得者除外)應於貸放後1個月內，至實價登錄網站查證","本行國內不動產設定金額一律以放款值辦理設定","借款人與擔保物提供人不同時，抵押權塗銷同意書不得由擔保物提供人單獨簽章領回"],"ana":["•(1) <strong>正確<\/strong>：依本行擔保事務及動產擔保交易法規範，為考量催收訴訟所需之合理作業緩衝期間，動產抵押設定之有效期限，<strong>原則上應以「貸放期限加計五年」<\/strong>辦理登記。","•(2) 錯誤：應於撥貸後「立即」或規定期限內（通常非 1 個月）核對。 (3) 錯誤：設定金額一般係按核貸金額之 1.2 倍辦理設定，而非直接按放款值設定。"],"labels":["1","2","3","4"],"plain":"有關擔保品規範，下列何者為是？動產除另有規定外，設定期限一律以貸放期限加五年為準不動產新買賣案件(拍賣取得者除外)應於貸放後1個月內，至實價登錄網站查證本行國內不動產設定金額一律以放款值辦理設定借款人與擔保物提供人不同時，抵押權塗銷同意書不得由擔保物提供人單獨簽章領回•(1) 正確：依本行擔保事務及動產擔保交易法規範，為考量催收訴訟所需之合理作業緩衝期間，動產抵押設定之有效期限，原則上應以「貸放期限加計五年」辦理登記。•(2) 錯誤：應於撥貸後「立即」或規定期限內（通常非 1 個月）核對。 (3) 錯誤：設定金額一般係按核貸金額之 1.2 倍辦理設定，而非直接按放款值設定。"},{"year":"109","no":38,"part":"第二部分","score":"1.5","ans":"4","topic":"J","stem":"下列有關徵取股票為擔保品之敘述何者有誤？","opts":["不得受理公司組織之企業以其本公司發行之股票辦理質押授信","以流動性較高之上市、上櫃公司股票為原則","倘貸放後之擔保品維持率低於140%時，應通知借保戶攤還部分借款 or 補足本行認可之擔保品","上市、上櫃公司股票放款金額最高不得超過鑑價金額之六成"],"ana":["•(4) 錯誤：依據行內有價證券質押放款成數表，徵提上市、上櫃股票為擔保品者，其貸放成數最高<strong>通常為「五成」<\/strong>（50%），以因應股市劇烈波動之市場風險，而非六成。"],"labels":["1","2","3","4"],"plain":"下列有關徵取股票為擔保品之敘述何者有誤？不得受理公司組織之企業以其本公司發行之股票辦理質押授信以流動性較高之上市、上櫃公司股票為原則倘貸放後之擔保品維持率低於140%時，應通知借保戶攤還部分借款 or 補足本行認可之擔保品上市、上櫃公司股票放款金額最高不得超過鑑價金額之六成•(4) 錯誤：依據行內有價證券質押放款成數表，徵提上市、上櫃股票為擔保品者，其貸放成數最高通常為「五成」（50%），以因應股市劇烈波動之市場風險，而非六成。"},{"year":"109","no":47,"part":"第二部分","score":"1.5","ans":"3","topic":"J","stem":"催收款經核准轉銷呆帳後，對於墊支逾幾年或經催討無法收回之各項催收費用，由承辦催收人員申請債權管理處 or 區域中心核准後，通知分行以「其他什項支出-催收各項費用」開支，並記入呆帳登記簿及辦理「呆帳-放款訴訟費用明細資料」交易建檔，並繼續催討。","opts":["5","3","2","1 年"],"ana":["為落實大額呆 3","4"],"plain":"有關擔保品之規範，下列敘述何者正確？動產除另有規定外，設定期限一律以貸放期限加五年為準借款人與擔保物提供人不同時，抵押權塗銷同意書不得由擔保物提供人單獨簽章領回不動產新買賣案件(拍賣取得者除外)應於貸放後1個月內至實價登錄網站查證本行不動產設定金額一律以放款值辦理設定•(1) 正確：動產擔保抵押，為保障行方催收訴訟時效，其設定有效期限，原則上均應以「貸放期限加五年」辦理登記。"},{"year":"110","no":57,"part":"第二部分","score":"1.5","ans":"4","topic":"J","stem":"下列有關免辦理徵信之敘述，何者錯誤？","opts":["對會員銀行之授信案件得酌情免辦理徵信","對政府機關及公營事業之授信案件得酌情免辦理徵信","提供本行定期存單十足擔保之授信案件得酌情免辦理徵信","辦理「稅捐記帳保證」及「商品(服務)禮券保證」之授信案件得免辦理徵信"],"ana":["•(4) 錯誤：依據銀行公會及行內徵信準則，「提供本行定期存單十足擔保」之授信案得酌情免辦徵信，但<strong>明文排除「稅捐記帳保證」及「商品（服務）禮券保證」，此兩者不論擔保品多寡，均一律「必須確實辦理徵信作業」<\/strong>。故 (4) 錯誤。"],"labels":["1","2","3","4"],"plain":"下列有關免辦理徵信之敘述，何者錯誤？對會員銀行之授信案件得酌情免辦理徵信對政府機關及公營事業之授信案件得酌情免辦理徵信提供本行定期存單十足擔保之授信案件得酌情免辦理徵信辦理「稅捐記帳保證」及「商品(服務)禮券保證」之授信案件得免辦理徵信•(4) 錯誤：依據銀行公會及行內徵信準則，「提供本行定期存單十足擔保」之授信案得酌情免辦徵信，但明文排除「稅捐記帳保證」及「商品（服務）禮券保證」，此兩者不論擔保品多寡，均一律「必須確實辦理徵信作業」。故 (4) 錯誤。"},{"year":"111","no":10,"part":"第一部分","score":"2","ans":"2","topic":"J","stem":"催收單位委託臺灣金融資產服務股份有限公司拍賣執行逾放 (含呆帳)案件之不動產或動產擔保品，下列敘述何者有誤？ A.應事先以「處理逾期放款申請/報告書」逐案申請債權管理處核准 B.催收單位無須向法院聲請委託 C.委託拍賣所繳納之代辦費非屬於執行費用，不得向債務人求償","opts":["A","B","C","BC"],"ana":["•<strong>B 錯誤<\/strong>：臺灣金服公司（AMC）執行拍賣仍須基於法院公權力委託。催收單位<strong>必須先向法院民事執行處聲請強制執行，並於聲請狀中建請法院委託臺灣金服公司代為拍賣<\/strong>，不能自行直接將案件移送給金服公司拍賣。故選 (2)。"],"labels":["1","2","3","4"],"plain":"催收單位委託臺灣金融資產服務股份有限公司拍賣執行逾放 (含呆帳)案件之不動產或動產擔保品，下列敘述何者有誤？ A.應事先以「處理逾期放款申請/報告書」逐案申請債權管理處核准 B.催收單位無須向法院聲請委託 C.委託拍賣所繳納之代辦費非屬於執行費用，不得向債務人求償ABCBC•B 錯誤：臺灣金服公司（AMC）執行拍賣仍須基於法院公權力委託。催收單位必須先向法院民事執行處聲請強制執行，並於聲請狀中建請法院委託臺灣金服公司代為拍賣，不能自行直接將案件移送給金服公司拍賣。故選 (2)。"},{"year":"111","no":20,"part":"第一部分","score":"2","ans":"3","topic":"J","stem":"依照銀行公會規範，下列有關免辦理徵信之敘述，何者錯誤？","opts":["對政府機關之授信案件得酌情免辦理徵信","辦理「稅捐記帳保證」之授信案件皆應辦理徵信","提供本人不同幣別之外匯定期存單設質十足擔保所申請之外匯授信案件，得免辦徵信","對會員銀行之授信案件得酌情免辦理徵信"],"ana":["•(3) <strong>錯誤<\/strong>：提供本人「同幣別」之定存單設質十足擔保得免辦徵信。但若為<strong>「不同幣別（跨幣別）」質借者，因存在外匯匯率波動之財產貶損風險，一律「必須確實辦理徵信作業」，不適用免辦簡化規定<\/strong>。故選 (3)。---"],"labels":["1","2","3","4"],"plain":"依照銀行公會規範，下列有關免辦理徵信之敘述，何者錯誤？對政府機關之授信案件得酌情免辦理徵信辦理「稅捐記帳保證」之授信案件皆應辦理徵信提供本人不同幣別之外匯定期存單設質十足 以借款人親領為限。"],"labels":["1","2","3","4"],"plain":"有關擔保品之規範，下列敘述何者為非？辦理抵押權塗銷查詢作業，查詢對象包括借款人及擔保物提供人借款人與擔保物提供人不同時，抵押權塗銷同意書不得由擔保物提供人簽章領回除另有規定外，動產設定期限一律以貸放期限加五年為準除拍賣取得者外，不動產新買賣案件應於貸放後 2 個月內至實價登錄網站查證•(2) 敘述錯誤：抵押權塗銷同意書為物權塗銷證明。由於「擔保物提供人」係屬該抵押物之合法所有權人，因此「抵押權塗銷同意書，得由該不同人之『擔保物提供人』單獨簽章並領回」，不以借款人親領為限。"},{"year":"113","no":3,"part":"第一部分","score":"2","ans":"3","topic":"J","stem":"有關不動產抵押權設定，下列敘述何者有誤？","opts":["設定金額原則上以放款值加二成或提高至鑑價金額範圍內辦理","如屬重估案件，其設定限額、貸放限額及設定年限(或擔保債權確定期日)均未變更，授權營業單位經理逕行核定","企業戶貸款抵押權設定之權利種類，應由客戶自行勾選採「最高限額」或「普通」抵押權設定","如受理「普通抵押權」設定申貸者，應申請總行或區域中心核准後辦理"],"ana":["•(3) <strong>錯誤<\/strong>：為保障行方債權，<strong>企業戶之抵押權設定權利種類，行內規範一律強制規定必須採「最高限額抵押權」設定<\/strong>，並不開放由企業客戶「自行勾選」普通抵押權。"],"labels":["1","2","3","4"],"plain":"有關不動產抵押權設定，下列敘述何者有誤？設定金額原則上以放款值加二成或提高至鑑價金額範圍內辦理如屬重估案件，其設定限額、貸放限額及設定年限(或擔保債權確定期日)均未變更，授權營業單位經理逕行核定企業戶貸款抵押權設定之權利種類，應由客戶自行勾選採「最高限額」或「普通」抵押權設定如受理「普通抵押權」設定申貸者，應申請總行或區域中心核准後辦理•(3) 錯誤：為保障行方債權，企業戶之抵押權設定權利種類，行內規範一律強制規定必須採「最高限額抵押權」設定，並不開放由企業客戶「自行勾選」普通抵押權。"},{"year":"113","no":14,"part":"第一部分","score":"2","ans":"4","topic":"J","stem":"有關「貸款衍生人身保險保費融資貸款」之規定，下列敘述何者錯誤？","opts":["對象須為本行不動產擔保貸款借款人","融資躉繳保費-擔保貸款，貸款期限最長 30 年","融資躉繳保費-信用貸款，授權營業單位經理最高核定額度新臺幣 100 萬元，惟與個人無擔保貸款歸戶後逾「個別分行授信權限額度核給範圍」者，仍應申請總行或區域中心核准後辦理","融資躉繳保費-信用貸款，設定第二順位抵押權作副擔保者，貸款期限最長 20 年"],"ana":["•(4) <strong>錯誤<\/strong>：保費融資信用貸款若增設第二順位抵押權作為副擔保（房貸連結型保費信用融資），其<strong>最長融資期限得比照主房貸之年期拉長至 30 年<\/strong>，非 20 年限制。"],"labels":["1","2","3","4"],"plain":"有關「貸款衍生人身保險保費融資貸款」之規定，下列敘述何者錯誤？對象須為本行不動產擔保貸款借款人融資躉繳保費-擔保貸款，貸款期限最長 30 年融資躉繳保費-信用貸款，授權營業單位經理最高核定額度新臺幣 100 萬元，惟與個人無擔保貸款歸戶後逾「個別分行授信權限額度核給範圍」者，仍應申請總行或區域中心核准後辦理融資躉繳保費-信用貸款，設定第二順位抵押權作副擔保者，貸款期限最長 20 年•(4) 錯誤：保費融資信用貸款若增設第二順位抵押權作為副擔保（房貸連結型保費信用融資），其最長融資期限得比照主房貸之年期拉長至 30 年，非 20 年限制。"},{"year":"113","no":17,"part":"第一部分","score":"2","ans":"4","topic":"J","stem":"下列敘述何者有誤？","opts":["因訴訟案件聲請假扣押執行所提存之擔保物，應於提供擔保之原因消滅之翌日起十年內儘速向該管法院提存所聲請返還，逾期其提存物屬於國庫","以本行總行名義為聲請人或原告、上訴人之訴訟案件，相關聲請狀、訴狀或委任書之本行法定代理人住所地，應一律以總行行址為住所地","自 113 年 7 月 1 日起，債權人聲請調查債務人之保險人名稱、保險種類或名稱之保險執行事件，請逕向債務人住居所地法院遞狀聲請，以節省時效","債權人收受假扣押或假處分裁定後已 20 日者，不得聲請執行"],"ana":["•(4) <strong>錯誤<\/strong>：債權人收受假扣押、假處分之裁定後，若<strong>「超過三十日（30日）者」，依法即不得聲請執行<\/strong>（法定保全執行期間為 30 日），而非 20 日。"],"labels":["1","2","3","4"],"plain":"下列敘述何者有誤？因訴訟案件聲請假扣押執行所提存之擔保物，應於提供擔保之原因消滅之翌日起十年內儘速向該管法院提存所聲請返還，逾期其提存物屬於國庫以本行總行名義為聲請人或原告、上訴人之訴訟案件，相關聲請狀、訴狀或委任書之本行法定代理人住所地，應一律以總行行址為住所地自 113 年 7 月 1 日起，債權人聲請調查債務人之保險人名稱、保險種類或名稱之保險執行事件，請逕向債務人住居所地法院遞狀聲請，以節省時效債權人收受假扣押或假處分裁定後已 20 日者，不得聲請執行•(4) 錯誤：債權人收受假扣押、假處分之裁定後，若「超過三十日（30日）者」，依法即不得聲請執行（法定保全執行期間為 30 日），而非 20 日。"},{"year":"113","no":21,"part":"第二部分","score":"1.5","ans":"2","topic":"J","stem":"如動產抵押案件授信餘額達 5,000 萬元(含)以上者，除每年辦理一次重估外，每隔多久應再辦理「擔保物(動產)勘查閱覽」建檔？","opts":["3 個月","6 個月","8 個月","無須辦理"],"ana":["•依據大額動產抵押放款管理要點，授信餘額在 5,000 萬元（含）以上之動產抵押授信案，為加強擔保物控管，經辦<strong>每隔「6 個月」應實地查勘動產狀況並辦理系統建檔登記一次<\/strong>。"],"labels":["1","2","3","4"],"plain":"如動產抵押案件授信餘額達 5,000 萬元(含)以上者，除每年辦理一次重估外，每隔多久應再辦理「擔保物(動產)勘查閱覽」建檔？3 個月6 個月8 個月無須辦理•依據大額動產抵押放款管理要點，授信餘額在 5,000 萬元（含）以上之動產抵押授信案，為加強擔保物控管，經辦每隔「6 個月」應實地查勘動產狀況並辦理系統建檔登記一次。"},{"year":"113","no":25,"part":"第二部分","score":"1.5","ans":"4","topic":"J","stem":"有關徵取股票為擔保品之授信，下列何者錯誤？","opts":["上市股票之鑑價以股票前一日收盤價與最近三個曆月之平均價孰低者","投資公司授信戶辦理股票質押授信，應徵提具體投資計畫","撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查","貸放後應注意股價變化，如擔保維持率低於130%，應即實行質權賣出股票，以確保本行債權"],"ana":["•(4) <strong>錯誤<\/strong>：貸放後若擔保維持率低於 130% 臨界紅線，應立即通知客戶於指定期限（如三個營業日）內補足質物或清償部分借款；<strong>行方絕不能在「未通知客戶補繳」之前，即逕自於當日將質押股票強制賣出處分<\/strong>。---"],"labels":["1","2","3","4"],"plain":"有關徵取股票為擔保品之授信，下列何者錯誤？上市股票之鑑價以股票前一日收盤價與最近三個曆月之平均價孰低者投資公司授信戶辦理股票質押授信，應徵提具體投資計畫撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查貸放後應注意股價變化，如擔保維持率低於130%，應即實行質權賣出股票，以確保本行債權•(4) 錯誤：貸放後若擔保維持率低於 130% 臨界紅線，應立即通知客戶於指定期限（如三個營業日）內補足質物或清償部分借款；行方絕不能在「未通知客戶補繳」之前，即逕自於當日將質押股票強制賣出處分。---"},{"year":"113","no":27,"part":"第二部分","score":"1.5","ans":"1","topic":"J","stem":"個人授信戶及法人授信戶申請增貸，所徵擔保品鑑價值分別達等值新臺幣多少元(含)以上，應填寫「運用擔保品洗錢及資恐交易態樣檢核表」？","opts":["500萬/1,000萬","400萬/800萬","300萬/600萬","500萬/800萬"],"ana":["•依防制洗錢內控規定，為控管高額不動產融資涉及洗錢風險，增貸案件其擔保品鑑價值若<strong>「個人戶達新臺幣 500 萬元（含）以上」<\/strong>，或 <strong>「法人戶達新臺幣 1,000 萬元（含）以上」<\/strong>，經辦應填製專用檢核表存卷。"],"labels":["1","2","3","4"],"plain":"個人授信戶及法人授信戶申請增貸，所徵擔保品鑑價值分別達等值新臺幣多少元(含)以上，應填寫「運用擔保品洗錢及資恐交易態樣檢核表」？500萬/1,000萬400萬/800萬300萬/600萬500萬/800萬•依防制洗錢內控規定，為控管高額不動產融資涉及洗錢風險，增貸案件其擔保品鑑價值若「個人戶達新臺幣 500 萬元（含）以上」，或 「法人戶達新臺幣 1,000 萬元（含）以上」，經辦應填製專用檢核表存卷。"},{"year":"113","no":28,"part":"第二部分","score":"1.5","ans":"1","topic":"J","stem":"營業單位辦理中長期融資，下列敘述何者不正確？","opts":["自其他金融機構轉貸之非聯貸代償案件，授信申請時，資金用途得勾選「05：償還同業貸款」或「63：其他」","不動產代償案件，若能於3個營業日內完成代償作業，並取得第1順位抵押權之案件，且借戶在原貸銀行之結欠餘額內代償者，授權營業單位經理得於『擔保授信』之權限額度範圍內逕以「擔保放款」項目貸放","中長期融資，得視實際情況酌定寬限期，原則依貸款期限六分之一範圍內訂定，最長不得超過5年","不動產代償案件，應於匯款傳票備註欄註明「代償不動產貸款，無法核發清償證明者請退匯」字樣"],"ana":["•(1) <strong>錯誤<\/strong>：依據建檔與撥貸規範，自他行轉貸之<strong>「非聯貸」代償放款，其資金用途「一律不得」勾選 05：償還同業貸款或 63：其他<\/strong>，該二用途代碼僅限於「聯貸案件」使用。"],"labels":["1","2","3","4"],"plain":"營業單位辦理中長期融資，下列敘述何者不正確？自其他金融機構轉貸之非聯貸代償案件，授信申請時，資金用途得勾選「05：償還同業貸款」或「63：其他」不動產代償案件，若能於3個營業日內完成代償作業，並取得第1順位抵押權之案件，且借戶在原貸銀行之結欠餘額內代償者，授權營業單位經理得於『擔保授信』之權限額度範圍內逕以「擔保放款」項目貸放中長期融資，得視實際情況酌定寬限期，原則依貸款期限六分之一範圍內訂定，最長不得超過5年不動產代償案件，應於匯款傳票備註欄註明「代償不動產貸款，無法核發清償證明者請退匯」字樣•(1) 錯誤：依據建檔與撥貸規範，自他行轉貸之「非聯貸」代償放款，其資金用途「一律不得」勾選 05：償還同業貸款或 63：其他，該二用途代碼僅限於「聯貸案件」使用。"},{"year":"113","no":36,"part":"第二部分","score":"1.5","ans":"2","topic":"J","stem":"有關本行辦理「聯合授信貸款」業務，下列何者為非？","opts":["徵有國內擔保品時，應依規辦理 e-Loan 系統建檔，設定金額及貸放限額應依參貸比率輸入","簽約前應審閱聯合授信合約各項條款是否與本行核准授信條件一致，統籌主辦案件由營業單位逕行會辦法務室","本行擔任額度管理行時，應先執行「參貸機構比例資料維護(A615)」建檔","簽約後，每月 5 日前上法人金融網填報「聯合授信個案資料表」，每月 25 日前填報「聯貸案件到期追蹤表」"],"ana":["•(2) <strong>錯誤<\/strong>：統籌主辦之聯貸案合約極為複雜，在簽約前，<strong>「絕對不能由營業單位逕行會辦法務室」<\/strong>。應依規層報<strong>總行法人金融業務處（或聯貸主責管理部門）<\/strong>統一進行專業合約會審及法務諮詢程序。"],"labels":["1","2","3","4"],"plain":"有關本行辦理「聯合授信貸款」業務，下列何者為非？徵有國內擔保品時，應依規辦理 e-Loan 系統建檔，設定金額及貸放限額應依參貸比率輸入簽約前應審閱聯合授信合約各項條款是否與本行核准授信條件一致，統籌主辦案件由營業單位逕行會辦法務室本行擔任額度管理行時，應先執行「參貸機構比例資料維護(A615)」建檔簽約後，每月 5 日前上法人金融網填報「聯合授信個案資料表」，每月 25 日前填報「聯貸案件到期追蹤表」•(2) 錯誤：統籌主辦之聯貸案合約極為複雜，在簽約前，「絕對不能由營業單位逕行會辦法務室」。應依規層報總行法人金融業務處（或聯貸主責管理部門）統一進行專業合約會審及法務諮詢程序。"},{"year":"113","no":46,"part":"第二部分","score":"1.5","ans":"2","topic":"J","stem":"對新接辦之逾期放款案件，催收單位應於接管多久時間及嗣後至少每年一次或不定期就不動產擔保品評估其價值？","opts":["2 個營業日內","當日","5 日內","1 個月內"],"ana":["•(2) <strong>正確<\/strong>：依據本行催收作業規範，對於新接管或接辦之逾放催收案，催收單位經辦<strong>應於「接管當日」<\/strong>，立即針對該案名下之不動產擔保品重新評估價值，以落實債權管理。"],"labels":["1","2","3","4"],"plain":"對新接辦之逾期放款案件，催收單位應於接管多久時間及嗣後至少每年一次或不定期就不動產擔保品評估其價值？2 個營業日內當日5 日內1 個月內•(2) 正確：依據本行催收作業規範，對於新接管或接辦之逾放催收案，催收單位經辦應於「接管當日」，立即針對該案名下之不動產擔保品重新評估價值，以落實債權管理。"},{"year":"114","no":7,"part":"第一部分","score":"2","ans":"1","topic":"J","stem":"有關徵取股票為擔保品之授信，下列敘述何者有誤？","opts":["上市股票之鑑價以股票前一日收盤價與最近二個曆月之平均價孰低者","投資公司授信戶辦理股票質押授信，應徵提具體投資計畫","撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查","貸放後應注意股價變化，如擔保維持率低於 120%，應即實行質權賣出股票，以確保本行債權"],"ana":["•(1) <strong>敘述錯誤<\/strong>：有價證券設質鑑價時，上市股票之價格計算，應以股票前一日收盤價與<strong>最近「三個」（而非二個）曆月之平均價孰低者<\/strong>為準。"],"labels":["1","2","3","4"],"plain":"有關徵取股票為擔保品之授信，下列敘述何者有誤？上市股票之鑑價以股票前一日收盤價與最近二個曆月之平均價孰低者投資公司授信戶辦理股票質押授信，應徵提具體投資計畫撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查貸放後應注意股價變化，如擔保維持率低於 120%，應即實行質權賣出股票，以確保本行債權•(1) 敘述錯誤：有價證券設質鑑價時，上市股票之價格計算，應以股票前一日收盤價與最近「三個」（而非二個）曆月之平均價孰低者為準。"},{"year":"114","no":15,"part":"第一部分","score":"2","ans":"2","topic":"J","stem":"本行試辦資產管理專區「以自益特定金錢信託受益權為擔保之質借業務，最高成數不以五成為限」，下列何者為非？","opts":["借戶限高資產客戶且須徵妥【地方資產管理專區商品及服務申請書】","商品風險等級低度(RR1)~中高(RR4)最高五成，高度(RR5)最高四成","僅新興分行試辦本業務，其他營業單位得轉介高資產客戶至新興分行承作","計算績效時，新興分行與高資產客戶之信託往來分行皆認列 100%"],"ana":["•(2) <strong>敘述錯誤<\/strong>：既然本專案之試辦目的在於 <strong>「放寬自益信託受益權質借之最高成數限制（不以五成為限）」<\/strong>，則 (2) 選項中依然硬性規定「低至中高度 RR1~RR4 最高僅五成、高度RR5 僅四成」之傳統緊縮規定，顯與專案試辦放寬之宗旨不符，故選 (2)。"],"labels":["1","2","3","4"],"plain":"本行試辦資產管理專區「以自益特定金錢信託受益權為擔保之質借業務，最高成數不以五成為限」，下列何者為非？借戶限高資產客戶且須徵妥【地方資產管理專區商品及服務申請書】商品風險等級低度(RR1)~中高(RR4)最高五成，高度(RR5)最高四成僅新興分行試辦本業務，其他營業單位得轉介高資產客戶至新興分行承作計算績效時，新興分行與高資產客戶之信託往來分行皆認列 100%•(2) 敘述錯誤：既然本專案之試辦目的在於 「放寬自益信託受益權質借之最高成數限制（不以五成為限）」，則 (2) 選項中依然硬性規定「低至中高度 RR1~RR4 最高僅五成、高度RR5 僅四成」之傳統緊縮規定，顯與專案試辦放寬之宗旨不符，故選 (2)。"},{"year":"114","no":36,"part":"第二部分","score":"1.5","ans":"4","topic":"J","stem":"個人授信戶及法人授信戶申請增貸，所徵擔保品鑑價值分別達等值新臺幣多少元(含)以上，應填寫「運用擔保品洗錢及資恐交易態樣檢核表」？","opt ":1,"part":"第一部分","score":"2","ans":"3","topic":"K","stem":"有關企業戶徵信報告之改編，下列何者為非？","opts":["每屆滿 1 年，即須重新徵取授信戶資料表，重新辦理徵信分析","於本行僅有授信總額在新臺幣 300 萬元以下之中長期不動產擔保放款，如信用狀況無重大變化，得免逐年改編","徵信報告有效期間內申請增貸時，若金融機構總授信金額未逾越原資料表範圍，然加計增貸金額後逾越原分行辦理徵信作業權限時，應立即改編","信用狀況如發生重大變化時，應即重新辦理徵信"],"ana":["•依據行內徵信報告改編規範，企業戶徵信報告原則上每屆滿 1 年應辦理改編。","•(3) <strong>敘述錯誤<\/strong>：在徵信報告有效期間內申請增貸，若金融機構總授信金額並未逾越原資料表適用之額度標準，即使因加計增貸金額而使該案件須超限委辦區域中心或總行（即逾越原營業單位辦理權限），<strong>僅須將原報告及相關資料移送委辦，並無必須「立即改編」整套報告之規定<\/strong>。"],"labels":["1","2","3","4"],"plain":"有關企業戶徵信報告之改編，下列何者為非？每屆滿 1 年，即須重新徵取授信戶資料表，重新辦理徵信分析於本行僅有授信總額在新臺幣 300 萬元以下之中長期不動產擔保放款，如信用狀況無重大變化，得免逐年改編徵信報告有效期間內申請增貸時，若金融機構總授信金額未逾越原資料表範圍，然加計增貸金額後逾越原分行辦理徵信作業權限時，應立即改編信用狀況如發生重大變化時，應即重新辦理徵信•依據行內徵信報告改編規範，企業戶徵信報告原則上每屆滿 1 年應辦理改編。•(3) 敘述錯誤：在徵信報告有效期間內申請增貸，若金融機構總授信金額並未逾越原資料表適用之額度標準，即使因加計增貸金額而使該案件須超限委辦區域中心或總行（即逾越原營業單位辦理權限），僅須將原報告及相關資料移送委辦，並無必須「立即改編」整套報告之規定。"},{"year":"112","no":2,"part":"第一部分","score":"2","ans":"1","topic":"K","stem":"阿壹公司金融機構總授信金額新臺幣 3 億元，下列何者情況應辦理中長期授信分析？A. 擬向本行申請建廠性質之中期借款時B. 短期授信展期續約超過一年以上時C. 已貸放之中期借款徵信報告屆期改編時","opts":["AB","AC","BC","ABC"],"ana":["•根據徵信準則及作業細則規定，凡金融機構總授信金額達新臺幣 2 億元以上者，於辦理以下授信時應增加中長期授信分析：","•<strong>A（建廠或擴充計畫等中長期非週轉金授信）<\/strong>：應增加建廠或擴充計畫分析與分期償還能力分析。","•<strong>B（短期授信展期續約超過一年以上者）<\/strong>：在法規上視同中長期週轉資金授信，達 2 億元以上者應加做償還能力與現金流量預估分析。","•C（既有中期放款屆期改編）若無新申請或異動，並非重啟上述前瞻性分析之特定時點。故選 (1)。"],"labels":["1","2","3","4"],"plain":"阿壹公司金融機構總授信金額新臺幣 3 億元，下列何者情況應辦理中長期授信分析？A. 擬向本行申請建廠性質之中期借款時B. 短期授信展期續約超過一年以上時C. 已貸放之中期借款徵信報告屆期改編時ABACBCABC•根據徵信準則及作業細則規定，凡金融機構總授信金額達新臺幣 2 億元以上者，於辦理以下授信時應增加中長期授信分析：•A（建廠或擴充計畫等中長期非週轉金授信）：應增加建廠或擴充計畫分析與分期償還能力分析。•B（短期授信展期續約超過一年以上者）：在法規上視同中長期週轉資金授信，達 2 億元以上者應加做償還能力與現金流量預估分析。•C（既有中期放款屆期改編）若無新申請或異動，並非重啟上述前瞻性分析之特定時點。故選 (1)。"},{"year":"112","no":6,"part":"第一部分","score":"2","ans":"1","topic":"K","stem":"辦理「外銷貸款」業務，下列敘述何者為非？","opts":["有關洗錢高風險客戶加強查核措施：倘為出口後交易者，應逐筆徵取發票及運送相關文件進行查核，惟得申請總行或區域中心免徵","辦理出口託收貸款，貸款期限應依融資日起至預計貨款收妥之日訂定，但最長不得超過六個月為原則，且不得超過保險證明書有效期限","辦理出口週轉金貸款，應一律向區域中心、授信審核處申請","辦理出口信用狀貸款，貸款到期日不得超過信用狀有效期限及單據提示期限"],"ana":["•(1) <strong>敘述錯誤<\/strong>：針對洗錢及資恐高風險客戶辦理出口後外銷貸款（O/A 融資等），為確保交易自償性與防堵虛偽貿易，<strong>內規強制規定必須逐筆徵提發票、提單（運送單據）覈實查核，此屬於硬性防制洗錢遵循紅線，不得申請免徵<\/strong>。"],"labels":["1","2","3","4"],"plain":"辦理「外銷貸款」業務，下列敘述何者為非？有關洗錢高風險客戶加強查核措施：倘為出口後交易者，應逐筆徵取發票及運送相關文件進行查核，惟得申請總行或區域中心免徵辦理出口託收貸款，貸款期限應依融資日起至預計貨款收妥之日訂定，但最長不得超過六個月為原則，且不得超過保險證明書有效期限辦理出口週轉金貸款，應一律向區域中心、授信審核處申請辦理出口信用狀貸款，貸款到期日不得超過信用狀有效期限及單據提示期限•(1) 敘述錯誤：針對洗錢及資恐高風險客戶辦理出口後外銷貸款（O/A 融資等），為確保交易自償性與防堵虛偽貿易，內規強制規定必須逐筆徵提發票、提單（運送單據）覈實查核，此屬於硬性防制洗錢遵循紅線，不得申請免徵。"},{"year":"112","no":13,"part":"第一部分","score":"2","ans":"3","topic":"K","stem":"關於辦理徵信查詢聯徵中心信用資訊相關應注意事項，下列敘述何者為非？","opts":["退件或拒貸之案件，當事人同意書應併同信用資訊表自查詢日起保留 5 年","如遇當事人要求撤回授信申貸案件並退回所有申請文件時，應儘可能保留當事人同意書等查詢資格要件正本，或預先將相關文件影印留存","各單位應指定專人每週列印查詢紀錄資訊","指定專人列印之查詢紀錄資訊應設專卷保留 5 年備查"],"ana":["•(3) <strong>敘述錯誤<\/strong>：為落實最嚴格的個人資料保護與資訊安全稽核，各營業單位必須指定專人<strong>「每日」<\/strong>（而非每週）列印信用資訊查詢紀錄日報表進行查對核備，以勾稽有無未經授權之違規查詢。"],"labels":["1","2","3","4"],"plain":"關於辦理徵信查詢聯徵中心信用資訊相關應注意事項，下列敘述何者為非？退件或拒貸之案件，當事人同意書應併同信用資訊表自查詢日起保留 5 年如遇當事人要求撤回授信申貸案件並退回所有申請文件時，應儘可能保留當事人同意書等查詢資格要件正本，或預先將相關文件影印留存各單位應指定專人每週列印查詢紀錄資訊指定專人列印之查詢紀錄資訊應設專卷保留 5 年備查•(3) 敘述錯誤：為落實最嚴格的個人資料保護與資訊安全稽核，各營業單位必須指定專人「每日」（而非每週）列印信用資訊查詢紀錄日報表進行查對核備，以勾稽有無未經授權之違規查詢。"},{"year":"112","no":14,"part":"第一部分","score":"2","ans":"4","topic":"K","stem":"關於財務比率之敘述，下列何者為非？","opts":["負債比率愈高代表財務狀況愈不穩固","固定長期適合率超過 100%時，企業有侵用長期資金，移作長期性運用之疑慮","流動比率愈低，其短期償債能力則趨弱","營業週期 = 應收款項週轉天數 + 存貨週轉天數 - 應付款項週轉天期"],"ana":["•(4) <strong>敘述錯誤<\/strong>：在財務會計與徵信分析中：","•<strong>營業週期（Operating Cycle） = 應收款項週轉天數 + 存貨週轉天數<\/strong>。","•若再「減去應付款項週轉天數」，其計算出的指標稱為 <strong>「淨營業週期」或「現金轉換週期」（Cash Conversion Cycle）<\/strong>。"],"labels":["1","2","3","4"],"plain":"關於財務比率之敘述，下列何者為非？負債比率愈高代表財務狀況愈不穩固固定長期適合率超過 100%時，企業有侵用長期資金，移作長期性運用之疑慮流動比率愈低，其短期償債能力則趨弱營業週期 = 應收款項週轉天數 + 存貨週轉天數 - 應付款項週轉天期•(4) 敘述錯誤：在財務會計與徵信分析中：•營業週期（Operating Cycle） = 應收款項週轉天數 + 存貨週轉天數。•若再「減去應付款項週轉天數」，其計算出的指標稱為 「淨營業週期」或「現金轉換週期」（Cash Conversion Cycle）。"},{"year":"112","no":21,"part":"第二部分","score":"1.5","ans":"4","topic":"K","stem":"有關徵信作業注意事項，下列敘述何者為非？","op ）、各項週轉率／週轉天期。<\/li><li><strong>財務惡化警訊<\/strong>：應收款項週轉天期顯著拉長、存貨異常增加、關係人交易異常等。<\/li><li><strong>現金流量表<\/strong>：營業／投資／籌資活動現金流之意義與運用。<\/li><li><strong>產業分析<\/strong>：產品生命週期（導入、成長、成熟、衰退）各階段特性與風險；產業 SWOT、CNR 產經徵信查詢系統。<\/li><\/ul>","change":"","questions":[{"year":"109","no":56,"part":"第二部分","score":"1.5","ans":"4","topic":"L","stem":"辦理財務分析時，下列何者非企業財務狀況惡化之警訊？","opts":["應收款項週轉天期顯著拉長","連續多期CFO呈淨流出","應付款項付現天數大幅縮短且預付款項大增","營業週期大幅縮短"],"ana":["•(4) <strong>非惡化警訊<\/strong>：<strong>「營業週期大幅縮短」<\/strong> 代表企業從採購原料、生產、銷售至收回現金的流轉速度變快（效率提升、存貨與應收帳款積壓時間減少），<strong>屬於營運效率改善之正面指標<\/strong>，並非財務惡化警訊。其餘 (1)、(2)、(3) 均代表營運資金被積壓或現金流流失，屬典型危機警訊。"],"labels":["1","2","3","4"],"plain":"辦理財務分析時，下列何者非企業財務狀況惡化之警訊？應收款項週轉天期顯著拉長連續多期CFO呈淨流出應付款項付現天數大幅縮短且預付款項大增營業週期大幅縮短•(4) 非惡化警訊：「營業週期大幅縮短」 代表企業從採購原料、生產、銷售至收回現金的流轉速度變快（效率提升、存貨與應收帳款積壓時間減少），屬於營運效率改善之正面指標，並非財務惡化警訊。其餘 (1)、(2)、(3) 均代表營運資金被積壓或現金流流失，屬典型危機警訊。"},{"year":"109","no":59,"part":"第二部分","score":"1.5","ans":"4","topic":"L","stem":"關於各項財務分析指標之敘述，下列何者正確？","opts":["速動資產=現金及約當現金+短期性之投資+應收款項淨額+存貨淨額","負債比率又稱「槓桿比率」，比率愈高代表財務狀況愈穩定","固定長期適合率超過100%時，企業有侵用長期資金，移作短期性運用之疑慮","以上皆非"],"ana":["•(1) 錯誤：<strong>速動資產必須扣除變現性最慢之「存貨」與「預付款項」<\/strong>，其定義不應包含存貨淨額。","•(2) 錯誤：負債比率愈高，代表財務槓桿愈大、利息負擔沉重，其<strong>穩定性應為變差<\/strong>，而非愈穩定。","•(3) 錯誤：<strong>固定長期適合率高於 100%<\/strong>，代表企業之固定資產（長期資產）金額已大於其股東權益與長期負債之和，顯示企業係利用「短期資金」來購置固定資產（即 <strong>「以短支長」<\/strong> ），這會造成短期償債壓力劇增，而非將長期資金挪作短期運用。","•故 (1)、(2)、(3) 均有理論或法律定義錯誤，答案選 (4) 以上皆非。"],"labels":["1","2","3","4"],"plain":"關於各項財務分析指標之敘述，下列何者正確？速動資產=現金及約當現金+短期性之投資+應收款項淨額+存貨淨額負債比率又稱「槓桿比率」，比率愈高代表財務狀況愈穩定固定長期適合率超過100%時，企業有侵用長期資金，移作短期性運用之疑慮以上皆非•(1) 錯誤：速動資產必須扣除變現性最慢之「存貨」與「預付款項」，其定義不應包含存貨淨額。•(2) 錯誤：負債比率愈高，代表財務槓桿愈大、利息負擔沉重，其穩定性應為變差，而非愈穩定。•(3) 錯誤：固定長期適合率高於 100%，代表企業之固定資產（長期資產）金額已大於其股東權益與長期負債之和，顯示企業係利用「短期資金」來購置固定資產（即 「以短支長」 ），這會造成短期償債壓力劇增，而非將長期資金挪作短期運用。•故 (1)、(2)、(3) 均有理論或法律定義錯誤，答案選 (4) 以上皆非。"},{"year":"109","no":60,"part":"第二部分","score":"1.5","ans":"3","topic":"L","stem":"關於產品生命週期各階段之特性或風險，下列敘述何者錯誤？","opts":["導入期：市場規模尚小，產業前景具較高不確定性","成長期：需求快速成長，潛在競爭者之威脅達 」之中長期放款，","•依規定，達 2 億元以上之非週轉金性質中長期授信，<strong>必須全數徵提預估財務三表、營運計畫，以及「D. 個案預計資金來源去路表」與「建廠進度表」<\/strong>。故選 (3) ABCDE。"],"labels":["1","2","3","4"],"plain":"某企業擬向本行申請資本性支出之中期授信新臺幣1.5億元，經查其聯徵中心歸戶餘額新臺幣0.5億元(已扣除存單質借、出口押匯及進口押匯之金額)，請問應向客戶徵取之中長期資料有哪些？A. 現金流量預估表 B. 預估綜合損益表 C. 預估資產負債表 D. 個案預計資金來源去路表及建廠進度表 E. 營運計畫ABCABCEABCDE無須加徵中長期資料•該戶金融機構歸戶 0.5 億加計本次申請 1.5 億，其「總授信金額」已達 新臺幣 2 億元。•由於申貸用途為「資本性支出（非週轉金）」之中長期放款，•依規定，達 2 億元以上之非週轉金性質中長期授信，必須全數徵提預估財務三表、營運計畫，以及「D. 個案預計資金來源去路表」與「建廠進度表」。故選 (3) ABCDE。"},{"year":"113","no":20,"part":"第一部分","score":"2","ans":"3","topic":"L","stem":"有關財務比率分析，下列何者錯誤？","opts":["本金利息保障倍數一般用於長期償債能力分析","流動比率如果高於100%，表示企業流動資產足以償還現有之流動債務","現金週期=應收款項週轉天數+存貨週轉天數","速動資產=現金及約當現金+短期性之投資+應收款項淨額"],"ana":["•(3) <strong>錯誤<\/strong>：<strong>「營業週期」 = 應收款項週轉天數 + 存貨週轉天數<\/strong>。而 <strong>「現金週期」（現金轉換週期）在計算上必須再「扣除應付款項週轉天數」<\/strong>，非兩者天數直接相加。---"],"labels":["1","2","3","4"],"plain":"有關財務比率分析，下列何者錯誤？本金利息保障倍數一般用於長期償債能力分析流動比率如果高於100%，表示企業流動資產足以償還現有之流動債務現金週期=應收款項週轉天數+存貨週轉天數速動資產=現金及約當現金+短期性之投資+應收款項淨額•(3) 錯誤：「營業週期」 = 應收款項週轉天數 + 存貨週轉天數。而 「現金週期」（現金轉換週期）在計算上必須再「扣除應付款項週轉天數」，非兩者天數直接相加。---"},{"year":"113","no":58,"part":"第二部分","score":"1.5","ans":"3","topic":"L","stem":"某股份有限公司之負債比率為 350%，請問下列何項變動可改善該公司之負債比率？","opts":["實收股本減資彌補虧損","增加發行公司債","現金增資","向關係人借款增加"],"ana":["•負債比率 = 負債總額 ÷ 股東權益（分母為淨值）。","•(1) 減資彌補虧損，僅是股東權益內部科目互轉，不變更權益總額，無法改善負債比。","•(2)、(4) 增加發行公司債與借款，會使分子負債總額上升，負債比進一步惡化。","•(3) <strong>現金增資<\/strong>：會使資產與股東權益（淨值）同步增加，在負債不變下，分母股東權益擴大，<strong>能確實且直接「降低並改善該公司之負債比率」<\/strong>。故選 (3)。"],"labels":["1","2","3","4"],"plain":"某股份有限公司之負債比率為 350%，請問下列何項變動可改善該公司之負債比率？實收股本減資彌補虧損增加發行公司債現金增資向關係人借款增加•負債比率 = 負債總額 ÷ 股東權益（分母為淨值）。•(1) 減資彌補虧損，僅是股東權益內部科目互轉，不變更權益總額，無法改善負債比。•(2)、(4) 增加發行公司債與借款，會使分子負債總額上升，負債比進一步惡化。•(3) 現金增資：會使資產與股東權益（淨值）同步增加，在負債不變下，分母股東權益擴大，能確實且直接「降低並改善該公司之負債比率」。故選 (3)。"},{"year":"114","no":10,"part":"第一部分","score":"2","ans":"3","topic":"L","stem":"A 股份有限公司之負債比率達 420%，請問下列何者可改善該公司之負債比率？","opts":["實收股本減資彌補虧損","提撥法定盈餘公積","現金增資","向關係人增加貸款"],"ana":["•負債比率 = 負債總額 ÷ 股東權益（淨值）。","•辦理 <strong>「(3) 現金增資」<\/strong> 會使公司股東權益（分母）增加，在負債總額不變下，能確實且直接<strong>改善並降低負債比率<\/strong>。其餘減資彌補虧損或公積撥轉僅是權益內部調整，不影響權益總額。---"],"labels":["1","2","3","4"],"plain":"A 股份有限公司之負債比率達 420%，請問下列何者可改善該公司之負債比率？實收股本減資彌補虧損提撥法定盈餘公積現金增資向關係人增加貸款•負債比率 = 負債總額 ÷ 股東權益（淨值）。•辦理 「(3) 現金增資」 會使公司股東權益（分母）增加，在負債總額不變下，能確實且直接改善並降低負債比率。其餘減資彌補虧損或公積撥轉僅是權益內部調整，不影響權益總額。---"},{"year":"114","no":11,"part":"第一部分","score":"2","ans":"送分","topic":"L","stem":"有關財務報表之敘述，何者錯誤？","opts":["資產負債表係表達特定期間經營結果，為靜態報表","綜合損益表係表達特定期間之財務績效，為動態報表","權益變動表係表達特定期間權益之變動情形，為動態報表","現金流量表係說明特定期間之營業及籌資活動現金流量之報表，為動態報表"],"ana":["•本題因 (1) 敘述「資產負債表係表達特定期間經營結果，為靜態報表」中，前半句關於經營結果之描述與後半句靜態報表有文義矛盾（表達特定期間經營結果者為損益表，資產負債表係表達特定時點之財務狀況），且 (4) 之現金流量表漏列「投資活動」，各選項敘述皆存在瑕疵，故<strong>官方最終公布此題一律「送分」<\/strong>。"],"labels":["1","2","3","4"],"plain":"有關財務報表之敘述，何者錯誤？資產負債表係表達特定期間經營結果，為靜態報表綜合損益表係表達特定期間之財務績效，為動態報表權益變動表係表達特定期間權益之變動情形，為動態報表現金流量表係說明特定期間之營業及籌資活動現金流量之報表，為動態報表•本題因 (1) 敘述「資產負債表係表達特定期間經營結果，為靜態報表」中，前半句關於經營結果之描述與後半句靜態報表有文義矛盾（表達特定期間經營結果者為損益表，資產負債表係表達特定時點之財務狀況），且 (4) 之現金流量表漏列「投資活動」，各選項敘述皆存在瑕疵，故官方最終公布此題一律「送分」。"},{"year":"114","no":45,"part":"第二部分","score":"1.5","ans":"2","topic":"L","stem":"下列有關財務比率之敘述，何者正確？","opts":["速動資產=現金及約當現金+短期性之投資+應收款項庫額+存貨淨額","速動比率係測知企業緊急之償債能力，比率愈高表示緊急償債能力愈強","流動比率又稱酸性測驗比率，係測知企業償債能力之基本比率","營業週期=應收款項週轉天數+存貨週轉天數-應付款項週轉天期"],"ana":["•(2) <strong>正確<\/strong>：速動比率（Acid-test Ratio）排除了變現性慢之存貨與預付款，最能精確衡量企業在短期內之「緊急償債能力」。","•(1) 錯誤：速動資產計算中，存貨必須予以扣除，不含存貨淨額。","•(3) 錯誤：酸性測驗比率指的是「速動比率」，而非流動比率。","•(4) 錯誤：減去應付款天期後之公式稱為「現金週期/現金轉換週期」。---"],"labels":["1","2","3","4"],"plain":"下列有關財務比率之敘述，何者正確？速動資產=現金及約當現金+短期性之投資+應收款項庫額+存貨淨額速動比率係測知企業緊急之償債能力，比率愈高表示緊急償債能力愈強流動比率又稱酸性測驗比率，係測知企業償債能力之基本比率營業週期=應收款項週轉天數+存貨週轉天數-應付款項週轉天期•(2) 正確：速動比率（Acid-test Ratio）排除了變現性慢之存貨與預付款，最能精確衡量企業在短期內之「緊急償債能力」。•(1) 錯誤：速動資產計算中，存貨必須予以扣除，不含存貨淨額。•(3) 錯誤：酸性測驗比率指的是「速動比率」，而非流動比率。•(4) 錯誤：減去應付款天期後之公式稱為「現金週期/現金轉換週期」。---"},{"year":"114","no":48,"part":"第二部分","score":"1.5","ans":"2","topic":"L","stem":"A 企業擬向本行申請「週轉金」性質之中長期授信新臺幣 1.5 億元，經查其聯徵中心歸戶餘額新臺幣 0.5 億元(已扣除存單質借、出口押匯及進口押匯之金額)，請問應徵取之中長期資料有哪些？A.現金流量預估表 B.預估綜合損益表 C.預估資產負債表 D.個案預計資金來源去路表 E.營運計畫","opts":["ABC","ABCE","ABCDE","無須加徵中長期資料"],"ana":["•本案總授信金額（0.5億 + 1.5億）已達 <strong>新臺幣 2 億元<\/strong>。","•由於申貸之資金用途為 <strong>「週轉金性質」<\/strong> 之中長期融資，","•依規定，總授信金額達 2 億元以上之週轉金性質中長期授信，<strong>應徵提：A. 現金流量預估表、B. 預估綜合損益表、C. 預估資產負債表、E. 營運計畫書<\/strong>。","•<strong>D.「個案預計資金來源去路表」僅在申貸「資本支出（如建廠、買設備等非週轉金）」時才需要加徵<\/strong>，故本週轉金案免提 D，選 (2) ABCE。---"],"labels":["1","2","3","4"],"plain":"A 企業擬向本行申請「週轉金」性質之中長期授信新臺幣 1.5 億元，經查其聯徵中心歸戶餘額新臺幣 0.5 億元(已扣除存單質借、出口押匯及進口押匯之金額)，請問應徵取之中長期資料有哪些？A.現金流量預估表 B.預估綜合損益表 C.預估資產負債表 D.個案預計資金來源去路表 E.營運計畫ABCABCEABCDE無須加徵中長期資料•本案總授信金額（0.5億 + 1.5億）已達 新臺幣 2 億元。•由於申貸之資金用途為 「週轉金性質」 之中長期融資，•依規定，總授信金額達 2 億元以上之週轉金性質中長期授信，應徵提：A. 現金流量預估表、B. 預估綜合損益表、C. 預估資產負債表、E. 營運計畫書。•D.「個案預計資金來源去路表」僅在申貸「資本支出（如建廠、買設備等非週轉金）」時才需要加徵，故本週轉金案免提 D，選 (2) ABCE。---"}],"plain":"適用細則：徵信篇第3章（財務分析）、第4章（IFRSs）、第6章（現金流量表）、第7章（產業分析）。財務比率：負債比率（槓桿比率，測外來與自有資金比）、流動比率、速動比率（速動資產＝流動資產−存貨−預付費用）、各項週轉率／週轉天期。財務惡化警訊：應收款項週轉天期顯著拉長、存貨異常增加、關係人交易異常等。現金流量表：營業／投資／籌資活動現金流之意義與運用。產業分析：產品生命週期（導入、成長、成熟、衰退）各階段特性與風險；產業 SWOT、CNR 產經徵信查詢系統。"},{"letter":"N","title":"外匯授信・信用狀・進出口・大陸暨境外","meta":"本主題共 **12 題**：109-05、109-23、109-24、110-21、111-23、111-24、111-33、112-37、113-31、114-29、114-30、114-31","note":"<p><strong>適用細則<\/strong>：授信篇第37章（外匯授信通則）～第50章（進出口、外幣貸款、境外及大陸法人融資）。<\/p><ul><li><strong>出口／進口週轉金外幣貸款<\/strong>：貸款幣別依交易幣別、以本行掛牌者為限等。<\/li><li><strong>信用狀<\/strong>：國內即期信用狀墊款後清償天期、遠期信用狀業務。<\/li><li><strong>外匯定期存款質借外幣<\/strong>：質借幣別與存單幣別不同時之成數限制（較同幣別低）。<\/li><li><strong>大陸暨境外<\/strong>：OBU 辦理大陸地區法人融資之契約份數與留存、大陸暴險風險移轉（保證或擔保品）之審慎控管。<\/li><\/ul>","change":"<ul><li>【法金處 2025-2026】為提升外幣貸款申貸效率，修訂外幣貸款業務相關規範；另辦理綠電購電方新增企業電力承購商之融資規範。<\/li><\/ul>","questions":[{"year":"109","no":5,"part":"第一部分","score":"2","ans":"3","topic":"N","stem":"本行OBU辦理大陸地區法人融資業務時，與借款人共同簽立銀行借款合同一式三份，一份本行留存、一份借款人留存，另一份應交由借款人轉送","opts":["大陸地區人民銀行","大陸地區銀監局","大陸地區外匯管理局","中央銀行 辦理外債登記"],"ana":["大陸地區境內法人向境外金融機構（包括本行 OBU 及海外分行）借款時，依據中國大陸外匯管理法規，屬於「外債」範疇。借款人（大陸法人）依法必須在合同簽署後，向其所在地的 <strong>「國家外匯管理局」（SAFE）<\/strong> 辦理外債登記手續，否則資金將無法合法匯入或辦理後續還本付息 ns":"2","topic":"P","stem":"借據之本金請求權，時效期限為十五年，其利息之請求權時效期間為","opts":["二年","五年","六年","十年"],"ana":["•依民法第 126 條，利息、違約金、租金等定期給付之債權，其<strong>利息請求權之消滅時效期間為「(2) 五年」<\/strong>（本金請求權時效則為十五年）。---"],"labels":["1","2","3","4"],"plain":"借據之本金請求權，時效期限為十五年，其利息之請求權時效期間為二年五年六年十年•依民法第 126 條，利息、違約金、租金等定期給付之債權，其利息請求權之消滅時效期間為「(2) 五年」（本金請求權時效則為十五年）。---"}],"plain":"適用細則：授信篇第55～63章（不良授信管理、催收、逾期放款帳務、消滅時效、保全程序、訴訟程序、終局執行、呆帳轉銷）。消滅時效：借據本金請求權時效 15 年、利息請求權時效 5 年；票據、支付命令等另有時效與中斷規定。支付命令：送達債務人逾 20 日 未提出異議即確定（得為執行名義）。債權憑證：時效檢視、換發、正本保管（催收主管定期檢視、每一定期間盤點）。抵銷：對催收及呆帳債務人辦理抵銷達一定金額以上須填製報表並陳核。呆帳轉銷／催收費用：轉銷後墊支逾一定年限或無法收回之催收費用之申請流程。信用授信違約逾期案件：以「信用授信違約逾期案件通報表」通報債權管理處之情形。【債權管理處 2025-2026】函布「辦理逾期放款案件查找財產暨執行作業應注意事項」、常見催收缺失態樣（未參與分配、未強制執行等）、寄存款須用新版約定書（第 18 版）、債權憑證換發之定期檢視。【債權管理處 2026.07】重申逾放（含呆帳）案件債務人和解／協議還款作業：減免本金或逾授權範圍之利息、費用者，須以「處理逾期放款申請／報告書」事先報總行審核；申請免除保證（票據）責任者須填「和解執行評估表」報債權管理處。【因應國際情勢韌性特別條例】相關展延／協處之特別規定。"},{"letter":"S","title":"票據授信・永續金融・對保・其他","meta":"本主題共 **4 題**：111-39、113-53、114-28、114-33","note":"<p><strong>適用細則<\/strong>：授信篇第14章（貼現）、第15章（墊付國內票款）、第33章（票據承兌）、授信對保應注意事項、赤道原則作業要點、永續／綠色授信規範。<\/p><ul><li><strong>間接授信<\/strong>：開發國內外信用狀、保證、承兌等屬間接授信；透支、出口押匯、貼現屬直接授信（依題目定義為準）。<\/li><li><strong>本票（禁止背書轉讓）<\/strong>：所徵本票抬頭人、背書轉讓限制之票據處理。<\/li><li><strong>對保作業<\/strong>：借（契）據審閱期間（至少 5 日）、對保日不得早於主債務人、立據日／對保日／核准日之先後順序、影本加蓋腰型章等。<\/li><li><strong>赤道原則<\/strong>：企業授信戶「赤道原則適用性檢核表」之填製對象。<\/li><li><strong>綠色授信<\/strong>：適用原則四要素（資金用途、資金管理、資金追蹤、驗證等）。<\/li><\/ul>","change":"<ul><li>【2026.07 授信審查作業應行注意事項 v3】配合本行董事會設置<strong>審計委員會<\/strong>，刪除「常駐監察人參與討論」之規定；融資租賃業授信另訂「國內營業單位辦理融資租賃公司授信應行注意事項」規範。<\/li><li>【授信審核處】整編「授信對保應注意事項」、修訂不動產擔保物權塗銷相關權利文件領回規範。<\/li><li>【法金處】辦理「永續金融優惠授信專案」（善盡財務供應鏈社會責任）。<\/li><\/ul>","questions":[{"year":"111","no":39,"part":"第二部分","score":"1.5","ans":"1","topic":"S","stem":"依授信往來之約定及辦理對保相關規範，何者錯誤？","opts":["約定書之簽章可與印鑑卡正面之右下方印鑑簽章不同","借據所蓋圖章應與印鑑卡印鑑式樣欄之印鑑相符","對保時，應查核借戶雙重身分證明，並影印留存主要身分證明文件","應查詢借 戶之身分證遺失補領情形並列印存卷備查"],"ana":["•(1) <strong>錯誤<\/strong>：辦理授信往來及對保時，客戶親簽或蓋章之「約定書」，<strong>其印鑑與簽章式樣「必須與印鑑卡正面右下方之存驗印鑑完全一致」<\/strong>，絕不能不符。故選 (1)。"],"labels":["1","2","3","4"],"plain":"依授信往來之約定及辦理對保相關規範，何者錯誤？約定書之簽章可與印鑑卡正面之右下方印鑑簽章不同借據所蓋圖章應與印鑑卡印鑑式樣欄之印鑑相符對保時，應查核借戶雙重身分證明，並影印留存主要身分證明文件應查詢借 戶之身分證遺失補領情形並列印存卷備查•(1) 錯誤：辦理授信往來及對保時，客戶親簽或蓋章之「約定書」，其印鑑與簽章式樣「必須與印鑑卡正面右下方之存驗印鑑完全一致」，絕不能不符。故選 (1)。"},{"year":"113","no":53,"part":"第二部分","score":"1.5","ans":"3","topic":"S","stem":"有關查詢聯徵中心信用資訊之作業，下列敘述何者錯誤？","opts":["各單位應每日列印查詢紀錄資訊，經查詢人員蓋章及主管覆核","退件或拒貸之案件，當事人同意書應併同信用資訊表自查詢日起保留 5 年","查询聯徵中心所得之信用資訊可供行銷業務使用","須符合授信業務目的，並取得當事人同意或與當事人有契約或類似契約關係者，始得查詢"],"ana":["•(3) <strong>錯誤<\/strong>：依據聯徵中心及個資保護規範，發查所得之信用資訊僅能於該筆「授信業務、事後債權管理」之特定目的內使用，<strong>「絕對不能」變相提供予財富管理、信用卡推廣等非授信之其他行銷業務流用<\/strong>。"],"labels":["1","2","3","4"],"plain":"有關查詢聯徵中心信用資訊之作業，下列敘述何者錯誤？各單位應每日列印查詢紀錄資訊，經查詢人員蓋章及主管覆核退件或拒貸之案件，當事人同意書應併同信用資訊表自查詢日起保留 5 年查询聯徵中心所得之信用資訊可供行銷業務使用須符合授信業務目的，並取得當事人同意或與當事人有契約或類似契約關係者，始得查詢•(3) 錯誤：依據聯徵中心及個資保護規範，發查所得之信用資訊僅能於該筆「授信業務、事後債權管理」之特定目的內使用，「絕對不能」變相提供予財富管理、信用卡推廣等非授信之其他行銷業務流用。"},{"year":"114","no":28,"part":"第二部分","score":"1.5","ans":"1","topic":"S","stem":"下列何者不符合綠色授信的適用原則四項核心構成要素？","opts":["驗證","資金用途","資金管理","執行情形回報"],"ana":["•綠色授信（或綠色貸款）之國際適用原則（GLP）之四大核心支柱（Core Pillars）包括：資金用途（Use of Proceeds）、專案評估與篩選程序、資金管理（Management of Proceeds）以及執行情形與效益回報（Reporting）。<strong>「(1) 驗證」並非四大核心構成要素之一<\/strong>。"],"labels":["1","2","3","4"],"plain":"下列何者不符合綠色授信的適用原則四項核心構成要素？驗證資金用途資金管理執行情形回報•綠色授信（或綠色貸款）之國際適用原則（GLP）之四大核心支柱（Core Pillars）包括：資金用途（Use of Proceeds）、專案評估與篩選程序、資金管理（Management of Proceeds）以及執行情形與效益回報（Reporting）。「(1) 驗證」並非四大核心構成要素之一。"},{"year":"114","no":33,"part":"第二部分","score":"1.5","ans":"1","topic":"S","stem":"辦理間接授信時，所徵之本票已記載禁止背書轉讓，則下列何者票據不得接受？","opts":["有第三者背書時，抬頭人為背書人","有第三者背書時，無抬頭人","無第三者背書時，抬頭人為第一銀行","無第三者背書時，無抬頭人"],"ana":["•(1) <strong>正確（不得接受該票據）<\/strong>：本票若已載有 <strong>「禁止背書轉讓」<\/strong> 之特約限制，則該票據之受讓權利僅能單向讓與給特定受款人，<strong>「絕不能有第三人進行背書且其抬頭人為該背書人」<\/strong> 之情況發生（這會導致票據在法律上構成背書不連續或無效轉讓，行方將無法行使票據權利）。故 (1) 屬不合格本票。---"],"labels":["1","2","3","4"],"plain":"辦理間接授信時，所徵之本票已記載禁止背書轉讓，則下列何者票據不得接受？有第三者背書時，抬頭人為背書人有第三者背書時，無抬頭人無第三者背書時，抬頭人為第一銀行無第三者背書時，無抬頭人•(1) 正確（不得接受該票據）：本票若已載有 「禁止背書轉讓」 之特約限制，則該票據之受讓權利僅能單向讓與給特定受款人，「絕不能有第三人進行背書且其抬頭人為該背書人」 之情況發生（這會導致票據在法律上構成背書不連續或無效轉讓，行方將無法行使票據權利）。故 (1) 屬不合格本票。---"}],"plain":"適用細則：授信篇第14章（貼現）、第15章（墊付國內票款）、第33章（票據承兌）、授信對保應注意事項、赤道原則作業要點、永續／綠色授信規範。間接授信：開發國內外信用狀、保證、承兌等屬間接授信；透支、出口押匯、貼現屬直接授信（依題目定義為準）。本票（禁止背書轉讓）：所徵本票抬頭人、背書轉讓限制之票據處理。對保作業：借（契）據審閱期間（至少 5 日）、對保日不得早於主債務人、立據日／對保日／核准日之先後順序、影本加蓋腰型章等。赤道原則：企業授信戶「赤道原則適用性檢核表」之填製對象。綠色授信：適用原則四要素（資金用途、資金管理、資金追蹤、驗證等）。【2026.07 授信審查作業應行注意事項 v3】配合本行董事會設置審計委員會，刪除「常駐監察人參與討論」之規定；融資租賃業授信另訂「國內營業單位辦理融資租賃公司授信應行注意事項」規範。【授信審核處】整編「授信對保應注意事項」、修訂不動產擔保物權塗銷相關權利文件領回規範。【法金處】辦理「永續金融優惠授信專案」（善盡財務供應鏈社會責任）。"},{"letter":"T","title":"企金專案貸款・短期放款準則","meta":"本主題共 **11 題**：109-33、110-23、110-35、112-07、112-40、113-08、113-09、113-39、114-06、114-21、114-44","note":"<p><strong>適用細則<\/strong>：授信篇相關專案章節、依貨幣市場利率承做短期放款準則、各專案貸款要點。<\/p><ul><li><strong>依貨幣市場利率承做短期放款準則<\/strong>：貸放期限最長 <strong>180 天<\/strong>（優質企業議價）；適用對象與定價原則為常考（注意各年題目數字差異）。<\/li><li><strong>微企 e 時貸線上融資平台<\/strong>：線上試算最高融資額度。<\/li><li><strong>企業小頭家貸款<\/strong>：對象（公司、有限合夥、商業登記）、週轉性支出每一事業額度上限、貸款期限（最長 6 年）。<\/li><li><strong>海外投資融資貸款<\/strong>：對象須取得政府主管機關核准／核備。<\/li><li><strong>專案融資<\/strong>：具政府採購法辦理性質之專案計畫。<\/li><\/ul>","change":"<ul><li>【2026.07 專案融資】承攬大型／高技術門檻採購案借戶之審慎評估與危機通報（詳主題 B）。<\/li><li>短期放款準則之「最長天期」歷年題目數字略有調整（60／90／180 天型），作答時以題目所述之現行準則版本為準。<\/li><\/ul>","questions":[{"year":"109","no":33,"part":"第二部分","score":"1.5","ans":"1","topic":"T","stem":"本行「微企e時貸」線上融資平台之線上試算最高融資額度為新臺幣","opts":["500萬元","600萬元","700萬元","800萬元"],"ana":["本行針對小微企業發展之線上簡易申貸平台「微企e時貸」，提供便捷的線上試算與線上額度核撥功能，其線上試算出的最高融資額度上限為新臺幣 <strong>500 萬元<\/strong>。"],"labels":["1","2","3","4"],"plain":"本行「微企e時貸」線上融資平台之線上試算最高融資額度為新臺幣500萬元600萬元700萬元800萬元本行針對小微企業發展之線上簡易申貸平台「微企e時貸」，提供便捷的線上試算與線上額度核撥功能，其線上試算出的最高融資額度上限為新臺幣 500 萬元。"},{"year":"110","no":23,"part":"第二部分","score":"1.5","ans":"2","topic":"T","stem":"依「第一商業銀行依貨幣市場利率承做短期放款準則」，貸放期限最長為幾天？","opts":["60天","90天","120天","150天"],"ana":["依該放款準則，每次貸放期限<strong>最長以 90 天為限<\/strong>。"],"labels":["1","2","3","4"],"plain":"依「第一商業銀行依貨幣 40、114-51<\/td><\/tr><tr><td>3<\/td><td>國內營業單位經理權限授信要點<\/td><td>115(2026).2.2<\/td><td>初任經理半年內 DBR&gt;70% 房貸案及代書等轉介案須報總行/區域中心；停權標準調整；受益權質借外幣納擔保權限<\/td><td>D（權限各年題）<\/td><\/tr><tr><td>4<\/td><td>授信覆審實施要點<\/td><td>115(2026).3.20<\/td><td><strong>免覆審門檻 500萬→1,000萬(含)以下<\/strong>；新增信保十成擔保免覆審<\/td><td>O／109-50 及各年覆審題<\/td><\/tr><tr><td>5<\/td><td>經濟部青年創業貸款要點(第8、9點)<\/td><td>115(2026).7.1<\/td><td>歸戶150萬以下<strong>保證成數9.5成<\/strong>；150萬以下僅徵代表人/負責人為保證人；150萬以下得以申請表取代計畫書<\/td><td>I／109-30、112-04<\/td><\/tr><tr><td>6<\/td><td>擔保品鑑價應注意事項<\/td><td>114(2025).11.18<\/td><td>停車位成交案例規定；<strong>鑑價/卷宗保存年限 20年→15年<\/strong><\/td><td>J・K・O（保存年限題）<\/td><\/tr><tr><td>7<\/td><td>樂活貸循環型房貸作業要點<\/td><td>115(2026).02<\/td><td>契約期限得申請以<strong>5年為一期<\/strong>；增訂高資產客群<\/td><td>G／109-44、111-07、113-41、114-52<\/td><\/tr><tr><td>8<\/td><td>授信審查作業應行注意事項 v3<\/td><td>115(2026).7.7<\/td><td>新增購置船舶/航空器貸款要項；應收帳款融資增/續貸須揭露承作量帳齡入帳；配合設審計委員會刪除常駐監察人參與討論<\/td><td>A・J・S（新增考點）<\/td><\/tr><tr><td>9<\/td><td>消金資產管理專區新種業務<\/td><td>115(2026)<\/td><td>倫巴底(Lombard)金融資產組合擔保融資、保費及保單融資、自益特金受益權質借<\/td><td>J・G／114-15<\/td><\/tr><tr><td>10<\/td><td>第e數速貸平台防詐檢核<\/td><td>115(2026).7.23<\/td><td>新增「疑遭詐騙客戶名單(9754)」及「疑似涉詐帳號」檢核<\/td><td>K・G（新增考點）<\/td><\/tr><\/tbody><\/table><\/div><p style=\"color:var(--ink-2);font-size:13.5px\">說明：上表「影響」欄所列舊題，代表該主題／題目涉及之規定已修正；若舊題按當年答案，與現行規定不一致者，請以現行為準。無明確對應題號者為「新增考點」，屬未來可能命題方向。<\/p>"}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const TOPICS = D.topics, ALLQ = [];
TOPICS.forEach(t=>t.questions.forEach(q=>{q.tletter=t.letter;q.ttitle=t.title;q.id=q.year+'-'+q.no;ALLQ.push(q);}));
const YEARS = [...new Set(ALLQ.map(q=>q.year))].sort();

/* ---------- persistence (works in-app and as a local file) ---------- */
const KEY='cx-notes-v1';
let S={ans:{},mark:{},theme:null};
const store={
  async get(){ try{
      if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null;}
      const v=window.localStorage&&localStorage.getItem(KEY); return v?JSON.parse(v):null;
    }catch(e){return null;} },
  async set(v){ try{
      const s=JSON.stringify(v);
      if(window.storage&&window.storage.set){await window.storage.set(KEY,s);return;}
      if(window.localStorage)localStorage.setItem(KEY,s);
    }catch(e){} }
};
let saveT=null; const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>store.set(S),400);};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), main=$('#main'), sidebar=$('#sidebar');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const CN=['','①','②','③','④'];
function hl(html,re){ if(!re) return html;
  return html.split(/(<[^>]*>)/).map(p=>p[0]==='<'?p:p.replace(re,m=>'<mark>'+m+'</mark>')).join('');
}
function stripTags(h){return h.replace(/<[^>]*>/g,'');}

/* ---------- state ---------- */
let ST={view:'home',topic:null,year:'all',status:'all',query:''};

/* ---------- render: question ---------- */
function qCard(q,re){
  const picked=S.ans[q.id], open=picked!==undefined||q._open;
  const isPass=q.ans==='送分';
  let opts='';
  q.opts.forEach((o,i)=>{
    const label=q.labels[i];
    let cls='opt';
    if(open){ if(!isPass&&label===q.ans) cls+=' right'; else if(picked===label&&label!==q.ans) cls+=' wrong'; }
    opts+=`<li><button class="${cls}" data-pick="${label}" ${open?'disabled':''}>
      <span class="num">${label}</span><span class="t">${hl(o,re)}</span></button></li>`;
  });
  let ana='';
  if(open){
    const items=q.ana.map(a=>{
      const m=a.match(/^•\s*[（(]?([1-4])[)）]\s*/);
      if(a[0]==='•'){
        if(m) return `<div class="ab"><span class="k${(!isPass&&m[1]===q.ans)?' hit':''}">${m[1]}</span><span>${hl(a.slice(m[0].length),re)}</span></div>`;
        return `<div class="ab"><span class="k">·</span><span>${hl(a.slice(1),re)}</span></div>`;
      }
      return `<p>${hl(a,re)}</p>`;
    }).join('');
    const verdict = picked===undefined ? '' :
      (isPass?'<span class="verdict">此題送分</span>':
       picked===q.ans?'<span class="verdict" style="color:var(--indigo)">答對</span>':'<span class="verdict" style="color:var(--seal)">答錯</span>');
    ana=`<div class="ana"><span class="alabel">解 析</span>${items}
      <div class="qfoot">${verdict}<div class="seal ${isPass?'pass':''}">${isPass?'送分':'正解<b>'+CN[+q.ans]+'</b>'}</div></div></div>`;
  }
  return `<article class="q${S.mark[q.id]?' marked':''}" id="q${q.id}" data-id="${q.id}">
    <div class="qhead">
      <span class="qtag">${q.year}-${String(q.no).padStart(2,'0')}</span>
      <span class="qmeta">${q.part} · ${q.score}分 · 主題${q.tletter}</span>
      <button class="qbtn mark${S.mark[q.id]?' on':''}" data-mark="${q.id}">${S.mark[q.id]?'★ 已標記':'☆ 標記'}</button>
    </div>
    <div class="stem">${hl(q.stem,re)}</div>
    <ol class="opts">${opts}</ol>
    ${open?'':'<div class="qfoot"><button class="reveal" data-open="'+q.id+'">直接看答案與解析</button></div>'}
    ${ana}</article>`;
}

/* ---------- filters ---------- */
function filterQs(list){
  return list.filter(q=>{
    if(ST.year!=='all'&&q.year!==ST.year) return false;
    if(ST.status==='undone'&&S.ans[q.id]!==undefined) return false;
    if(ST.status==='wrong'&&!(S.ans[q.id]!==undefined&&S.ans[q.id]!==q.ans&&q.ans!=='送分')) return false;
    if(ST.status==='marked'&&!S.mark[q.id]) return false;
    return true;
  });
}
function filterBar(){
  const yc=['all',...YEARS].map(y=>`<button class="chip${ST.year===y?' on':''}" data-year="${y}">${y==='all'?'全年度':y}</button>`).join('');
  const sc=[['all','全部'],['undone','未作答'],['wrong','答錯'],['marked','已標記']]
    .map(([k,v])=>`<button class="chip wide${ST.status===k?' on':''}" data-status="${k}">${v}</button>`).join('');
  return `<div class="filters">${yc}<span class="divider"></span>${sc}<span class="divider"></span><button class="chip wide" data-expand="1">展開全部解析</button></div>`;
}

/* ---------- views ---------- */
function viewHome(){
  const done=Object.keys(S.ans).length;
  const right=Object.entries(S.ans).filter(([id,a])=>{const q=ALLQ.find(x=>x.id===id);return q&&(a===q.ans||q.ans==='送分');}).length;
  const cards=TOPICS.map(t=>{
    const d=t.questions.filter(q=>S.ans[q.id]!==undefined).length;
    return `<a class="tcard" href="#t-${t.letter}">
      <span class="L">主題 ${t.letter}</span>
      <h3>${esc(t.title)}</h3>
      <span class="n">${t.questions.length} 題 · 已作答 ${d}</span>
      <span class="tbar"><i style="width:${t.questions.length?d/t.questions.length*100:0}%"></i></span></a>`;
  }).join('');
  main.innerHTML=`
  <div class="pagehead">
    <div class="eyebrow">109 – 114 年 · 360 題 · 17 主題</div>
    <h1>徵授信業務　主題式考點筆記</h1>
    <p class="lead">業務處理細則（授信篇 115.4.9／徵信篇 114.07）、各處室重要公文，與歷屆試題整合成 17 個考點主題。每題可直接作答，答完立即顯示正解與解析；早期考題若因修法而答案異動，主題內的「答案異動」欄位會以 ⚠️ 標示。</p>
    <div class="kv">
      <div><b>${done}</b>已作答 / 360</div>
      <div><b>${done?Math.round(right/done*100):0}%</b>正確率</div>
      <div><b>${Object.keys(S.mark).length}</b>已標記</div>
    </div>
  </div>
  <div class="tools">
    <a class="iconbtn" href="#appendix">近年重大修法一覽</a>
    <a class="iconbtn" href="#review">我的標記與錯題</a>
    <button class="iconbtn" id="resetBtn">清除作答紀錄</button>
  </div>
  <h2>主題目錄</h2>
  <div class="grid">${cards}</div>`;
}

function viewTopic(letter){
  const i=TOPICS.findIndex(x=>x.letter===letter); if(i<0) return viewHome();
  const t=TOPICS[i], prev=TOPICS[i-1], next=TOPICS[i+1];
  const qs=filterQs(t.questions);
  main.innerHTML=`
  <div class="pagehead topichead">
    <div class="letter">${t.letter}</div>
    <div>
      <div class="eyebrow">主題 ${t.letter} · ${t.questions.length} 題</div>
      <h1>${esc(t.title)}</h1>
      <div class="qlist-meta">${esc(t.meta.replace(/\*\*/g,''))}</div>
    </div>
  </div>
  ${t.note?`<section class="card note"><span class="cardlabel"><i class="dot"></i>重點整理　細則＋公文</span>${t.note}</section>`:''}
  ${t.change?`<section class="card change"><span class="cardlabel"><i class="dot"></i>答案異動・時事更新註記</span>${t.change}</section>`:''}
  <h2>歷屆考題與解析</h2>
  ${filterBar()}
  <div id="qs">${qs.length?qs.map(q=>qCard(q,null)).join(''):'<p class="empty">此篩選條件下沒有題目。</p>'}</div>
  <nav class="pager">${prev?`<a class="iconbtn" href="#t-${prev.letter}">← 主題 ${prev.letter}　${esc(prev.title)}</a>`:'<span></span>'}
  ${next?`<a class="iconbtn" href="#t-${next.letter}">主題 ${next.letter}　${esc(next.title)} →</a>`:'<span></span>'}</nav>`;
}

function viewAppendix(){
  main.innerHTML=`<div class="pagehead">
    <div class="eyebrow">附錄一</div><h1>近年重大修法一覽</h1>
    <p class="lead">舊題答案係當年度法規。下表所列規定已修正，作答與實務均以現行規定為準；無對應題號者屬新增考點，是可能的命題方向。</p>
  </div>${D.appendix}`;
}

function viewReview(){
  const marked=ALLQ.filter(q=>S.mark[q.id]);
  const wrong=ALLQ.filter(q=>S.ans[q.id]!==undefined&&S.ans[q.id]!==q.ans&&q.ans!=='送分');
  main.innerHTML=`<div class="pagehead">
    <div class="eyebrow">複習清單</div><h1>我的標記與錯題</h1>
    <div class="kv"><div><b>${marked.length}</b>已標記</div><div><b>${wrong.length}</b>答錯</div></div></div>
  <h2>答錯的題目</h2><div id="qs1">${wrong.length?wrong.map(q=>qCard(q,null)).join(''):'<p class="empty">目前沒有答錯的題目。</p>'}</div>
  <h2>已標記的題目</h2><div id="qs2">${marked.length?marked.map(q=>qCard(q,null)).join(''):'<p class="empty">還沒有標記任何題目，點題目右上角的「☆ 標記」即可加入。</p>'}</div>`;
}

function viewSearch(){
  const kw=ST.query.trim();
  if(kw.length<1) return viewHome();
  const src=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(src,'gi'), test=new RegExp(src,'i');
  const hitQ=filterQs(ALLQ).filter(q=>test.test(q.plain));
  const hitT=TOPICS.filter(t=>test.test(t.plain));
  main.innerHTML=`<div class="pagehead">
    <div class="eyebrow">搜尋</div><h1>「${esc(kw)}」</h1>
    <p class="sub">命中 ${hitQ.length} 題　·　${hitT.length} 個主題的重點整理</p></div>
  ${filterBar()}
  ${hitT.length?`<h2>重點整理</h2>`+hitT.map(t=>`<section class="card note">
      <span class="cardlabel"><i class="dot"></i>主題 ${t.letter}　${esc(t.title)}　<a href="#t-${t.letter}">前往主題 →</a></span>
      ${hl(t.note||'',re)}${hl(t.change||'',re)}</section>`).join(''):''}
  <h2>考題</h2>
  <div id="qs">${hitQ.length?hitQ.map(q=>qCard(q,re)).join(''):'<p class="empty">找不到符合的題目，換個關鍵字試試。</p>'}</div>`;
}

/* ---------- sidebar ---------- */
function renderSidebar(){
  const done=Object.keys(S.ans).length;
  const right=Object.entries(S.ans).filter(([id,a])=>{const q=ALLQ.find(x=>x.id===id);return q&&(a===q.ans||q.ans==='送分');}).length;
  sidebar.innerHTML=`
  <div class="progress">
    <div class="row"><span>作答進度</span><span>${done}/360</span></div>
    <div class="bar"><i style="width:${done/3.6}%"></i></div>
    <div class="row"><b>${done?Math.round(right/done*100):0}%</b><span style="align-self:flex-end">正確率</span></div>
  </div>
  <div class="sb-title">總　覽</div>
  <a class="navlink${ST.view==='home'?' active':''}" href="#home"><span class="L">◈</span>首頁與進度</a>
  <a class="navlink${ST.view==='appendix'?' active':''}" href="#appendix"><span class="L">附</span>近年重大修法一覽</a>
  <a class="navlink${ST.view==='review'?' active':''}" href="#review"><span class="L">★</span>標記與錯題<span class="n">${Object.keys(S.mark).length}</span></a>
  <div class="sb-title">考點主題</div>
  ${TOPICS.map(t=>`<a class="navlink${ST.view==='topic'&&ST.topic===t.letter?' active':''}" href="#t-${t.letter}">
      <span class="L">${t.letter}</span><span>${esc(t.title)}</span><span class="n">${t.questions.length}</span></a>`).join('')}`;
}

/* ---------- routing ---------- */
function render(){
  if(ST.view==='home')viewHome();
  else if(ST.view==='topic')viewTopic(ST.topic);
  else if(ST.view==='appendix')viewAppendix();
  else if(ST.view==='review')viewReview();
  else if(ST.view==='search')viewSearch();
  renderSidebar();
}
function setRoute(h){
  h=(h||'').replace(/^#/,'');
  if(h.startsWith('t-')){ST.view='topic';ST.topic=h.slice(2);}
  else if(h==='appendix')ST.view='appendix';
  else if(h==='review')ST.view='review';
  else if(h==='search')ST.view='search';
  else ST.view='home';
  if(ST.view!=='search'){ST.query='';$('#q').value='';$('#clr').hidden=true;}
}
function toTop(){ try{window.scrollTo(0,0);}catch(e){ document.documentElement.scrollTop=0; } }
let ignoreHash=false;
function setHash(h){ try{ ignoreHash=true; location.hash='#'+h; }catch(e){} finally{ setTimeout(()=>{ignoreHash=false;},0); } }
/* 直接處理站內連結：即使瀏覽器（或本機 file:// 環境）不觸發 hashchange 也能跳頁 */
function go(h){ setRoute(h); setHash(h); render(); toTop(); closeNav(); }
document.addEventListener('click',function(e){
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  e.preventDefault(); go(a.getAttribute('href').slice(1));
});
function route(){ setRoute(location.hash); render(); toTop(); closeNav(); }
window.addEventListener('hashchange',()=>{ if(ignoreHash) return; route(); });
window.addEventListener('popstate',()=>{ if(ignoreHash) return; route(); });

/* ---------- events ---------- */
main.addEventListener('click',e=>{
  const pick=e.target.closest('[data-pick]');
  if(pick){ const art=pick.closest('.q'); const q=ALLQ.find(x=>x.id===art.dataset.id);
    S.ans[q.id]=pick.dataset.pick; save(); replaceCard(art,q); renderSidebar(); return; }
  const op=e.target.closest('[data-open]');
  if(op){ const art=op.closest('.q'); const q=ALLQ.find(x=>x.id===art.dataset.id);
    q._open=true; replaceCard(art,q); return; }
  const mk=e.target.closest('[data-mark]');
  if(mk){ const id=mk.dataset.mark; if(S.mark[id])delete S.mark[id];else S.mark[id]=1; save();
    const art=mk.closest('.q'); art.classList.toggle('marked',!!S.mark[id]);
    mk.classList.toggle('on',!!S.mark[id]); mk.textContent=S.mark[id]?'★ 已標記':'☆ 標記'; renderSidebar(); return; }
  const yr=e.target.closest('[data-year]'); if(yr){ST.year=yr.dataset.year;render();return;}
  const st=e.target.closest('[data-status]'); if(st){ST.status=st.dataset.status;render();return;}
  const ex=e.target.closest('[data-expand]'); if(ex){ main.querySelectorAll('.q').forEach(a=>{const q=ALLQ.find(x=>x.id===a.dataset.id); if(q)q._open=true;}); render(); return; }
  if(e.target.id==='resetBtn'){ if(confirm('清除全部作答與標記紀錄？')){S={ans:{},mark:{},theme:S.theme};save();render();} }
});
function replaceCard(art,q){
  const re=ST.view==='search'&&ST.query?new RegExp(ST.query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'):null;
  const w=document.createElement('div'); w.innerHTML=qCard(q,re);
  art.replaceWith(w.firstElementChild);
}

/* nav drawer */
function openNav(){sidebar.classList.add('open');$('#scrim').classList.add('on');}
function closeNav(){sidebar.classList.remove('open');$('#scrim').classList.remove('on');}
$('#navBtn').addEventListener('click',()=>sidebar.classList.contains('open')?closeNav():openNav());
$('#scrim').addEventListener('click',closeNav);
sidebar.addEventListener('click',e=>{if(e.target.closest('a'))closeNav();});

/* search */
let sT=null;
$('#q').addEventListener('input',e=>{
  const v=e.target.value; $('#clr').hidden=!v;
  clearTimeout(sT); sT=setTimeout(()=>{
    ST.query=v;
    if(v.trim()){ ST.view='search'; setHash('search'); render(); toTop(); }
    else { go('home'); }
  },220);
});
$('#clr').addEventListener('click',()=>{$('#q').value='';$('#clr').hidden=true;ST.query='';go('home');});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&e.target.tagName!=='INPUT'){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape')closeNav();
});

/* theme */
const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):{matches:false};
function applyTheme(){document.documentElement.dataset.theme=S.theme||(mq.matches?'dark':'light');}
$('#themeBtn').addEventListener('click',()=>{S.theme=(document.documentElement.dataset.theme==='dark')?'light':'dark';applyTheme();save();});
if(mq.addEventListener)mq.addEventListener('change',()=>{if(!S.theme)applyTheme();});
else if(mq.addListener)mq.addListener(()=>{if(!S.theme)applyTheme();});

/* back to top */
const ttb=$('#toTopBtn');
ttb.addEventListener('click',toTop);
window.addEventListener('scroll',()=>{ ttb.hidden = (window.pageYOffset||document.documentElement.scrollTop||0) < 500; },{passive:true});

/* boot */
(async()=>{
  const saved=await store.get(); if(saved)S=Object.assign(S,saved);
  applyTheme(); route();
})();
})();
</script>
</body>
</html>
