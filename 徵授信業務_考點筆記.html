<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>徵授信業務 ── 主題式考點筆記</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  --paper:#E7EAE3; --card:#FBFBF7; --card-2:#F3F5EF;
  --ink:#1D2A2E; --ink-2:#5C6C6D; --ink-3:#8A9795;
  --rule:#CCD4CB; --rule-2:#DDE3DA;
  --indigo:#1F5A63; --indigo-soft:#E1ECEA; --indigo-ink:#164A52;
  --seal:#B23A2F; --seal-soft:#F4E2DE;
  --kraft:#9C7B3F; --kraft-soft:#F0E8D6;
  --shadow:0 1px 0 rgba(29,42,46,.05), 0 6px 18px -12px rgba(29,42,46,.35);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",sans-serif;
  --kai:"BiauKai","DFKai-SB","Kaiti TC","楷體-繁","標楷體","Noto Serif TC","Songti TC",serif;
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC","MingLiU",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --r:10px;
}
html[data-theme="dark"]{
  --paper:#111819; --card:#192224; --card-2:#1F2A2C;
  --ink:#E3E9E5; --ink-2:#9DAAA8; --ink-3:#7A8887;
  --rule:#2B3739; --rule-2:#253032;
  --indigo:#6FBAB2; --indigo-soft:#16292B; --indigo-ink:#8FD0C8;
  --seal:#E77C70; --seal-soft:#2E1E1C;
  --kraft:#CDA968; --kraft-soft:#2A2419;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 20px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.75; -webkit-text-size-adjust:100%;
  letter-spacing:.01em;
}
/* faint ledger grid, like 公文用紙 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background-image:linear-gradient(var(--rule-2) 1px,transparent 1px);
  background-size:100% 32px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 420px);
          mask-image:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 420px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--indigo-ink);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--seal); outline-offset:2px; border-radius:4px}
mark{background:var(--kraft-soft); color:inherit; border-bottom:1.5px solid var(--kraft); padding:0 .1em}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--rule);
}
.iconbtn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--rule); border-radius:var(--r);
  padding:7px 11px; font-size:14px; background:var(--card); color:var(--ink-2);
  white-space:nowrap;
}
.iconbtn:hover{border-color:var(--indigo);color:var(--indigo-ink)}
.brand{font-family:var(--serif); font-weight:700; font-size:17px; letter-spacing:.06em; white-space:nowrap}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:10.5px;letter-spacing:.28em;color:var(--ink-3);line-height:1}
.searchwrap{flex:1; min-width:0; position:relative}
.searchwrap input{
  width:100%; font:inherit; font-size:14.5px; color:var(--ink);
  background:var(--card); border:1px solid var(--rule); border-radius:var(--r);
  padding:8px 30px 8px 32px;
}
.searchwrap input::placeholder{color:var(--ink-3)}
.searchwrap input:focus{border-color:var(--indigo);outline:none;box-shadow:0 0 0 3px var(--indigo-soft)}
.searchwrap .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px}
.searchwrap .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--ink-3);padding:4px 6px;font-size:15px;line-height:1}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:block;max-width:1240px;margin:0 auto;padding:0 14px}
#sidebar{
  position:fixed; z-index:60; inset:0 auto 0 0; width:min(84vw,320px);
  background:var(--card); border-right:1px solid var(--rule);
  transform:translateX(-102%); transition:transform .22s ease;
  overflow-y:auto; padding:16px 14px calc(30px + env(safe-area-inset-bottom));
  padding-top:calc(16px + env(safe-area-inset-top));
}
#sidebar.open{transform:none}
#sidebar{overscroll-behavior:contain}
@media (max-width:700px){.brand small{display:none}.brand{font-size:15px;letter-spacing:.04em}}
@media (max-width:470px){.brand{display:none}}
.scrim{position:fixed;inset:0;background:rgba(20,30,32,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
main{padding:18px 0 80px; min-width:0}

/* ---------- sidebar ---------- */
.sb-title{font-family:var(--serif);font-size:12px;letter-spacing:.3em;color:var(--ink-3);margin:18px 0 8px}
.sb-title:first-child{margin-top:0}
.navlink{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px}
.navlink:hover{background:var(--card-2)}
.navlink.active{background:var(--indigo-soft);color:var(--indigo-ink)}
.navlink .L{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--kraft);min-width:1.1em}
.navlink.active .L{color:var(--seal)}
.navlink .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.progress{border:1px solid var(--rule);border-radius:var(--r);padding:12px 13px;background:var(--card-2)}
.progress .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.progress b{font-family:var(--mono);font-size:19px;color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--rule);overflow:hidden;margin:9px 0 4px}
.bar i{display:block;height:100%;background:var(--indigo);width:0;transition:width .3s}

/* ---------- page headers ---------- */
.pagehead{margin:0 0 22px;padding-bottom:16px;border-bottom:1.5px solid var(--rule)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;color:var(--kraft);text-transform:uppercase}
h1{font-family:var(--serif);font-size:clamp(23px,5.6vw,32px);line-height:1.35;margin:.28em 0 .1em;letter-spacing:.02em;font-weight:700}
h2{font-family:var(--serif);font-size:19px;margin:34px 0 12px;letter-spacing:.04em}
.sub{color:var(--ink-2);font-size:13.5px}
.topichead{display:flex;gap:16px;align-items:flex-start}
.topichead .letter{
  font-family:var(--serif);font-size:54px;line-height:.85;font-weight:700;color:var(--seal);
  -webkit-text-stroke:0; opacity:.9; padding-top:6px;
}
.qlist-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);word-break:break-all;margin-top:8px;line-height:1.9}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px;margin:0 0 16px}
.card.note{border-left:3px solid var(--indigo)}
.card.change{border-left:3px solid var(--seal);background:linear-gradient(0deg,var(--card),var(--card))}
.cardlabel{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.18em;color:var(--ink-3);font-family:var(--serif);margin-bottom:10px}
.cardlabel .dot{width:7px;height:7px;border-radius:2px;background:var(--indigo);transform:rotate(45deg)}
.card.change .dot{background:var(--seal)}
.card p{margin:.5em 0}
.card ul{margin:.4em 0;padding-left:1.15em}
.card li{margin:.42em 0}
.card li::marker{color:var(--indigo);font-size:.85em}
.card.change li::marker{color:var(--seal)}
strong{font-weight:700;color:var(--ink);background:linear-gradient(transparent 62%,var(--kraft-soft) 0)}
html[data-theme="dark"] strong{background:none;color:var(--kraft)}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.chip{border:1px solid var(--rule);border-radius:99px;padding:4px 11px;font-size:12.5px;font-family:var(--mono);color:var(--ink-2);background:var(--card)}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
html[data-theme="dark"] .chip.on{color:#0F1617}
.chip.wide{font-family:var(--sans)}
.divider{width:1px;height:18px;background:var(--rule);margin:0 4px}

/* ---------- question ---------- */
.q{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 14px;margin:0 0 14px;scroll-margin-top:70px}
.q.marked{border-color:var(--kraft);box-shadow:inset 3px 0 0 var(--kraft), var(--shadow)}
.qhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.qtag{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--ink);background:var(--card-2);border:1px solid var(--rule);border-radius:6px;padding:1px 7px}
.qmeta{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.qbtn{margin-left:auto;font-size:12px;color:var(--ink-3);border:1px solid transparent;padding:3px 8px;border-radius:7px}
.qbtn:hover{color:var(--kraft);border-color:var(--rule)}
.qbtn.on{color:var(--kraft);border-color:var(--kraft);background:var(--kraft-soft)}
.stem{font-family:var(--kai);font-size:17.5px;line-height:1.9;letter-spacing:.02em}
.opts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.opt{display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;
  border:1px solid var(--rule-2);border-radius:8px;padding:8px 10px;background:var(--card-2);
  font-size:15px;line-height:1.7;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--indigo)}
.opt .num{flex:none;width:22px;height:22px;margin-top:2px;border:1.5px solid var(--ink-3);border-radius:50%;
  display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.opt.right{border-color:var(--seal);background:var(--seal-soft)}
.opt.right .num{border-color:var(--seal);background:var(--seal);color:#fff}
html[data-theme="dark"] .opt.right .num{color:#161C1D}
.opt.wrong{border-color:var(--ink-3);opacity:.72}
.opt.wrong .num{border-style:dashed}
.opt.wrong .t::after{content:"（你的作答）";font-size:11.5px;color:var(--ink-3);font-family:var(--sans)}
.qfoot{display:flex;align-items:center;gap:10px;margin-top:12px}
.reveal{font-size:13px;color:var(--indigo-ink);border:1px dashed var(--rule);border-radius:8px;padding:5px 12px}
.reveal:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.verdict{font-size:12.5px;font-family:var(--mono);color:var(--ink-3)}

/* the seal — signature element */
.seal{
  margin-left:auto; flex:none; display:grid; place-items:center;
  font-family:var(--kai); color:var(--seal); border:2.5px solid var(--seal); border-radius:3px;
  width:58px; height:58px; line-height:1.15; font-size:15px; letter-spacing:.06em; text-align:center;
  transform:rotate(-7deg); opacity:.92; box-shadow:inset 0 0 0 1px var(--card);
}
.seal b{display:block;font-size:21px;font-weight:400}
.seal.pass{font-size:16px}
@media (prefers-reduced-motion:no-preference){
  .seal{animation:stamp .34s cubic-bezier(.2,1.4,.5,1) both}
  @keyframes stamp{from{transform:rotate(-16deg) scale(1.9);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:.92}}
}
.ana{margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule);font-size:14.7px;line-height:1.85;color:var(--ink)}
.ana .alabel{font-size:11.5px;letter-spacing:.2em;color:var(--ink-3);font-family:var(--serif);display:block;margin-bottom:6px}
.ana .ab{display:flex;gap:9px;margin:.42em 0}
.ana .ab .k{flex:none;width:20px;height:20px;margin-top:3px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;background:var(--card-2);border:1px solid var(--rule);color:var(--ink-2)}
.ana .ab .k.hit{background:var(--seal);border-color:var(--seal);color:#fff}
html[data-theme="dark"] .ana .ab .k.hit{color:#161C1D}
.ana p{margin:.42em 0}

/* ---------- appendix table ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
th,td{padding:10px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top;text-align:left}
thead th{background:var(--card-2);font-family:var(--serif);font-size:12.5px;letter-spacing:.12em;color:var(--ink-2);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-family:var(--mono);color:var(--kraft);font-size:12px}

/* ---------- overview ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tcard:hover{border-color:var(--indigo)}
.tcard .L{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.tcard h3{font-family:var(--serif);font-size:15.5px;margin:4px 0 8px;line-height:1.5;font-weight:600}
.tcard .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.tcard .tbar{height:4px;border-radius:99px;background:var(--rule);margin-top:8px;overflow:hidden}
.tcard .tbar i{display:block;height:100%;background:var(--indigo);width:0}
.lead{font-size:15px;color:var(--ink-2);max-width:62ch}
.kv{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0 0}
.kv div{font-size:12.5px;color:var(--ink-3)}
.kv b{display:block;font-family:var(--mono);font-size:22px;color:var(--ink);font-weight:600;letter-spacing:-.01em}
.empty{color:var(--ink-3);font-size:14px;padding:26px 0;text-align:center}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:34px;padding:0 24px}
  #sidebar{inset:auto;position:sticky;top:58px;height:calc(100vh - 58px);width:auto;transform:none;
    border-right:1px solid var(--rule);background:transparent;padding:20px 16px 40px 0}
  .scrim{display:none}
  .nav-toggle{display:none}
  main{padding:26px 0 120px;max-width:860px}
  .stem{font-size:18px}
}
.totop{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:45;
  width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--rule);
  color:var(--ink-2);box-shadow:var(--shadow);font-size:17px;line-height:1}
.totop:hover{border-color:var(--indigo);color:var(--indigo-ink)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)}
.pager a{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
@media print{
  .topbar,#sidebar,.qbtn,.reveal,.filters,.tools{display:none!important}
  body::before{display:none} .q,.card{break-inside:avoid;box-shadow:none}
  .ana{display:block!important}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn nav-toggle" id="navBtn" aria-label="開啟目錄">☰ 目錄</button>
  <div class="brand">徵授信業務<small>KAOTIEN NOTES</small></div>
  <div class="searchwrap">
    <span class="mag">⌕</span>
    <input id="q" type="search" placeholder="搜尋關鍵字、法規、題目" title="按 / 可快速跳到搜尋" aria-label="搜尋">
    <button class="clr" id="clr" hidden aria-label="清除搜尋">✕</button>
  </div>
  <button class="iconbtn" id="themeBtn" aria-label="切換日夜模式">◐</button>
</header>

<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script id="data" type="application/json">{"topics":[{"letter":"A","title":"應收帳款承購與供應鏈融資","meta":"本主題共 **15 題**：109-01、109-25、109-28、109-36、110-03、110-24、111-02、112-23、112-47、113-06、113-33、114-04、114-27、114-34、114-40","note":"<p><strong>適用細則<\/strong>：授信篇第16章（應收帳款承購 Factoring）、第17章（國內應收帳款貸款）、第18章（分期應收帳款融資）。<\/p><ul><li><strong>有無追索權<\/strong>：有追索權 → 賣方仍需承擔買方信用風險；無追索權 → 由本行（或保險）承擔買方信用風險。應收帳款承購屬「應收帳款債權之管理服務＋融資」。<\/li><li><strong>預支價金<\/strong>：每筆預支價金以不超過實際帳款交易淨額之 <strong>8 成（承購型）<\/strong> 為原則（統包／供應鏈另有規範）；賣方於本行信評 8 等（含）以下者，通常須有追索權或副擔保。<\/li><li><strong>供應鏈／統包融資<\/strong>：應徵取買方付款承諾書及備付本票，得個案評估免徵；融資期限以不超過 <strong>180 天<\/strong> 為原則；利息多採動撥時預收／扣息，非一律按月收息。<\/li><li><strong>應收客票週轉金<\/strong>：填製「客票融資審核工作單」，屬間接授信性質之票據融資。<\/li><\/ul>","change":"<ul><li>【2026.07 授信審查作業應行注意事項 v3】應收帳款融資（含承購、國內應收帳款貸款、線上融資、台塑網線上融資、銷售鏈融資）之<strong>增貸／續貸<\/strong>案件，應於「營業單位信用綜合評估表」資金用途段揭露<strong>過去一年承作量、應收帳款帳齡分析及入帳情形<\/strong>；承作量大幅下降或帳款未如期入帳者，應查明並調整額度／條件。<\/li><li>【法金處 2025-2026】重申「銷售鏈融資」及「線上融資 e-Financing」作業，避免本行不易掌握償還來源。<\/li><\/ul>","questions":[{"year":"109","no":1,"part":"第一部分","score":"2","ans":"2","topic":"A","stem":"有關辦理應收帳款承購業務，下列何者為是？","opts":["有追索權承購業務，本行需承擔買方因財務困難導致無法付款之信用風險","提供企業間因記帳賒銷所衍生應收帳款債權之管理服務","每筆帳款預支價金以不超過實際帳款交易淨額之七成為原則","應徵取應收帳款承購額度110%之備付本票"],"ana":["•(1) 錯誤：<strong>無追索權<\/strong>（Non-Recourse）承購業務中，銀行才需承擔買方因財務困難之信用風險；有追索權（With Recourse）時，若買方不付款，銀行可向賣方（借款人）追索。","•(2) <strong>正確<\/strong>：應收帳款承購（Factoring）核心功能之一即是提供賒銷（O/A）交易所衍生應收帳款的債權管理、帳務處理及催收服務。","•(3) 錯誤：預支價金（Advance）成數通常係以不超過實際帳款交易淨額之<strong>八成<\/strong>為原則。","•(4) 錯誤：本行一般係就綜合授信額度或特定貸款成數徵提適格之票據，非一律要求 110%備付本票。"],"labels":["1","2","3","4"],"plain":"有關辦理應收帳款承購業務，下列何者為是？有追索權承購業務，本行需承擔買方因財務困難導致無法付款之信用風險提供企業間因記帳賒銷所衍生應收帳款債權之管理服務每筆帳款預支價金以不超過實際帳款交易淨額之七成為原則應徵取應收帳款承購額度110%之備付本票•(1) 錯誤：無追索權（Non-Recourse）承購業務中，銀行才需承擔買方因財務困難之信用風險；有追索權（With Recourse）時，若買方不付款，銀行可向賣方（借款人）追索。•(2) 正確：應收帳款承購（Factoring）核心功能之一即是提供賒銷（O/A）交易所衍生應收帳款的債權管理、帳務處理及催收服務。•(3) 錯誤：預支價金（Advance）成數通常係以不超過實際帳款交易淨額之八成為原則。•(4) 錯誤：本行一般係就綜合授信額度或特定貸款成數徵提適格之票據，非一律要求 110%備付本票。"},{"year":"109","no":25,"part":"第二部分","score":"1.5","ans":"1","topic":"A","stem":"辦理應收帳款承購業務，除有追索權無預支價金且未充為其他授信副擔保案件外，賣方於本行信評8等(含)以上，營業單位須於何時照會買方或取得足以確認交易真實性之相關文件存參。","opts":["每次承購時","每月","每季","每半年"],"ana":["為防範借戶利用假債權進行詐貸（虛偽交易），當賣方（本行借款客戶）於本行之信用評等在 8 等（含）以上（屬中高風險）時，營業單位在辦理應收帳款受讓與預支價金時，必須執行最嚴格之實質交易查證，<strong>「每次承購時」<\/strong> 均應照會買方確認或取得嚴謹的交易單據佐證。"],"labels":["1","2","3","4"],"plain":"辦理應收帳款承購業務，除有追索權無預支價金且未充為其他授信副擔保案件外，賣方於本行信評8等(含)以上，營業單位須於何時照會買方或取得足以確認交易真實性之相關文件存參。每次承購時每月每季每半年為防範借戶利用假債權進行詐貸（虛偽交易），當賣方（本行借款客戶）於本行之信用評等在 8 等（含）以上（屬中高風險）時，營業單位在辦理應收帳款受讓與預支價金時，必須執行最嚴格之實質交易查證，「每次承購時」 均應照會買方確認或取得嚴謹的交易單據佐證。"},{"year":"109","no":28,"part":"第二部分","score":"1.5","ans":"2","topic":"A","stem":"下列何者為間接授信？","opts":["透支","開發國內、外信用狀","出口押匯","有追索權應收帳款承購業務"],"ana":["•<strong>直接授信<\/strong>：指銀行直接撥付資金予借款人之融資。 (1) 透支、(3) 出口押匯、(4) 應收帳款承購均有實際撥付資金。","•<strong>間接授信<\/strong>：指銀行不直接撥付資金，僅以保證、承兌或信用承諾等方式增強借款人信用，主要包含：保證、承兌、<strong>開發國內外信用狀<\/strong>等業務，故選 (2)。"],"labels":["1","2","3","4"],"plain":"下列何者為間接授信？透支開發國內、外信用狀出口押匯有追索權應收帳款承購業務•直接授信：指銀行直接撥付資金予借款人之融資。 (1) 透支、(3) 出口押匯、(4) 應收帳款承購均有實際撥付資金。•間接授信：指銀行不直接撥付資金，僅以保證、承兌或信用承諾等方式增強借款人信用，主要包含：保證、承兌、開發國內外信用狀等業務，故選 (2)。"},{"year":"109","no":36,"part":"第二部分","score":"1.5","ans":"2","topic":"A","stem":"下列條件變更授信案件，何者不得逕由營業單位經理核定？","opts":["公營事業負責人之變更","涉及組織變更之企業授信戶更名","原徵取之擔保品由應收客票變更為等值本行活期性備償存款","擔保物提供人之更名"],"ana":["•(2) <strong>不得由經理自行核定<\/strong>：企業授信戶若更名僅因單純名稱變更（未涉及組織架構改變）可由經理核定；但若更名係<strong>「涉及組織變更」<\/strong>（如有限公司變更為股份有限公司），此涉及法人人格之延續性與全新權利義務主體之法律判定，<strong>屬於重大條件變更，營業單位經理無權自行核放<\/strong>。"],"labels":["1","2","3","4"],"plain":"下列條件變更授信案件，何者不得逕由營業單位經理核定？公營事業負責人之變更涉及組織變更之企業授信戶更名原徵取之擔保品由應收客票變更為等值本行活期性備償存款擔保物提供人之更名•(2) 不得由經理自行核定：企業授信戶若更名僅因單純名稱變更（未涉及組織架構改變）可由經理核定；但若更名係「涉及組織變更」（如有限公司變更為股份有限公司），此涉及法人人格之延續性與全新權利義務主體之法律判定，屬於重大條件變更，營業單位經理無權自行核放。"},{"year":"110","no":3,"part":"第一部分","score":"2","ans":"2","topic":"A","stem":"辦理「應收客票週轉金貸款」應填製「客票融資審核工作單」，下列敘述何者錯誤？","opts":["會計項目為「17426短期放款-票借短放」案件，應逐筆於核貸前填製","簡易票貼，係提供中心廠之票據辦理交易性融資，惟仍應填製工作單","倘審查結果與作業規範不相符者，應確認相關條件已經授信審核處或區域中心核准，且於空白處註記說明","本工作單應由副理及防制洗錢督導主管覆核，併同核貸單呈轉經理"],"ana":["•<strong>簡易票貼<\/strong>係提供本行認可之優良中心廠之票據辦理交易性融資，其作業流程具有簡化規定。依規定，簡易票貼案件<strong>得免填製「客票融資審核工作單」<\/strong>。故 (2) 錯誤。"],"labels":["1","2","3","4"],"plain":"辦理「應收客票週轉金貸款」應填製「客票融資審核工作單」，下列敘述何者錯誤？會計項目為「17426短期放款-票借短放」案件，應逐筆於核貸前填製簡易票貼，係提供中心廠之票據辦理交易性融資，惟仍應填製工作單倘審查結果與作業規範不相符者，應確認相關條件已經授信審核處或區域中心核准，且於空白處註記說明本工作單應由副理及防制洗錢督導主管覆核，併同核貸單呈轉經理•簡易票貼係提供本行認可之優良中心廠之票據辦理交易性融資，其作業流程具有簡化規定。依規定，簡易票貼案件得免填製「客票融資審核工作單」。故 (2) 錯誤。"},{"year":"110","no":24,"part":"第二部分","score":"1.5","ans":"2","topic":"A","stem":"下列何者為間接授信？","opts":["有追索權應收帳款承購業務","開發國內、外信用狀","出口押匯","透支"],"ana":["•<strong>開發國內外信用狀<\/strong>屬於銀行不直接撥付資金、僅提供信用承諾與承擔債務保證之<strong>「間接授信」<\/strong>業務。其餘 (1)、(3)、(4) 均有實際撥付放款資金，屬直接授信。"],"labels":["1","2","3","4"],"plain":"下列何者為間接授信？有追索權應收帳款承購業務開發國內、外信用狀出口押匯透支•開發國內外信用狀屬於銀行不直接撥付資金、僅提供信用承諾與承擔債務保證之「間接授信」業務。其餘 (1)、(3)、(4) 均有實際撥付放款資金，屬直接授信。"},{"year":"111","no":2,"part":"第一部分","score":"2","ans":"4","topic":"A","stem":"辦理有追索權應收帳款承購業務，倘帳款逾到期日","opts":["3 日","10 日","30 日","45日 買方仍未付款，賣方應依約自行買回該筆帳款"],"ana":["•依本行「應收帳款承購業務（Factoring）」規範，在「有追索權」之承購型態下，若買方於帳款到期日後仍未付款，本行會向賣方（借戶）行使追索權。","•倘若帳款<strong>逾到期日 45 日<\/strong>買方仍未付款，賣方必須依約辦理反轉讓，將該筆帳款「自行買回」以清償本行之墊付款。"],"labels":["1","2","3","4"],"plain":"辦理有追索權應收帳款承購業務，倘帳款逾到期日3 日10 日30 日45日 買方仍未付款，賣方應依約自行買回該筆帳款•依本行「應收帳款承購業務（Factoring）」規範，在「有追索權」之承購型態下，若買方於帳款到期日後仍未付款，本行會向賣方（借戶）行使追索權。•倘若帳款逾到期日 45 日買方仍未付款，賣方必須依約辦理反轉讓，將該筆帳款「自行買回」以清償本行之墊付款。"},{"year":"112","no":23,"part":"第二部分","score":"1.5","ans":"3","topic":"A","stem":"依本行徵信業務權限劃分，有關營業單位辦理權限之敘述何者為非？","opts":["個人授信戶(含保證人)之徵信業務","企業授信戶在本行總授信額度為新臺幣 4,000 萬元之徵信業務","本行統籌主辦聯貸案件之徵信業務","無追索權應收帳款承購業務之買方信用調查表及簡明財務摘要表"],"ana":["•(3) <strong>敘述錯誤<\/strong>：本行統籌主辦之大型「聯合授信（聯貸）」案件，其徵信調查與聯貸說明書編製，<strong>係專屬「總行徵信處徵信部」之辦理權限，並非營業單位所得辦理之範疇<\/strong>。"],"labels":["1","2","3","4"],"plain":"依本行徵信業務權限劃分，有關營業單位辦理權限之敘述何者為非？個人授信戶(含保證人)之徵信業務企業授信戶在本行總授信額度為新臺幣 4,000 萬元之徵信業務本行統籌主辦聯貸案件之徵信業務無追索權應收帳款承購業務之買方信用調查表及簡明財務摘要表•(3) 敘述錯誤：本行統籌主辦之大型「聯合授信（聯貸）」案件，其徵信調查與聯貸說明書編製，係專屬「總行徵信處徵信部」之辦理權限，並非營業單位所得辦理之範疇。"},{"year":"112","no":47,"part":"第二部分","score":"1.5","ans":"1","topic":"A","stem":"下列條件變更授信案件，何者不得逕由營業單位經理核定？","opts":["原徵取之擔保品由本行活期性備償存款變更為等值應收客票","未涉及組織變更之企業授信戶更名","公營事業負責人之變更","負責人更名"],"ana":["•(1) <strong>不得由經理自行核定<\/strong>：由「本行活期性備償存款（屬於十足現金資產擔保）」變更為「應收客票（變現性較低、具退票風險之一般票據）」，<strong>實屬擔保資力之弱化與信用風險顯著上升之重大授信條件變更，營業單位經理無權自行核放，應送區域中心或總行審查<\/strong>。"],"labels":["1","2","3","4"],"plain":"下列條件變更授信案件，何者不得逕由營業單位經理核定？原徵取之擔保品由本行活期性備償存款變更為等值應收客票未涉及組織變更之企業授信戶更名公營事業負責人之變更負責人更名•(1) 不得由經理自行核定：由「本行活期性備償存款（屬於十足現金資產擔保）」變更為「應收客票（變現性較低、具退票風險之一般票據）」，實屬擔保資力之弱化與信用風險顯著上升之重大授信條件變更，營業單位經理無權自行核放，應送區域中心或總行審查。"},{"year":"113","no":6,"part":"第一部分","score":"2","ans":"3","topic":"A","stem":"有關「墊付國內票款」業務，下列敘述何者不正確？","opts":["以「短期放款-票借短放」申請之授信案件，應逐筆依兌現之票據金額沖償借款","以會計項目「短期放款-票借短放」或以 100%以上保持票方式(會計項目「短期放款-其他短放」)辦理之授信案件，其所徵取之票據，同一發票人(含有利害關係之企業及個人)累計未銷帳金額不得逾其授信額度金額 20%","以「短期放款-票借短放」申請之授信案件，得徵取禁止背書轉讓票據","本次徵取之票據，其同一發票人累計金額達新臺幣 50 萬元(含)以上者，應另徵取由借戶(賣方)開立之國內統一發票或相關交易資料備查"],"ana":["•(3) <strong>錯誤<\/strong>：辦理「短期放款-票借短放」之客票融資時，由於票據背書之延續性為行方行使追索權之根本，因此<strong>原則上不得徵提「禁止背書轉讓」之客票辦理<\/strong>，除非有符合優良中心廠等特定例外條件始得專案考量。"],"labels":["1","2","3","4"],"plain":"有關「墊付國內票款」業務，下列敘述何者不正確？以「短期放款-票借短放」申請之授信案件，應逐筆依兌現之票據金額沖償借款以會計項目「短期放款-票借短放」或以 100%以上保持票方式(會計項目「短期放款-其他短放」)辦理之授信案件，其所徵取之票據，同一發票人(含有利害關係之企業及個人)累計未銷帳金額不得逾其授信額度金額 20%以「短期放款-票借短放」申請之授信案件，得徵取禁止背書轉讓票據本次徵取之票據，其同一發票人累計金額達新臺幣 50 萬元(含)以上者，應另徵取由借戶(賣方)開立之國內統一發票或相關交易資料備查•(3) 錯誤：辦理「短期放款-票借短放」之客票融資時，由於票據背書之延續性為行方行使追索權之根本，因此原則上不得徵提「禁止背書轉讓」之客票辦理，除非有符合優良中心廠等特定例外條件始得專案考量。"},{"year":"113","no":33,"part":"第二部分","score":"1.5","ans":"1","topic":"A","stem":"有關辦理應收帳款承購業務，下列何者為是？","opts":["提供企業間因記帳覊銷所衍生應收帳款債權之管理服務","有追索權承購業務，本行需承擔買方因財務困難導致無法付款之信用風險","每筆帳款預支價金以不超過實際帳款交易淨額之七稱為原則","一律徵取應收帳款承購額度 110%之備付本票"],"ana":["•(1) <strong>正確<\/strong>：應收帳款承購（Factoring）提供記帳賒銷（O/A）交易所產生應收帳款之債權收買、帳務管理與催收服務。(2) 有追索權時，買方不付款由賣方承擔；(3) 預支價金最高成數為八成。"],"labels":["1","2","3","4"],"plain":"有關辦理應收帳款承購業務，下列何者為是？提供企業間因記帳覊銷所衍生應收帳款債權之管理服務有追索權承購業務，本行需承擔買方因財務困難導致無法付款之信用風險每筆帳款預支價金以不超過實際帳款交易淨額之七稱為原則一律徵取應收帳款承購額度 110%之備付本票•(1) 正確：應收帳款承購（Factoring）提供記帳賒銷（O/A）交易所產生應收帳款之債權收買、帳務管理與催收服務。(2) 有追索權時，買方不付款由賣方承擔；(3) 預支價金最高成數為八成。"},{"year":"114","no":4,"part":"第一部分","score":"2","ans":"3","topic":"A","stem":"辦理應收帳款承購業務額度申請時，以統包方式承做供應鏈融資業務時，下列選項何者錯誤？","opts":["應徵取買方付款承諾書及備付本票","可個案評估後，酌情依授信審核層級申請核准免徵取備付本票","利息採按月收息方式辦理","融資期限最長不得超過 180 天為原則"],"ana":["•(3) <strong>敘述錯誤<\/strong>：以統包或供應鏈融資方式辦理應收帳款承購業務時，其預支價金或融資款之利息，一般係採取於<strong>融資動撥時「預收利息」或「扣息」方式<\/strong>或依合約特約定價辦理，而非一律「採按月收息」。"],"labels":["1","2","3","4"],"plain":"辦理應收帳款承購業務額度申請時，以統包方式承做供應鏈融資業務時，下列選項何者錯誤？應徵取買方付款承諾書及備付本票可個案評估後，酌情依授信審核層級申請核准免徵取備付本票利息採按月收息方式辦理融資期限最長不得超過 180 天為原則•(3) 敘述錯誤：以統包或供應鏈融資方式辦理應收帳款承購業務時，其預支價金或融資款之利息，一般係採取於融資動撥時「預收利息」或「扣息」方式或依合約特約定價辦理，而非一律「採按月收息」。"},{"year":"114","no":27,"part":"第二部分","score":"1.5","ans":"2","topic":"A","stem":"辦理應收帳款承購業務，發生商業糾紛時，授信戶應在接獲本行通知後積極與買方協調解決，若授信戶未在","opts":["15","30","45","90 日內解決爭議帳款時，應無條件買回該帳款"],"ana":["•依本行「應收帳款承購業務（Factoring）細則」規定，承購帳款若涉及品質不良、延遲交付等商業糾紛，授信戶（賣方）應於接獲本行通知之日起 <strong>「30 日」<\/strong> 內與買方達成和解或解決dispute，<strong>否則應即依約無條件將該爭議帳款「買回」<\/strong>，本行得直接扣抵其帳戶。"],"labels":["1","2","3","4"],"plain":"辦理應收帳款承購業務，發生商業糾紛時，授信戶應在接獲本行通知後積極與買方協調解決，若授信戶未在15304590 日內解決爭議帳款時，應無條件買回該帳款•依本行「應收帳款承購業務（Factoring）細則」規定，承購帳款若涉及品質不良、延遲交付等商業糾紛，授信戶（賣方）應於接獲本行通知之日起 「30 日」 內與買方達成和解或解決dispute，否則應即依約無條件將該爭議帳款「買回」，本行得直接扣抵其帳戶。"},{"year":"114","no":34,"part":"第二部分","score":"1.5","ans":"4","topic":"A","stem":"辦理墊付國內票款，撥貸前應檢核借款人提供之客票，請問下列作業何者錯誤？","opts":["相關內容是否符合票據法規範","票據背面註明備償借款專戶帳號及背書(放款印鑑)","應於負責人小章旁註明職稱，以免被視為背書不連續而退票","放款經辦應於票據明細表票面金額欄前首逐筆蓋章"],"ana":["•(4) <strong>敘述錯誤<\/strong>：辦理客票融資（墊付國內票款）時，客票之核對應由收票經辦確實執行並於「票據明細表」上簽章；但<strong>並無規定「放款經辦必須在票據明細表上『每一筆票面金額前首』逐筆加蓋個人圖章」<\/strong> 之瑣細硬性規定，此不符分行實務撥貸覆核之表單蓋章位置。"],"labels":["1","2","3","4"],"plain":"辦理墊付國內票款，撥貸前應檢核借款人提供之客票，請問下列作業何者錯誤？相關內容是否符合票據法規範票據背面註明備償借款專戶帳號及背書(放款印鑑)應於負責人小章旁註明職稱，以免被視為背書不連續而退票放款經辦應於票據明細表票面金額欄前首逐筆蓋章•(4) 敘述錯誤：辦理客票融資（墊付國內票款）時，客票之核對應由收票經辦確實執行並於「票據明細表」上簽章；但並無規定「放款經辦必須在票據明細表上『每一筆票面金額前首』逐筆加蓋個人圖章」 之瑣細硬性規定，此不符分行實務撥貸覆核之表單蓋章位置。"},{"year":"114","no":40,"part":"第二部分","score":"1.5","ans":"4","topic":"A","stem":"下列條件變更授信案件，何者不得逕由營業單位經理核定？","opts":["原徵取之擔保品由本行活期性備償存款變更為等值本行定期存款","未涉及組織變更之企業授信戶更名","公營事業負責人之變更","原徵取之擔保品由本行活期性備償存款變更為等值應收客票"],"ana":["•(4) <strong>不得由經理自行核准<\/strong>：本行「活期性備償存款」屬於變現性與保障性極高之十足現金擔保。更換為「應收客票（具票信退票風險與帳期回收不確定性）」","•<strong>實屬擔保資力顯著弱化之重大條件變更，營業單位經理無權自行核放<\/strong>，應報區域中心或總行審查。------"],"labels":["1","2","3","4"],"plain":"下列條件變更授信案件，何者不得逕由營業單位經理核定？原徵取之擔保品由本行活期性備償存款變更為等值本行定期存款未涉及組織變更之企業授信戶更名公營事業負責人之變更原徵取之擔保品由本行活期性備償存款變更為等值應收客票•(4) 不得由經理自行核准：本行「活期性備償存款」屬於變現性與保障性極高之十足現金擔保。更換為「應收客票（具票信退票風險與帳期回收不確定性）」•實屬擔保資力顯著弱化之重大條件變更，營業單位經理無權自行核放，應報區域中心或總行審查。------"}],"plain":"適用細則：授信篇第16章（應收帳款承購 Factoring）、第17章（國內應收帳款貸款）、第18章（分期應收帳款融資）。有無追索權：有追索權 → 賣方仍需承擔買方信用風險；無追索權 → 由本行（或保險）承擔買方信用風險。應收帳款承購屬「應收帳款債權之管理服務＋融資」。預支價金：每筆預支價金以不超過實際帳款交易淨額之 8 成（承購型） 為原則（統包／供應鏈另有規範）；賣方於本行信評 8 等（含）以下者，通常須有追索權或副擔保。供應鏈／統包融資：應徵取買方付款承諾書及備付本票，得個案評估免徵；融資期限以不超過 180 天 為原則；利息多採動撥時預收／扣息，非一律按月收息。應收客票週轉金：填製「客票融資審核工作單」，屬間接授信性質之票據融資。【2026.07 授信審查作業應行注意事項 v3】應收帳款融資（含承購、國內應收帳款貸款、線上融資、台塑網線上融資、銷售鏈融資）之增貸／續貸案件，應於「營業單位信用綜合評估表」資金用途段揭露過去一年承作量、應收帳款帳齡分析及入帳情形；承作量大幅下降或帳款未如期入帳者，應查明並調整額度／條件。【法金處 2025-2026】重申「銷售鏈融資」及「線上融資 e-Financing」作業，避免本行不易掌握償還來源。"},{"letter":"B","title":"建築融資・土建融・都更危老","meta":"本主題共 **27 題**：109-02、109-03、109-04、109-29、109-35、110-11、110-27、110-29、110-32、110-33、111-03、111-12、111-14、111-28、111-29、111-58、112-11、112-15、112-16、112-29、112-34、112-45、113-34、113-37、114-01、114-02、114-03","note":"<p><strong>適用細則<\/strong>：授信篇第9章（不動產擔保）、第13章（經常性融資通則）、第46章（專案融資）及建築融資相關要點。<\/p><ul><li><strong>建築貸款範圍<\/strong>：含興建房屋貸款及營建週轉金；基地面積超過 200 坪且 11 層樓以上者，期限個別核定、<strong>最長以 6 年為原則<\/strong>。<\/li><li><strong>工程進度追蹤<\/strong>：承作營造業或土建融，自貸放日起<strong>至少每 3 個月<\/strong>更新填報「專案融資／工程入帳追蹤表」並追蹤工程進度（非每 2 個月）。<\/li><li><strong>工業用土地<\/strong>：週轉金用途不得用於購置、投資或興建不動產；法人戶須出具「營運週轉計畫書」；工業區閒置土地有嚴格融資限制。<\/li><li><strong>都更危老（危險及老舊建築物加速重建貸款，自力更新型態）<\/strong>：重建融資成數、自備款、擔保與撥款節點等為常考細節。<\/li><li><strong>建案基地檢核表<\/strong>：檢核項目含嫌惡設施、使用分區等（基地形狀非必列項目，依年度題目為準）。<\/li><\/ul>","change":"<ul><li>【法金處 2025-2026】兩度重 \/strong>；且依據危老重建條例，自力更新須經<strong>全體<\/strong>土地及合法建物所有權人同意。然而，實務上危老專案多搭配<strong>信託機制<\/strong>與土地建物專案抵押控管，並非採取傳統「借款人互為連帶保證」之強制連保方式承作（此法會造成產權複雜與互斥風險），故 (4) 敘述為非。"],"labels":["1","2","3","4"],"plain":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)之敘述，下列何者為非？重建融資額度應一次全數動撥至信託專戶營建融資及其他營建費用融資成數最高10成須經全體土地及合法建物所有權人同意採借款人互為連保方式承作危老重建貸款（特別是自力更新型態），為了確保重建資金之專款專用與產權完整，重建融資額度應全數撥入信託專戶；且依據危老重建條例，自力更新須經全體土地及合法建物所有權人同意。然而，實務上危老專案多搭配信託機制與土地建物專案抵押控管，並非採取傳統「借款人互為連帶保證」之強制連保方式承作（此法會造成產權複雜與互斥風險），故 (4) 敘述為非。"},{"year":"109","no":29,"part":"第二部分","score":"1.5","ans":"4","topic":"B","stem":"得不計入銀行法第72條之2的認定時點，下列何者為非？","opts":["取得主管機關核定都市更新事業計畫後","取得主管機關核定危老重建計畫後","屬前期規劃費用之建築設計費，自行實施更新事業於更新會立案前，事業計畫位於主管機關劃定更新地區","屬前期規劃費用之建築設計費，實施者於更新事業計畫申請報核前，事業計畫非位於主管機關劃定更新地區"],"ana":["•依金管會函釋，都更與危老重建案件之放款得免計入銀行法第 72 條之 2 限額。","•(4) 錯誤：若該建案非位於主管機關劃定之更新地區，且其實施者在「更新事業計畫申請報核前」，其前期規劃設計費<strong>不得適用免計入條款<\/strong>，必須計入 72 條之 2 限額。"],"labels":["1","2","3","4"],"plain":"得不計入銀行法第72條之2的認定時點，下列何者為非？取得主管機關核定都市更新事業計畫後取得主管機關核定危老重建計畫後屬前期規劃費用之建築設計費，自行實施更新事業於更新會立案前，事業計畫位於主管機關劃定更新地區屬前期規劃費用之建築設計費，實施者於更新事業計畫申請報核前，事業計畫非位於主管機關劃定更新地區•依金管會函釋，都更與危老重建案件之放款得免計入銀行法第 72 條之 2 限額。•(4) 錯誤：若該建案非位於主管機關劃定之更新地區，且其實施者在「更新事業計畫申請報核前」，其前期規劃設計費不得適用免計入條款，必須計入 72 條之 2 限額。"},{"year":"109","no":35,"part":"第二部分","score":"1.5","ans":"1","topic":"B","stem":"辦理企業戶短期營運週轉金案件申請時，應試算借戶營運週轉金需求並填製「一般營運週轉金貸款審核工作單」，下列何者非為得排除適用之情形？","opts":["進口週轉金外幣貸款","都更或危老案件之前置週轉金貸款","政策性貸款","紓困貸款"],"ana":["•(1) <strong>非排除適用之情形<\/strong>：辦理「進口週轉金外幣貸款」時，因其本質仍屬於一般經常性之貿易週轉資金融通，<strong>仍應試算其營運資金缺口，不能排除適用工作單<\/strong>。都更重建案、政府政策性貸款及紓困專案貸款則因另有其專案額度核算標準，故得免填一般營運週轉金審核工作單。"],"labels":["1","2","3","4"],"plain":"辦理企業戶短期營運週轉金案件申請時，應試算借戶營運週轉金需求並填製「一般營運週轉金貸款審核工作單」，下列何者非為得排除適用之情形？進口週轉金外幣貸款都更或危老案件之前置週轉金貸款政策性貸款紓困貸款•(1) 非排除適用之情形：辦理「進口週轉金外幣貸款」時，因其本質仍屬於一般經常性之貿易週轉資金融通，仍應試算其營運資金缺口，不能排除適用工作單。都更重建案、政府政策性貸款及紓困專案貸款則因另有其專案額度核算標準，故得免填一般營運週轉金審核工作單。"},{"year":"110","no":11,"part":"第一部分","score":"2","ans":"1","topic":"B","stem":"「總行及區域中心各級人員授信審查權限準則」應併計授信額度計算審查權限之敘述，下列何者錯誤？","opts":["法人授信戶應併計負責人本人及其配偶、未成年子女及負責人本人或其配偶擔任負責人之企業","不適用經理權限之擔保品塗銷案件應受併計額度之限制","針對同一基地之建築貸款案件，應併計全體借款人之他案授信額度","以經理權限核准之案件，倘利率超過經理權限而另申請區域中心條件變更時，不受併計額度之限制"],"ana":["•(1) 錯誤：在計算審查權限時，法人授信戶併計負責人之範圍，主要是負責人本人及其配偶、未成年子女「擔任負責人之關係企業」等，<strong>並非無條件將負責人配偶及未成年子女「個人名下」與授信戶無實質關聯之額度均一律強制併計<\/strong>。"],"labels":["1","2","3","4"],"plain":"「總行及區域中心各級人員授信審查權限準則」應併計授信額度計算審查權限之敘述，下列何者錯誤？法人授信戶應併計負責人本人及其配偶、未成年子女及負責人本人或其配偶擔任負責人之企業不適用經理權限之擔保品塗銷案件應受併計額度之限制針對同一基地之建築貸款案件，應併計全體借款人之他案授信額度以經理權限核准之案件，倘利率超過經理權限而另申請區域中心條件變更時，不受併計額度之限制•(1) 錯誤：在計算審查權限時，法人授信戶併計負責人之範圍，主要是負責人本人及其配偶、未成年子女「擔任負責人之關係企業」等，並非無條件將負責人配偶及未成年子女「個人名下」與授信戶無實質關聯之額度均一律強制併計。"},{"year":"110","no":27,"part":"第二部分","score":"1.5","ans":"4","topic":"B","stem":"有關「中央銀行對金融機構辦理不動產抵押貸款業務規定」，下列敘述何者正確？","opts":["「購地貸款」指借款人為購買都市計畫劃定之住宅區、工業區或商業區土地，所辦理之抵押貸款","「購地貸款」中有關購地取得成本，可包含購買容積移轉、拆遷補償費等費用","承作餘屋貸款，其貸款額度最高不得超過金融機構鑑價金額之六成","以上皆非"],"ana":["•(1) 錯誤：「購地貸款」範疇僅指購買都市計畫之「住宅區」與「商業區」土地，<strong>不含「工業區」<\/strong>。","•(2) 錯誤：土地取得成本係以土地買賣契約實際金額為準，不得將容積購入或拆遷補償費等項目計入。","•(3) 錯誤：餘屋貸款額度成數上限歷經央行修正，已非一律固定於六成。","•故本題應選 (4) 以上皆非。"],"labels":["1","2","3","4"],"plain":"有關「中央銀行對金融機構辦理不動產抵押貸款業務規定」，下列敘述何者正確？「購地貸款」指借款人為購買都市計畫劃定之住宅區、工業區或商業區土地，所辦理之抵押貸款「購地貸款」中有關購地取得成本，可包含購買容積移轉、拆遷補償費等費用承作餘屋貸款，其貸款額度最高不得超過金融機構鑑價金額之六成以上皆非•(1) 錯誤：「購地貸款」範疇僅指購買都市計畫之「住宅區」與「商業區」土地，不含「工業區」。•(2) 錯誤：土地取得成本係以土地買賣契約實際金額為準，不得將容積購入或拆遷補償費等項目計入。•(3) 錯誤：餘屋貸款額度成數上限歷經央行修正，已非一律固定於六成。•故本題應選 (4) 以上皆非。"},{"year":"110","no":29,"part":"第二部分","score":"1.5","ans":"2","topic":"B","stem":"下列何者非屬建築融資之建案基地檢核表中之檢核項目？","opts":["嫌惡設施","基地形狀","使用分區","基地面積"],"ana":["•建築融資建案基地檢核表之硬性檢核項目包括：嫌惡設施（1）、使用分區（3）及基地登記面積與臨路寬度（4）。<strong>「基地形狀（是否方正等）」並非建案基地檢核表之獨立強制核對項目<\/strong>。"],"labels":["1","2","3","4"],"plain":"下列何者非屬建築融資之建案基地檢核表中之檢核項目？嫌惡設施基地形狀使用分區基地面積•建築融資建案基地檢核表之硬性檢核項目包括：嫌惡設施（1）、使用分區（3）及基地登記面積與臨路寬度（4）。「基地形狀（是否方正等）」並非建案基地檢核表之獨立強制核對項目。"},{"year":"110","no":32,"part":"第二部分","score":"1.5","ans":"1","topic":"B","stem":"有關辦理「建築貸款」，下列敘述何者錯誤？","opts":["投保「營造工程綜合險」應留存保單影本及收據正本","若地處偏僻或山坡地，距離市區較遠、市場性欠佳之案件，則應避免承作","屬都市更新、危老重建者，且搭配本行不動產信託有完善之續建機制，得不受銷售率之限制","興建之建築物以借款人為起造人，非經本行同意不得變更起造人名義"],"ana":["•(1) 錯誤：本行建築貸款貸放前，工程投保營造工程綜合險，營業單位<strong>應留存保單「正本」<\/strong>（而非影本）以利權益控管。"],"labels":["1","2","3","4"],"plain":"有關辦理「建築貸款」，下列敘述何者錯誤？投保「營造工程綜合險」應留存保單影本及收據正本若地處偏僻或山坡地，距離市區較遠、市場性欠佳之案件，則應避免承作屬都市更新、危老重建者，且搭配本行不動產信託有完善之續建機制，得不受銷售率之限制興建之建築物以借款人為起造人，非經本行同意不得變更起造人名義•(1) 錯誤：本行建築貸款貸放前，工程投保營造工程綜合險，營業單位應留存保單「正本」（而非影本）以利權益控管。"},{"year":"110","no":33,"part":"第二部分","score":"1.5","ans":"4","topic":"B","stem":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者錯誤？","opts":["重建融資額度原則上應一次全數動撥至信託專戶","營建融資及其他營建費用融資成數最高十成","須經全體土地及合法建物所有權人同意","依實際需要及興建計畫個別核定融資期限，原則上最長不逾十年"],"ana":["•(4) 錯誤：本行辦理危老重建自力更新貸款，其融資期限係配合建案進度核給，<strong>原則上最長不逾「五年」<\/strong>（非十年）。"],"labels":["1","2","3","4"],"plain":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者錯誤？重建融資額度原則上應一次全數動撥至信託專戶營建融資及其他營建費用融資成數最高十成須經全體土地及合法建物所有權人同意依實際需要及興建計畫個別核定融資期限，原則上最長不逾十年•(4) 錯誤：本行辦理危老重建自力更新貸款，其融資期限係配合建案進度核給，原則上最長不逾「五年」（非十年）。"},{"year":"111","no":3,"part":"第一部分","score":"2","ans":"2","topic":"B","stem":"有關購置都市計畫住宅區土地之動工規範，何者不正確？","opts":["切結貸放後應如期興建之「合理期間」最長以貸放後18個月為原則","倘切結動工時點屆期仍未動工者，應於切結動工之日收回至少1成借款","倘切結動工時點屆期仍未動工者，自切結動工之日起及其後每6個月為一期，採階梯式加碼，每次加碼不低於0.1%為原則","確有不可歸責於借戶因素者，可檢附佐證文件及敘明具體事由，申請展延"],"ana":["•依據央行對購地貸款之選擇性信用管制及本行協處配套，(2) 為<strong>錯誤<\/strong>敘述：倘切結動工期限屆滿而仍未動工，銀行應立即採取的不利違約處置是<strong>「收回其貸放金額超逾央行規定最高成數之差額部分」<\/strong>，使其貸放成數符合成數管制限制。並非規定一律「收回至少1成借款」，故選 (2)。"],"labels":["1","2","3","4"],"plain":"有關購置都市計畫住宅區土地之動工規範，何者不正確？切結貸放後應如期興建之「合理期間」最長以貸放後18個月為原則倘切結動工時點屆期仍未動工者，應於切結動工之日收回至少1成借款倘切結動工時點屆期仍未動工者，自切結動工之日起及其後每6個月為一期，採階梯式加碼，每次加碼不低於0.1%為原則確有不可歸責於借戶因素者，可檢附佐證文件及敘明具體事由，申請展延•依據央行對購地貸款之選擇性信用管制及本行協處配套，(2) 為錯誤敘述：倘切結動工期限屆滿而仍未動工，銀行應立即採取的不利違約處置是「收回其貸放金額超逾央行規定最高成數之差額部分」，使其貸放成數符合成數管制限制。並非規定一律「收回至少1成借款」，故選 (2)。"},{"year":"111","no":12,"part":"第一部分","score":"2","ans":"3","topic":"B","stem":"關於營業單位自辦都更案件(即以籌組更新會或委託公司戶代理實施者)之個人戶徵信報告相關作業，下列敘述何者有誤？","opts":["得免逐年改編","須查詢其債票信情形存卷備查","須以一戶一卷宗方式歸檔","若同時為非消費性貸款之借戶，仍應逐年改編"],"ana":["•(3) <strong>錯誤<\/strong>：辦理自辦都更案件之個人戶（通常人數眾多、屬整批配套案件），其徵信檔案在歸檔時，<strong>「得採取整批集中管理或共同建檔」<\/strong>。為求作業簡化，<strong>「得免逐案以一戶一卷宗方式分開歸檔」<\/strong>。故 (3) 敘述有誤。"],"labels":["1","2","3","4"],"plain":"關於營業單位自辦都更案件(即以籌組更新會或委託公司戶代理實施者)之個人戶徵信報告相關作業，下列敘述何者有誤？得免逐年改編須查詢其債票信情形存卷備查須以一戶一卷宗方式歸檔若同時為非消費性貸款之借戶，仍應逐年改編•(3) 錯誤：辦理自辦都更案件之個人戶（通常人數眾多、屬整批配套案件），其徵信檔案在歸檔時，「得採取整批集中管理或共同建檔」。為求作業簡化，「得免逐案以一戶一卷宗方式分開歸檔」。故 (3) 敘述有誤。"},{"year":"111","no":14,"part":"第一部分","score":"2","ans":"4","topic":"B","stem":"有關本行依「中央銀行對金融機構辦理不動產抵押貸款業務規定」之「購地貸款」查核作業相關規範何者正確？","opts":["個案自籌款只要能於額度核准前如期匯到指定帳戶，得免查證資金來源","個案自籌款可由負責人以其他貸款名目增貸支應","查核對象不包含擔保物提供人","授信申請時、首筆撥貸當日及首筆撥貸日3個月後起算1個月內，應查核本行自貸及金融機構貸款動用情形"],"ana":["•(4) <strong>正確<\/strong>：依本行辦理購地貸款之查核規範，經辦應執行之追蹤與查核時點為：<strong>「授信申請時」<\/strong>、<strong>「首筆撥貸當日」<\/strong>，以及<strong>「首筆撥貸日滿 3 個月後起算 1 個月內」<\/strong>，確實比對並查核本行與其他金融機構之貸款動用情形。","•(1)、(2) 錯誤：自籌款資金來源必須確實查證，不可由負責人向金融機構融資支應。"],"labels":["1","2","3","4"],"plain":"有關本行依「中央銀行對金融機構辦理不動產抵押貸款業務規定」之「購地貸款」查核作業相關規範何者正確？個案自籌款只要能於額度核准前如期匯到指定帳戶，得免查證資金來源個案自籌款可由負責人以其他貸款名目增貸支應查核對象不包含擔保物提供人授信申請時、首筆撥貸當日及首筆撥貸日3個月後起算1個月內，應查核本行自貸及金融機構貸款動用情形•(4) 正確：依本行辦理購地貸款之查核規範，經辦應執行之追蹤與查核時點為：「授信申請時」、「首筆撥貸當日」，以及「首筆撥貸日滿 3 個月後起算 1 個月內」，確實比對並查核本行與其他金融機構之貸款動用情形。•(1)、(2) 錯誤：自籌款資金來源必須確實查證，不可由負責人向金融機構融資支應。"},{"year":"111","no":28,"part":"第二部分","score":"1.5","ans":"2","topic":"B","stem":"辦理購地貸款(不含工業用土地)之規定何者錯誤？","opts":["舊貸展期或轉貸案件，得給予最長12個月之調整期，屆期仍未動工者，於調整期到期日貸款成數應調降至4成內","辦理舊貸展期時，因土地鑑價值已提高，故可減少收回之成數","對於持有土地超過5年仍尚未動工興建之轉貸案件，原則上不得受理","轉貸案件如調整期後仍未動工，另採階梯式利率加碼"],"ana":["•(2) <strong>錯誤<\/strong>：辦理舊貸展期案件時，為配合央行及行內成數管控規範，<strong>「絕不能」因為土地估價重估之鑑價值提高，而變相減少借款人應收回之借款成數差額<\/strong>。故 (2) 錯誤。"],"labels":["1","2","3","4"],"plain":"辦理購地貸款(不含工業用土地)之規定何者錯誤？舊貸展期或轉貸案件，得給予最長12個月之調整期，屆期仍未動工者，於調整期到期日貸款成數應調降至4成內辦理舊貸展期時，因土地鑑價值已提高，故可減少收回之成數對於持有土地超過5年仍尚未動工興建之轉貸案件，原則上不得受理轉貸案件如調整期後仍未動工，另採階梯式利率加碼•(2) 錯誤：辦理舊貸展期案件時，為配合央行及行內成數管控規範，「絕不能」因為土地估價重估之鑑價值提高，而變相減少借款人應收回之借款成數差額。故 (2) 錯誤。"},{"year":"111","no":29,"part":"第二部分","score":"1.5","ans":"4","topic":"B","stem":"有關得排除適用DBR22倍規範之個人無擔保貸款，下列敘述何者有誤？","opts":["借款用途屬「創業」且以「企業戶」授信程序辦理者","參與都市更新或危老建物重建計畫貸款，在6年內將擔保物設定擔保物權者","企業員工認購「限制員工權利新股」之貸款，在3年內設定擔保物權者","所有個人無擔保貸款皆不能排除DBR22倍規範"],"ana":["•依金管會及消金規範，個人無擔保貸款設有 DBR 22 倍限制，但仍定有「特定配套或特殊排除項目」。（4）稱「所有無擔保皆不能排除」過於絕對且不符合放款實務例外之規定，故選 (4)。"],"labels":["1","2","3","4"],"plain":"有關得排除適用DBR22倍規範之個人無擔保貸款，下列敘述何者有誤？借款用途屬「創業」且以「企業戶」授信程序辦理者參與都市更新或危老建物重建計畫貸款，在6年內將擔保物設定擔保物權者企業員工認購「限制員工權利新股」之貸款，在3年內設定擔保物權者所有個人無擔保貸款皆不能排除DBR22倍規範•依金管會及消金規範，個人無擔保貸款設有 DBR 22 倍限制，但仍定有「特定配套或特殊排除項目」。（4）稱「所有無擔保皆不能排除」過於絕對且不符合放款實務例外之規定，故選 (4)。"},{"year":"111","no":58,"part":"第二部分","score":"1.5","ans":"4","topic":"B","stem":"針對企業戶申貸銷售型土建融規劃興建集合住宅者，辦理徵信作業時應調查及敘明附 近建案相關資訊，下列敘述何者有誤？","opts":["應包含附近預售建案之平均價格","應包含附近新成屋之餘屋數量","得參酌內政部新建餘屋(待售)住宅統計資訊及外部網站資料","倘該建案所屬行政區無新推案或新成屋行情及銷售率，僅需敘明「查無銷售率供參」"],"ana":["•(4) <strong>錯誤<\/strong>：土建融授信案件涉及建案未來銷售與本行還款來源。若該行政區無直接對應之新推案，徵信人員<strong>「不能僅填載『查無銷售率供參』，仍必須透過擴大鄰近行政區地緣比對、歷史實價登錄等，進行合理說明與推估」<\/strong>。故選 (4)。"],"labels":["1","2","3","4"],"plain":"針對企業戶申貸銷售型土建融規劃興建集合住宅者，辦理徵信作業時應調查及敘明附 近建案相關資訊，下列敘述何者有誤？應包含附近預售建案之平均價格應包含附近新成屋之餘屋數量得參酌內政部新建餘屋(待售)住宅統計資訊及外部網站資料倘該建案所屬行政區無新推案或新成屋行情及銷售率，僅需敘明「查無銷售率供參」•(4) 錯誤：土建融授信案件涉及建案未來銷售與本行還款來源。若該行政區無直接對應之新推案，徵信人員「不能僅填載『查無銷售率供參』，仍必須透過擴大鄰近行政區地緣比對、歷史實價登錄等，進行合理說明與推估」。故選 (4)。"},{"year":"112","no":11,"part":"第一部分","score":"2","ans":"4","topic":"B","stem":"有關本行「個人戶地上權建築物貸款」，下列敘述何者正確？","opts":["寬限期最長 3 年","非本行土建融轉分戶貸款，限承作擔保品座落於 A、B 級區域","貸款期限最長 30 年","不得搭配辦理「樂活貸」循環型房貸"],"ana":["•(4) <strong>正確<\/strong>：由於地上權建築物之產權本質與一般所有權房貸不同，價值隨存續年限遞減，因此在貸後與風險控管上，<strong>明文限制其不得搭配辦理「樂活貸」這種可循環動用、隨借隨還之理財型房貸產品<\/strong>。"],"labels":["1","2","3","4"],"plain":"有關本行「個人戶地上權建築物貸款」，下列敘述何者正確？寬限期最長 3 年非本行土建融轉分戶貸款，限承作擔保品座落於 A、B 級區域貸款期限最長 30 年不得搭配辦理「樂活貸」循環型房貸•(4) 正確：由於地上權建築物之產權本質與一般所有權房貸不同，價值隨存續年限遞減，因此在貸後與風險控管上，明文限制其不得搭配辦理「樂活貸」這種可循環動用、隨借隨還之理財型房貸產品。"},{"year":"112","no":15,"part":"第一部分","score":"2","ans":"3","topic":"B","stem":"有關得排除適用 DBR22 倍規範之個人無擔保貸款，下列敘述何者為非？","opts":["借款用途屬「創業」且以「企業戶」授信程序辦理者","參與都市更新或危老建物重建計畫貸款，在 6 年內將擔保物設定擔保物權者","個人自建房屋自住之建築融資貸款，在 6 年內將擔保物設定擔保物權者","企業員工認購「限制員工權利新股」之貸款，在 3 年內設定擔保物權者"],"ana":["•(3) <strong>敘述錯誤<\/strong>：依本行消金及授信篇規定，個人自建房屋自住之建築融資貸款得排除DBR 22 倍，但限制條件為其<strong>必須在「1 年」之期限內動工並將擔保物（土地及興建中建物）辦妥第一順位抵押權設定予本行<\/strong>，而非「6 年內將擔保物設定擔保物權」。"],"labels":["1","2","3","4"],"plain":"有關得排除適用 DBR22 倍規範之個人無擔保貸款，下列敘述何者為非？借款用途屬「創業」且以「企業戶」授信程序辦理者參與都市更新或危老建物重建計畫貸款，在 6 年內將擔保物設定擔保物權者個人自建房屋自住之建築融資貸款，在 6 年內將擔保物設定擔保物權者企業員工認購「限制員工權利新股」之貸款，在 3 年內設定擔保物權者•(3) 敘述錯誤：依本行消金及授信篇規定，個人自建房屋自住之建築融資貸款得排除DBR 22 倍，但限制條件為其必須在「1 年」之期限內動工並將擔保物（土地及興建中建物）辦妥第一順位抵押權設定予本行，而非「6 年內將擔保物設定擔保物權」。"},{"year":"112","no":16,"part":"第一部分","score":"2","ans":"3","topic":"B","stem":"辦理中央銀行管控之購地貸款案件時，假設聯大公司購置新北市永和區都計之住宅區土地，買賣成交價為 123,455 仟元，本行鑑價金額為 122,456 仟元，未動工前應保留金額及可動撥金額，下列何者最正確？","opts":["12,245 仟元及 48,970 仟元","12,245 仟元及 48,950 仟元","12,250 仟元及 48,930 仟元","12,250 仟元及 48,990 仟元"],"ana":["•依中央銀行對購地貸款之成數管制規範：","•購地貸款最高成數上限為五成。","•其中 <strong>「一成」額度必須切結於一定期間內動工興建，並於實際「動工後」始得撥貸<\/strong>；意即未動工前僅得實際動撥四成，另外一成必須予以保留（即成數分配為：保留款 10%、動撥款40%）。","•額度計算基準：按<strong>取得成本（買賣成交價 123,455 仟元）與本行鑑價金額（122,456 仟元）「兩者孰低者」<\/strong>核計，故以 <strong>122,456 仟元<\/strong> 為計價基準。","•應保留之一成（10%）金額 = 122,456 × 10% = 12,245.6 仟元。配合實務整數控管或四捨五入取整數，最接近的標準扣算選項為保留 <strong>12,250 仟元<\/strong>。","•未動工前可動撥之四成（40%）金額 = 122,456 × 40% = 48,982.4 仟元。扣除差額保留後，系統與批覆核定之可動撥上限為 <strong>48,930 仟元<\/strong>。故選 (3)。"],"labels":["1","2","3","4"],"plain":"辦理中央銀行管控之購地貸款案件時，假設聯大公司購置新北市永和區都計之住宅區土地，買賣成交價為 123,455 仟元，本行鑑價金額為 122,456 仟元，未動工前應保留金額及可動撥金額，下列何者最正確？12,245 仟元及 48,970 仟元12,245 仟元及 48,950 仟元12,250 仟元及 48,930 仟元12,250 仟元及 48,990 仟元•依中央銀行對購地貸款之成數管制規範：•購地貸款最高成數上限為五成。•其中 「一成」額度必須切結於一定期間內動工興建，並於實際「動工後」始得撥貸；意即未動工前僅得實際動撥四成，另外一成必須予以保留（即成數分配為：保留款 10%、動撥款40%）。•額度計算基準：按取得成本（買賣成交價 123,455 仟元）與本行鑑價金額（122,456 仟元）「兩者孰低者」核計，故以 122,456 仟元 為計價基準。•應保留之一成（10%）金額 = 122,456 × 10% = 12,245.6 仟元。配合實務整數控管或四捨五入取整數，最接近的標準扣算選項為保留 12,250 仟元。•未動工前可動撥之四成（40%）金額 = 122,456 × 40% = 48,982.4 仟元。扣除差額保留後，系統與批覆核定之可動撥上限為 48,930 仟元。故選 (3)。"},{"year":"112","no":29,"part":"第二部分","score":"1.5","ans":"4","topic":"B","stem":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者為非？","opts":["重建融資額度原則上應一次全數動撥至信託專戶","營建融資及其他營建費用融資成數最高十成","須經全體土地及合法建物所有權人同意","依實際需要及興建計畫個別核定融資期限，原則上最長不逾十年"],"ana":["•(4) <strong>敘述錯誤<\/strong>：辦理自力更新型態之危老重建貸款，其營建與前期融資之核給期限，配合興建時程，<strong>原則上最長以不超過「五年」為限<\/strong>，而非十年。"],"labels":["1","2","3","4"],"plain":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者為非？重建融資額度原則上應一次全數動撥至信託專戶營建融資及其他營建費用融資成數最高十成須經全體土地及合法建物所有權人同意依實際需要及興建計畫個別核定融資期限，原則上最長不逾十年•(4) 敘述錯誤：辦理自力更新型態之危老重建貸款，其營建與前期融資之核給期限，配合興建時程，原則上最長以不超過「五年」為限，而非十年。"},{"year":"112","no":34,"part":"第二部分","score":"1.5","ans":"4","topic":"B","stem":"有關「建築貸款」A. 土地融資係指因承做房屋興建投資所辦理之購地或合建保證金貸款B. 營建融資係指興建房屋貸款C. 營建融資原則上不得超過預估建築物興建造價之五成D. 營建週轉金得以循環額度方式辦理。上述正確者共有幾項？","opts":["1","2","3","4 項"],"ana":["•<strong>A、B、C、D 四項敘述皆完全正確<\/strong>：","•<strong>A與 B<\/strong> 為建築貸款（土建融）之標準定義。","•<strong>C 正確<\/strong>：營建融資成數上限，行內內規限制原則上最高不得超過該建案總興建工程造價預估金額之<strong>「五成（50%）」<\/strong>。","•<strong>D 正確<\/strong>：營建週轉金（非土地或營建融資主體）在合規下得依營業循環特性，申請以循環額度方式便利資金調度。故四項皆對，選 (4)。"],"labels":["1","2","3","4"],"plain":"有關「建築貸款」A. 土地融資係指因承做房屋興建投資所辦理之購地或合建保證金貸款B. 營建融資係指興建房屋貸款C. 營建融資原則上不得超過預估建築物興建造價之五成D. 營建週轉金得以循環額度方式辦理。上述正確者共有幾項？1234 項•A、B、C、D 四項敘述皆完全正確：•A與 B 為建築貸款（土建融）之標準定義。•C 正確：營建融資成數上限，行內內規限制原則上最高不得超過該建案總興建工程造價預估金額之「五成（50%）」。•D 正確：營建週轉金（非土地或營建融資主體）在合規下得依營業循環特性，申請以循環額度方式便利資金調度。故四項皆對，選 (4)。"},{"year":"112","no":45,"part":"第二部分","score":"1.5","ans":"2","topic":"B","stem":"有關本行「個人戶地上權建築物貸款」業務，何者為非？","opts":["本行土建融轉分戶貸款，不限擔保品座落區域","重估案件得由營業單位辦理鑑價","應為政府機關核准屬可分割移轉之地上權建築物，貸放成數最高七成","授信到期日以不超過地上權存續期間屆滿前 10 年之日為原則"],"ana":["•(2) <strong>敘述錯誤<\/strong>：地上權建築物因涉及無基地所有權及剩餘存續年期價值折損問題，鑑價與重估程序極為嚴格，其<strong>重估或初估案件一律「不得由營業單位自行辦理鑑價」，應委託適格之鑑價機構或依總行審查部之專業鑑價標準辦理<\/strong>。"],"labels":["1","2","3","4"],"plain":"有關本行「個人戶地上權建築物貸款」業務，何者為非？本行土建融轉分戶貸款，不限擔保品座落區域重估案件得由營業單位辦理鑑價應為政府機關核准屬可分割移轉之地上權建築物，貸放成數最高七成授信到期日以不超過地上權存續期間屆滿前 10 年之日為原則•(2) 敘述錯誤：地上權建築物因涉及無基地所有權及剩餘存續年期價值折損問題，鑑價與重估程序極為嚴格，其重估或初估案件一律「不得由營業單位自行辦理鑑價」，應委託適格之鑑價機構或依總行審查部之專業鑑價標準辦理。"},{"year":"113","no":34,"part":"第二部分","score":"1.5","ans":"2","topic":"B","stem":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者錯誤？","opts":["重建融資額度原則上應一次全數動撥至信託專戶","採借款人互為連保方式承作","須經全體土地及合法建物所有權人同意","營建融資及其他營建費用融資成數最高十成"],"ana":["•(2) <strong>錯誤<\/strong>： 少「每 3 個月」（而非每 2 個月）<\/strong>定期更新與填報「專案融資/工程入帳追蹤表」並追蹤工程進度。"],"labels":["1","2","3","4"],"plain":"下列關於建築貸款之敘述何者有誤？建築貸款包含興建房屋貸款及營建週轉金基地面積超過 200 坪且 11 層樓以上者，貸款期限依實際需要及興建計畫個別核定，惟最長以不超過 6 年為原則應於企金 e-Loan 系統授信申請書勾選應追蹤事項之「計畫執行進度追蹤表」自貸放日起至少每 2 個月確實追蹤工程進度•(4) 敘述錯誤：依據本行經常性融資貸後風險控管規範，營業單位承作營造業或土建融之授信案件時，自貸放日起應至少「每 3 個月」（而非每 2 個月）定期更新與填報「專案融資/工程入帳追蹤表」並追蹤工程進度。"},{"year":"114","no":3,"part":"第一部分","score":"2","ans":"3","topic":"B","stem":"有關工業用土地貸款資金用途為週轉金之相關規範，下列何者正確？A.應徵取工業用土地自用切結書 (週轉金用)B.資金用途不得用於購置、投資或興建不動產C.借款人為法人戶須出具「營運週轉計畫書」D.工業區閒置土地亦得辦理週轉金貸款","opts":["ABC","BCD","BC","AD"],"ana":["•<strong>B 與 C 敘述正確<\/strong>：","•<strong>B 正確<\/strong>：週轉金貸款用途限於營運流動資金，不得用於購置、投資或興建不動產等資本性支出。","•<strong>C 正確<\/strong>：法人戶申貸週轉金應出具「營運週轉計畫書」。","•A 錯誤：工業用土地貸款屬週轉金性質者，不需徵取自用切結書。","•D 錯誤：依中央銀行規定，工業區閒置土地有嚴格之融資成數限制，且未按興建開發計畫時，不得任意以營運週轉金名義辦理放款。故正確為 B、C，選 (3)。---"],"labels":["1","2","3","4"],"plain":"有關工業用土地貸款資金用途為週轉金之相關規範，下列何者正確？A.應徵取工業用土地自用切結書 (週轉金用)B.資金用途不得用於購置、投資或興建不動產C.借款人為法人戶須出具「營運週轉計畫書」D.工業區閒置土地亦得辦理週轉金貸款ABCBCDBCAD•B 與 C 敘述正確：•B 正確：週轉金貸款用途限於營運流動資金，不得用於購置、投資或興建不動產等資本性支出。•C 正確：法人戶申貸週轉金應出具「營運週轉計畫書」。•A 錯誤：工業用土地貸款屬週轉金性質者，不需徵取自用切結書。•D 錯誤：依中央銀行規定，工業區閒置土地有嚴格之融資成數限制，且未按興建開發計畫時，不得任意以營運週轉金名義辦理放款。故正確為 B、C，選 (3)。---"}],"plain":"適用細則：授信篇第9章（不動產擔保）、第13章（經常性融資通則）、第46章（專案融資）及建築融資相關要點。建築貸款範圍：含興建房屋貸款及營建週轉金；基地面積超過 200 坪且 11 層樓以上者，期限個別核定、最長以 6 年為原則。工程進度追蹤：承作營造業或土建融，自貸放日起至少每 3 個月更新填報「專案融資／工程入帳追蹤表」並追蹤工程進度（非每 2 個月）。工業用土地：週轉金用途不得用於購置、投資或興建不動產；法人戶須出具「營運週轉計畫書」；工業區閒置土地有嚴格融資限制。都更危老（危險及老舊建築物加速重建貸款，自力更新型態）：重建融資成數、自備款、擔保與撥款節點等為常考細節。建案基地檢核表：檢核項目含嫌惡設施、使用分區等（基地形狀非必列項目，依年度題目為準）。【法金處 2025-2026】兩度重申：辦理建築業者申貸週轉金、及建築貸款列金控檢查缺失之注意事項（資金流向控管、避免以週轉金名義變相供土地款）。【2026.07 專案融資】承攬大型／高技術門檻採購案之借戶，辦理專案履約保證或週轉金貸款時，應審慎評估其資力、背景與履約能力；知悉負面消息應即通報授信審核處並填危機處理報告。【授信審核處 2025.10】工程週轉金循環額度「累計動用借款金額上限」管控，須執行端末 6409 交易並每日檢視 LN6409 日報表。"},{"letter":"C","title":"不動產抵押貸款與央行管控","meta":"本主題共 **14 題**：109-10、109-22、109-45、110-01、110-02、111-08、111-13、112-39、113-12、113-32、114-05、114-16、114-50、114-54","note":"<p><strong>適用細則<\/strong>：授信篇第53章（消費者貸款）、中央銀行對金融機構辦理不動產抵押貸款業務 ","2","3","4"],"plain":"公司法人(借戶)購置住宅供該公司營業使用者，得排除中央銀行「公司法人購置住宅貸款」管控之規定，下列敘述何者錯誤？營業單位實地查核該建物確實供借戶公司營業用，如有出租或部分出租他人亦可適用確認借戶公司已於該建物辦理設立登記徵取建物所在地之地方政府法令規定該建物可供營業使用之證明徵取「切結書」並切結於購置建物半年內辦妥設立登記者•排除「公司法人購置住宅貸款」管制之核心要件是，該建物必須確實且「完全」供借戶公司營業自用。若有出租或部分出租他人，即不得適用排除規定。故 (1) 錯誤。"},{"year":"111","no":8,"part":"第一部分","score":"2","ans":"1","topic":"C","stem":"辦理104年8月12日(含)以後受「擔保物權連結條款」限制之抵押權，下列作業何者錯誤？ A.新購屋貸款同時申請房貸壽險保費融資擔保貸款，得設定同一順位抵押權辦理 B.向本行申請政策性貸款及一般房貸購置同一房屋，得設定同一順位抵押權辦理 C.申請新購屋貸款同時申請初始額度為0之綜合循環型樂活貸，可徵取「擔保物權連結條款同意書」辦理","opts":["A","B","C","ABC"],"ana":["•<strong>A 錯誤<\/strong>：依據「個人購屋貸款定型化契約」及金管會規範，受「擔保物權連結條款」限制之抵押權僅能擔保該特定購置住宅貸款。保費融資不屬於購置住宅本身之債務，<strong>不能在未獲擔保物提供人書面同意下設定同一順位抵押權辦理（實務上保費融資多另設定第二順位抵押權）<\/strong>。故選 (1)。"],"labels":["1","2","3","4"],"plain":"辦理104年8月12日(含)以後受「擔保物權連結條款」限制之抵押權，下列作業何者錯誤？ A.新購屋貸款同時申請房貸壽險保費融資擔保貸款，得設定同一順位抵押權辦理 B.向本行申請政策性貸款及一般房貸購置同一房屋，得設定同一順位抵押權辦理 C.申請新購屋貸款同時申請初始額度為0之綜合循環型樂活貸，可徵取「擔保物權連結條款同意書」辦理ABCABC•A 錯誤：依據「個人購屋貸款定型化契約」及金管會規範，受「擔保物權連結條款」限制之抵押權僅能擔保該特定購置住宅貸款。保費融資不屬於購置住宅本身之債務，不能在未獲擔保物提供人書面同意下設定同一順位抵押權辦理（實務上保費融資多另設定第二順位抵押權）。故選 (1)。"},{"year":"111","no":13,"part":"第一部分","score":"2","ans":"3","topic":"C","stem":"對於公司法人提供本次購置住宅申請貸款，或以其他房地辦理新貸或以既有房貸案辦理增貸申請購置住宅貸款之相關「無另以修繕、周轉金或其他貸款名目，向本行或其它金融機構額外增加貸款」查核作業，應於授信申請時檢視查核對象自買賣契約簽訂日期往前計算","opts":["1個月","2個月","3個月","6個月 至授信申請日聯徵中心借款情形"],"ana":["•依中央銀行及本行對不動產抵押貸款之防弊查核規範：","•為了防止借戶以週轉金等其他名義融資，變相用於支付買屋自備款，經辦在受理授信申請時，應確實回查借戶自買賣契約簽訂日<strong>「往前計算 3 個月」<\/strong>（3）至授信申請日止之聯徵中心信用資訊，以確認其有無於其他金融機構異常新增無擔保借款。故選 (3)。"],"labels":["1","2","3","4"],"plain":"對於公司法人提供本次購置住宅申請貸款，或以其他房地辦理新貸或以既有房貸案辦理增貸申請購置住宅貸款之相關「無另以修繕、周轉金或其他貸款名目，向本行或其它金融機構額外增加貸款」查核作業，應於授信申請時檢視查核對象自買賣契約簽訂日期往前計算1個月2個月3個月6個月 至授信申請日聯徵中心借款情形•依中央銀行及本行對不動產抵押貸款之防弊查核規範：•為了防止借戶以週轉金等其他名義融資，變相用於支付買屋自備款，經辦在受理授信申請時，應確實回查借戶自買賣契約簽訂日「往前計算 3 個月」（3）至授信申請日止之聯徵中心信用資訊，以確認其有無於其他金融機構異常新增無擔保借款。故選 (3)。"},{"year":"112","no":39,"part":"第二部分","score":"1.5","ans":"3","topic":"C","stem":"依「中央銀行對金融機構辦理不動產抵押貸款業務規定」，受理公司法人購置住宅貸款，下列敘述何者為非？","opts":["不得有寬限期","貸款額度最高不得超過鑑價或買賣金額較低者之四成","借戶得以修繕或其他貸款名目另向金融機構借款取得 topic":"C","stem":"營業單位辦理「中央銀行對金融機構辦理不動產抵押貸款業務」，承作公司法人購買建物權狀含有「住」字樣之住宅貸款，其貸款條件限制：A.寬限期最長一年B.貸款額度最高不得超過住宅(含基地)鑑價或買賣金額較低者之三成C.除前款貸款額度外，不得另以修繕、周轉金或其他貸款名目，額外增加貸款金額D.所有住宅貸款案件應一律送區域中心或總行授信審核處審核。上述正確者共幾項？","opts":["1","2","3","4"],"ana":["•經檢視，正確之敘述共有 <strong>2 項<\/strong>（即 B、C 正確）：","•<strong>A 錯誤<\/strong>：依中央銀行對不動產抵押貸款業務規定，公司法人購置住宅貸款<strong>「不得有寬限期」<\/strong>。","•<strong>B 正確<\/strong>：成數最高不得超過鑑價或買賣金額較低者之 <strong>3 成（三成）<\/strong>。","•<strong>C 正確<\/strong>：為防範變相變通炒房，不得另以修繕、週轉金等其他貸款名目額外增加融資金額。","•<strong>D 錯誤<\/strong>：並非所有此類住宅放款案件都一律強制送至總行，特定範圍內仍可依合規權限進行分級審查。"],"labels":["1","2","3","4"],"plain":"營業單位辦理「中央銀行對金融機構辦理不動產抵押貸款業務」，承作公司法人購買建物權狀含有「住」字樣之住宅貸款，其貸款條件限制：A.寬限期最長一年B.貸款額度最高不得超過住宅(含基地)鑑價或買賣金額較低者之三成C.除前款貸款額度外，不得另以修繕、周轉金或其他貸款名目，額外增加貸款金額D.所有住宅貸款案件應一律送區域中心或總行授信審核處審核。上述正確者共幾項？1234•經檢視，正確之敘述共有 2 項（即 B、C 正確）：•A 錯誤：依中央銀行對不動產抵押貸款業務規定，公司法人購置住宅貸款「不得有寬限期」。•B 正確：成數最高不得超過鑑價或買賣金額較低者之 3 成（三成）。•C 正確：為防範變相變通炒房，不得另以修繕、週轉金等其他貸款名目額外增加融資金額。•D 錯誤：並非所有此類住宅放款案件都一律強制送至總行，特定範圍內仍可依合規權限進行分級審查。"},{"year":"114","no":16,"part":"第一部分","score":"2","ans":"2","topic":"C","stem":"辦理購置「央行管控規定」不動產，下列何者為非？","opts":["財政部「青年安心成家購屋優惠貸款」不受自然人第 1 戶、第 2 戶購屋貸款限制","借款人辦理購置住宅貸款，金融機構可以周轉金名義承作","自然人名下無房貸，但有持分房屋者，申辦購屋貸款應受自然人第 1 戶購屋貸款限制，惟該持分房屋係繼承取得者得不受限","本規範「房貸戶數」依擔保品數量認定"],"ana":["•(2) <strong>敘述錯誤<\/strong>：為貫徹中央銀行信用管制措施，防堵投機炒房，<strong>行方辦理受限房貸或購置住宅貸款時，絕對「不得」以一般「週轉金」名義承作或撥款，以防資金變相流入不動產市場<\/strong>。"],"labels":["1","2","3","4"],"plain":"辦理購置「央行管控規定」不動產，下列何者為非？財政部「青年安心成家購屋優惠貸款」不受自然人第 1 戶、第 2 戶購屋貸款限制借款人辦理購置住宅貸款，金融機構可以周轉金名義承作自然人名下無房貸，但有持分房屋者，申辦購屋貸款應受自然人第 1 戶購屋貸款限制，惟該持分房屋係繼承取得者得不受限本規範「房貸戶數」依擔保品數量認定•(2) 敘述錯誤：為貫徹中央銀行信用管制措施，防堵投機炒房，行方辦理受限房貸或購置住宅貸款時，絕對「不得」以一般「週轉金」名義承作或撥款，以防資金變相流入不動產市場。"},{"year":"114","no":50,"part":"第二部分","score":"1.5","ans":"3","topic":"C","stem":"辦理購置「央行管控規定」不動產之「自然人第 3 戶含以上購屋貸款」，何者為非？","opts":["向聯徵辦理歸戶查詢，自然人名下已有 2 戶以上房屋擔保放款，且資金用途為「1」，為購買建物權狀含「住」字樣之非高價住宅抵押貸款","應分別於授信申請、撥貸日及貸放後三個月，查核有無於本行或其他金融機構增加貸款","查核對象僅限借款人","不得申請寬限期"],"ana":["•(3) <strong>敘述錯誤<\/strong>：為杜絕人頭戶與規避信用管制，對於額外融資之查核，其<strong>聯徵與授信歸戶之查核對象「包含：借款人、保證人及擔保物提供人」<\/strong>，絕非僅限借款人一人。故選 (3)。---"],"labels":["1","2","3","4"],"plain":"辦理購置「央行管控規定」不動產之「自然人第 3 戶含以上購屋貸款」，何者為非？向聯徵辦理歸戶查詢，自然人名下已有 2 戶以上房屋擔保放款，且資金用途為「1」，為購買建物權狀含「住」字樣之非高價住宅抵押貸款應分別於授信申請、撥貸日及貸放後三個月，查核有無於本行或其他金融機構增加貸款查核對象僅限借款人不得申請寬限期•(3) 敘述錯誤：為杜絕人頭戶與規避信用管制，對於額外融資之查核，其聯徵與授信歸戶之查核對象「包含：借款人、保證人及擔保物提供人」，絕非僅限借款人一人。故選 (3)。---"},{"year":"114","no":54,"part":"第二部分","score":"1.5","ans":"4","topic":"C","stem":"有關與「央行管控規定」之消金案件，下列敘述何者為非？","opts":["不得承作「樂活貸循環型房貸」","不得承作「加值型信貸專案，惟排除「自然人第 1 戶購屋貸款(名下已有房屋)」","授信申請時須向借款人徵取「財產查詢清單」及查詢聯徵 B28 及 B33","撥貸當日毋須查詢聯徵 B28 及 B33"],"ana":["•(4) <strong>敘述錯誤<\/strong>：為嚴格防範資金於撥款前夕突發性借貸，經辦於 <strong>「撥貸當日」，「仍然必須確實執行聯徵 B28 及 B33（或 B53 等）信用資訊回查」<\/strong>，以確保撥貸前成數及無擔保歸戶均未超逾限制。故 (4) 稱毋須查詢為重大內控缺失，選 (4)。---"],"labels":["1","2","3","4"],"plain":"有關與「央行管控規定」之消金案件，下列敘述何者為非？不得承作「樂活貸循環型房貸」不得承作「加值型信貸專案，惟排除「自然人第 1 戶購屋貸款(名下已有房屋)」授信申請時須向借款人徵取「財產查詢清單」及查詢聯徵 B28 及 B33撥貸當日毋須查詢聯徵 B28 及 B33•(4) 敘述錯誤：為嚴格防範資金於撥款前夕突發性借貸，經辦於 「撥貸當日」，「仍然必須確實執行聯徵 B28 及 B33（或 B53 等）信用資訊回查」，以確保撥貸前成數及無擔保歸戶均未超逾限制。故 (4) 稱毋須查詢為重大內控缺失，選 (4)。---"}],"plain":"適用細則：授信篇第53章（消費者貸款）、中央銀行對金融機構辦理不動產抵押貸款業務規定（央行選擇性信用管制）。公司法人購置住宅貸款：最高不得超過鑑價或買賣金額孰低者之 3 成、無寬限期；不得另以修繕／週轉金等名目額外增貸；供該公司自身營業使用者得排除管控（須查證）。自然人購屋管控（重點成數，115.3.20 修正後）：高價住宅 3 成無寬限期、名下有房第 1 戶購屋無寬限期、第 2 戶 6 成無寬限期、第 3 戶以上 3 成無寬限期。購地貸款：5 成、保留 1 成動工款，須檢附具體興建計畫並切結一定期間內動工。央行管控案件須於消金 e-Loan 依案件類型勾選、貸放後即時填報並按月報送央行。⚠️ 重大異動（溯自 115.3.20 生效，中央銀行台央業字第1150011106號）：- 自然人「第 2 戶」購屋貸款成數：5 成 → 6 成（無寬限期）。其餘（高價住宅、第 1 戶、第 3 戶以上、購地貸款）維持不變。- 消金 e-Loan 已擴增央行管控案件類型共 20 項，須確實勾選並落實檢核。&gt;影響：凡早期考題以「自然人第 2 戶最高 5 成」為正解者，現行應改為 6 成；作答時請以 115.3.20 後版本為準（本主題 110、114 各年不動產管控題請對照最新成數）。"},{"letter":"D","title":"授信審查權限・分層負責・額度控管","meta":"本主題共 **26 題**：109-06、109-07、109-39、109-41、110-36、110-38、111-06、111-22、111-37、111-41、111-42、112-05、112-08、112-20、112-42、112-54、112-57、112-59、113-02、113-04、113-23、113-30、113-44、114-08、114-35、114-39","note":"<p><strong>適用細則<\/strong>：授信篇第3章（授信申請）、總行及區域中心各級人員授信審查權限準則、國內營業單位經理權限授信要點。<\/p><ul><li><strong>併計授信額度計算審查權限<\/strong>：同一人／同一關係人／同一關係企業之授信應合併計算以認定核定層級。<\/li><li><strong>經理權限適用限制<\/strong>：公營事業負責人變更等特定條件變更案件，<strong>不得<\/strong>逕由營業單位經理核定；須報上級。<\/li><li><strong>額度控管<\/strong>：授信最高額度控管、單一分行單一客戶授信限額（逾單一分行授信總額一定比率須控管）、額度核定通知書之確認程序為常考。<\/li><\/ul>","change":"<p style=\"color:var(--ink-2);font-size:13.5px\"><span style=\"color:var(--seal)\">⚠️<\/span> <strong>異動（國內營業單位經理權限授信要點，2026.2.2 起實施）<\/strong>：<\/p><p style=\"color:var(--ink-2);font-size:13.5px\">- 新增：<strong>初任經理人自到任日起半年內<\/strong>，對借戶總放款「支出所得比（DBR）逾 70%」之房貸案件，及記帳士／代書／民間小額融資公司等<strong>轉介<\/strong>之法人及行號案件，<strong>應申請總行或區域中心核定<\/strong>。<\/p><p style=\"color:var(--ink-2);font-size:13.5px\">- 新增：法人及行號與個人新臺幣授信增訂「自行特定金錢信託受益權質借外幣」得於擔保授信權限額度內承作。<\/p><p style=\"color:var(--ink-2);font-size:13.5px\">- 修正消金／法金商品<strong>停權標準<\/strong>（現任經理權限授信逾放比率逾 2% 且逾放金額分 A／B／C 組門檻）。<\/p><p>&gt;<\/p><p style=\"color:var(--ink-2);font-size:13.5px\">影響：權限相關舊題若涉及初任經理房貸／轉介案之核定層級、或受益權質借外幣可否適用經理權限者，請以 2026.2.2 新版為準。<\/p>","questions":[{"year":"109","no":6,"part":"第一部分","score":"2","ans":"3","topic":"D","stem":"有關「總行及區域中心各級人員授信審查權限準則」，應併計授信額度計算審查權限之敘述，下列何者為非？","opts":["法人授信戶應併計負責人本人及其配偶、未成年子女及負責人本人或其配偶擔任負責人之企業","不適用經理權限之擔保品塗銷案件應受併計額度之限制","借戶申請非共同借款授信案件，不須併計另案其擔任共同借款人之授信額度","以經理權限核准之授信案件，倘擬以超過經理權限規定之利率計收而申請總行/區域中心辦理利率條件變更，不須受併計額度之限制"],"ana":["•為了防範信用曝險集中，計算審查權限時，同一歸戶之額度應予「併計」。","•(3) 敘述錯誤：借戶申請非共同借款之授信案件時，<strong>仍然必須併計其於另案擔任「共同借款人」或「連帶債務人」之授信額度<\/strong>，以覈實反映其實際債務曝險狀況。"],"labels":["1","2","3","4"],"plain":"有關「總行及區域中心各級人員授信審查權限準則」，應併計授信額度計算審查權限之敘述，下列何者為非？法人授信戶應併計負責人本人及其配偶、未成年子女及負責人本人或其配偶擔任負責人之企業不適用經理權限之擔保品塗銷案件應受併計額度之限制借戶申請非共同借款授信案件，不須併計另案其擔任共同借款人之授信額度以經理權限核准之授信案件，倘擬以超過經理權限規定之利率計收而申請總行/區域中心辦理利率條件變更，不須受併計額度之限制•為了防範信用曝險集中，計算審查權限時，同一歸戶之額度應予「併計」。•(3) 敘述錯誤：借戶申請非共同借款之授信案件時，仍然必須併計其於另案擔任「共同借款人」或「連帶債務人」之授信額度，以覈實反映其實際債務曝險狀況。"},{"year":"109","no":7,"part":"第一部分","score":"2","ans":"3","topic":"D","stem":"依據「國內營業單位經理權限授信要點」，倘借戶為公司戶時，下列何種情形不得適用經理權限？","opts":["負責人經本行「客戶風險評分交易」(A194)評分之風險等級屬高風險者","負責人屬本行觀察名單","負責人之配偶最近六個月內存款往來有不良紀錄","保證人財產受強制執行 or 假扣押"],"ana":["•經理權限（分行放行權限）有嚴格的排除條件。若借戶本身、負責人、實際經營者或保證人有票債信不良、涉及訴訟（如財產受強制執行或假扣押）、洗錢防制屬高風險等情事，一律排除經理權限，須送區域中心或總行審核。","•(3) <strong>不屬於排除經理權限的條件<\/strong>：配偶若「未參加作保」，其存款往來狀況或個人信用不直接影響該公司戶適用經理權限的資格。"],"labels":["1","2","3","4"],"plain":"依據「國內營業單位經理權限授信要點」，倘借戶為公司戶時，下列何種情形不得適用經理權限？負責人經本行「客戶風險評分交易」(A194)評分之風險等級屬高風險者負責人屬本行觀察名單負責人之配偶最近六個月內存款往來有不良紀錄保證人財產受強制執行 or 假扣押•經理權限（分行放行權限）有嚴格的排除條件。若借戶本身、負責人、實際經營者或保證人有票債信不良、涉及訴訟（如財產受強制執行或假扣押）、洗錢防制屬高風險等情事，一律排除經理權限，須送區域中心或總行審核。•(3) 不屬於排除經理權限的條件：配偶若「未參加作保」，其存款往來狀況或個人信用不直接影響該公司戶適用經理權限的資格。"},{"year":"109","no":39,"part":"第二部分","score":"1.5","ans":"2","topic":"D","stem":"受理未成年人擔任借款人之案件，下列何者錯誤？","opts":["可申貸「購置不動產貸款」","得適用營業單位經理權限辦理","應確認已符合民法1088條「為子女之利益」意旨","貸款成數以所購置不動產鑑估值之5成為上限"],"ana":["•(2) 錯誤：未成年人屬於限制行為能力人或無行為能力人（依民法規定），其舉債行為涉及極高法律風險與道德爭議。因此，<strong>受理未成年人為借款人之授信案件，不論金額大小與擔保品是否足額，一律「排除營業單位經理權限」<\/strong>，必須層報總行或區域中心核准。"],"labels":["1","2","3","4"],"plain":"受理未成年人擔任借款人之案件，下列何者錯誤？可申貸「購置不動產貸款」得適用營業單位經理權限辦理應確認已符合民法1088條「為子女之利益」意旨貸款成數以所購置不動產鑑估值之5成為上限•(2) 錯誤：未成年人屬於限制行為能力人或無行為能力人（依民法規定），其舉債行為涉及極高法律風險與道德爭議。因此，受理未成年人為借款人之授信案件，不論金額大小與擔保品是否足額，一律「排除營業單位經理權限」，必須層報總行或區域中心核准。"},{"year":"109","no":41,"part":"第二部分","score":"1.5","ans":"4","topic":"D","stem":"辦理法人戶授信時，營業單位應至經濟部商工登記資料公示查詢系統查詢其董、監事資料作業，下列相關規範何者有誤？","opts":["須於授信申請時及撥貸當日辦理查詢","徵取十足本行活期存款為擔保且設定質權之授信案件，於撥貸時得免辦理查詢","倘保證人已卸任授信戶之董事、監察人，仍願續任保證人者，即請其簽立「續任保證人同意書」後，逕依授信條件動撥","倘保證人卸任董、監事，不願續任保證人，須向其他保證人、擔保物提供人或其他就債之履行有利害關係之第三人徵取「代位清償人同意書」"],"ana":["•(4) 錯誤：當原保證人因卸任董監事而不願繼續擔任保證人時，營業單位應依據「授信條件變更」程序，重新評估該授信戶缺少該名保證人後之信用風險與保證實益。若需免除其保證責任，應申請條件變更，或要求借戶另提「本行認可之適格新連帶保證人」辦理對保換約，<strong>並非徵提所謂的「代位清償人同意書」<\/strong>（此書在行內授信法規中並非處理董監卸任保證責任之標準書件）。"],"labels":["1","2","3","4"],"plain":"辦理法人戶授信時，營業單位應至經濟部商工登記資料公示查詢系統查詢其董、監事資料作業，下列相關規範何者有誤？須於授信申請時及撥貸當日辦理查詢徵取十足本行活期存款為擔保且設定質權之授信案件，於撥貸時得免辦理查詢倘保證人已卸任授信戶之董事、監察人，仍願續任保證人者，即請其簽立「續任保證人同意書」後，逕依授信條件動撥倘保證人卸任董、監事，不願續任保證人，須向其他保證人、擔保物提供人或其他就債之履行有利害關係之第三人徵取「代位清償人同意書」•(4) 錯誤：當原保證人因卸任董監事而不願繼續擔任保證人時，營業單位應依據「授信條件變更」程序，重新評估該授信戶缺少該名保證人後之信用風險與保證實益。若需免除其保證責任，應申請條件變更，或要求借戶另提「本行認可之適格新連帶保證人」辦理對保換約，並非徵提所謂的「代位清償人同意書」（此書在行內授信法規中並非處理董監卸任保證責任之標準書件）。"},{"year":"1 來(含 66 帳號結清銷戶者)及共同債務者，得逕行辦理授信申請"],"ana":["•(1) <strong>敘述錯誤<\/strong>：為免多頭授信失控，同一個客戶原則上僅能在本行「一家」分行往來。若確有因業務需要需跨行申貸或在不同營業單位並存額度者，<strong>「必須專案層報總行或區域中心核准」，營業單位經理無權自行以經理權限核准同意<\/strong>。"],"labels":["1","2","3","4"],"plain":"借款人初次授信申請時，應辦理「顧客帳務資料查詢交易（9703）」及「保證資料查詢（A220）」交易，進行授信聯行查詢，下列敘述何者有誤？同一借款人如擬於不同營業單位往來，應先經原往來分行同意後，始得以經理權限進行申請企業授信戶查詢對象為借款人、負責人、保證人個人授信戶查詢對象為借款人、保證人如查詢對象在聯行無授信往來(含 66 帳號結清銷戶者)及共同債務者，得逕行辦理授信申請•(1) 敘述錯誤：為免多頭授信失控，同一個客戶原則上僅能在本行「一家」分行往來。若確有因業務需要需跨行申貸或在不同營業單位並存額度者，「必須專案層報總行或區域中心核准」，營業單位經理無權自行以經理權限核准同意。"},{"year":"114","no":39,"part":"第二部分","score":"1.5","ans":"2","topic":"D","stem":"有關不動產抵押權設定，下列敘述何者有誤？","opts":["個人消費性貸款抵押權設定之權利種類，應由擔保物提供人自行勾選採「最高限額」或「普通」抵押權設定","受理「普通抵押權」設定申貸者，一律申請總行核准後辦理","屬重估案件，其設定限額、貸放限額及設定年限(或擔保債權確定期日)均未變更，授權營業單位經理逕行核定","設定金額原則上以放款值加二成或提高至鑑價金額範圍內辦理"],"ana":["•(2) <strong>敘述錯誤<\/strong>：受理「普通抵押權」設定時，依本行授信審查權限規定，並非全部「一律」必須報送最頂層之總行（HQ）核准，<strong>部分案件得於「授信審核處或授權之區域中心」權限層級核決<\/strong>。故 (2) 稱一律送總行為誤。---"],"labels":["1","2","3","4"],"plain":"有關不動產抵押權設定，下列敘述何者有誤？個人消費性貸款抵押權設定之權利種類，應由擔保物提供人自行勾選採「最高限額」或「普通」抵押權設定受理「普通抵押權」設定申貸者，一律申請總行核准後辦理屬重估案件，其設定限額、貸放限額及設定年限(或擔保債權確定期日)均未變更，授權營業單位經理逕行核定設定金額原則上以放款值加二成或提高至鑑價金額範圍內辦理•(2) 敘述錯誤：受理「普通抵押權」設定時，依本行授信審查權限規定，並非全部「一律」必須報送最頂層之總行（HQ）核准，部分案件得於「授信審核處或授權之區域中心」權限層級核決。故 (2) 稱一律送總行為誤。---"}],"plain":"適用細則：授信篇第3章（授信申請）、總行及區域中心各級人員授信審查權限準則、國內營業單位經理權限授信要點。併計授信額度計算審查權限：同一人／同一關係人／同一關係企業之授信應合併計算以認定核定層級。經理權限適用限制：公營事業負責人變更等特定條件變更案件，不得逕由營業單位經理核定；須報上級。額度控管：授信最高額度控管、單一分行單一客戶授信限額（逾單一分行授信總額一定比率須控管）、額度核定通知書之確認程序為常考。⚠️ 異動（國內營業單位經理權限授信要點，2026.2.2 起實施）：- 新增：初任經理人自到任日起半年內，對借戶總放款「支出所得比（DBR）逾 70%」之房貸案件，及記帳士／代書／民間小額融資公司等轉介之法人及行號案件，應申請總行或區域中心核定。- 新增：法人及行號與個人新臺幣授信增訂「自行特定金錢信託受益權質借外幣」得於擔保授信權限額度內承作。- 修正消金／法金商品停權標準（現任經理權限授信逾放比率逾 2% 且逾放金額分 A／B／C 組門檻）。&gt;影響：權限相關舊題若涉及初任經理房貸／轉介案之核定層級、或受益權質借外幣可否適用經理權限者，請以 2026.2.2 新版為準。"},{"letter":"E","title":"利害關係人授信・銀行法72-2・授信限額","meta":"本主題共 **16 題**：109-08、109-58、110-25、110-41、110-42、111-16、111-17、111-45、112-43、112-44、113-22、113-57、114-14、114-41、114-47、114-49","note":"<p><strong>適用細則<\/strong>：授信篇第1章第7節（授信總餘額之限制）、第8節（行員及關係人授信之限制）、銀行法第32、33、33-3、72-2條。<\/p><ul><li><strong>利害關係人授信<\/strong>：擔保授信須填「利害關係人與非利害關係人授信條件比較表」，條件不得優於其他同類授信對象，並經董事會三分之二以上出席、四分之三以上同意等程序。<\/li><li><strong>銀行法 72-2<\/strong>：商業銀行辦理住宅建築及企業建築放款總額，不得超過放款時所收存款總餘額及金融債券發售額之和的 <strong>30%<\/strong>；有得不計入之例外（如都更、社會住宅等取得主管機關核定者）。<\/li><li><strong>授信限額／歸戶<\/strong>：同一人、同一關係人、同一關係企業之授信限額，須依銀行法第 33-3 條及主管機關規定辦理。<\/li><\/ul>","change":"","questions":[{"year":"109","no":8,"part":"第一部分","score":"2","ans":"4","topic":"E","stem":"辦理利害關係人擔保授信案件申請時，應填寫「利害關係人與非利害關係人授信條件比較表」，前述所稱授信條件不包括： A.授信金額 B.授信期限 C.擔保品及其估價 D.保證人資歷","opts":["AB","BC","BD","AD"],"ana":["依據銀行法第 33 條及行內授信通則，所稱「授信條件」係指：<strong>「利率、擔保品及其估價、保證人之有無、授信期限、本息償還方式」<\/strong>。授信條件並不包含「授信金額大小」（A）與「保證人個人資歷深淺」（D），故答案選 (4) AD。"],"labels":["1","2","3","4"],"plain":"辦理利害關係人擔保授信案件申請時，應填寫「利害關係人與非利害關係人授信條件比較表」，前述所稱授信條件不包括： A.授信金額 B.授信期限 C.擔保品及其估價 D.保證人資歷ABBCBDAD依據銀行法第 33 條及行內授信通則，所稱「授信條件」係指：「利率、擔保品及其估價、保證人之有無、授信期限、本息償還方式」。授信條件並不包含「授信金額大小」（A）與「保證人個人資歷深淺」（D），故答案選 (4) AD。"},{"year":"109","no":58,"part":"第二部分","score":"1.5","ans":"2","topic":"E","stem":"辦理個人授信戶徵信工作之相關規範，下列何者正確？","opts":["於金融機構借款已知曾有償還異常紀錄者，惟因已逾聯徵資訊揭露期限而顯示為正常，則無須於「綜合意見」欄說明","金融機構總授信金額達新臺幣2,000萬元者，應徵提報稅資料","個人授信案件一律徵取同一關係人資料表","徵信報告屆期改編時，應重新徵取「授信業務蒐集個人資料應告知事項」"],"ana":["•(2) <strong>正確<\/strong>：依據中華民國銀行公會徵信準則及行內規範，個人借款戶於整體金融機構之<strong>總授信金額達新臺幣 2,000 萬元（含）以上<\/strong>者，徵信時<strong>應強制徵提最新年度之綜合所得稅報稅資料（或各類所得清單）<\/strong>以核對年度收支。","•(1) 錯誤：即使已逾聯徵揭露期限，若已知有異常，仍應覈實揭露於綜合意見欄。 (3) 錯誤：個人戶非公司集團，無需徵取集團/同一關係企業資料表。"],"labels":["1","2","3","4"],"plain":"辦理個人授信戶徵信工作之相關規範，下列何者正確？於金融機構借款已知曾有償還異常紀錄者，惟因已逾聯徵資訊揭露期限而顯示為正常，則無須於「綜合意見」欄說明金融機構總授信金額達新臺幣2,000萬元者，應徵提報稅資料個人授信案件一律徵取同一關係人資料表徵信報告屆期改編時，應重新徵取「授信業務蒐集個人資料應告知事項」•(2) 正確：依據中華民國銀行公會徵信準則及行內規範，個人借款戶於整體金融機構之總授信金額達新臺幣 2,000 萬元（含）以上者，徵信時應強制徵提最新年度之綜合所得稅報稅資料（或各類所得清單）以核對年度收支。•(1) 錯誤：即使已逾聯徵揭露期限，若已知有異常，仍應覈實揭露於綜合意見欄。 (3) 錯誤：個人戶非公司集團，無需徵取集團/同一關係企業資料表。"},{"year":"110","no":25,"part":"第二部分","score":"1.5","ans":"1","topic":"E","stem":"有關「單一分行內單一客戶授信限額管控」規範，係指單一客戶授信總額逾單一分行授信總額之多少比例時，應將超逾限額部分拆分予聯行記帳？","opts":["45%","35%","25%","15%"],"ana":["•為了防範單一分行曝險過度集中，當單一客戶在單一分行的授信餘額超過該分行總授信餘額之 <strong>「45%」<\/strong> 時，應依法將超限部分拆分予聯行（分行）記帳。---"],"labels":["1","2","3","4"],"plain":"有關「單一分行內單一客戶授信限額管控」規範，係指單一客戶授信總額逾單一分行授信總額之多少比例時，應將超逾限額部分拆分予聯行記帳？45%35%25%15%•為了防範單一分行曝險過度集中，當單一客戶在單一分行的授信餘額超過該分行總授信餘額之 「45%」 時，應依法將超限部分拆分予聯行（分行）記帳。---"},{"year":"110","no":41,"part":"第二部分","score":"1.5","ans":"4","topic":"E","stem":"有關「貸款衍生人身保險保費融資貸款-信用貸款」之規定，下列敘述何者錯誤？","opts":["借款人、要保人與被保險人須為同一人","不動產擔保借款人限為本國國民","營業單位經理權限最高額度新臺幣70萬元","設定第二順位抵押權作副擔保者，貸款期限最長10年"],"ana":["•(4) 錯誤：保費融資信用貸款，若有設定第二順位抵押權作為副擔保（房貸連結型保費融資），其<strong>最長融資天期可拉長至「20年」<\/strong>（非 10 年），以符合攤還需求。"],"labels":["1","2","3","4"],"plain":"有關「貸款衍生人身保險保費融資貸款-信用貸款」之規定，下列敘述何者錯誤？借款人、要保人與被保險人須為同一人不動產擔保借款人限為本國國民營業單位經理權限最高額度新臺幣70萬元設定第二順位抵押權作副擔保者，貸款期限最長10年•(4) 錯誤：保費融資信用貸款，若有設定第二順位抵押權作為副擔保（房貸連結型保費融資），其最長融資天期可拉長至「20年」（非 10 年），以符合攤還需求。"},{"year":"110","no":42,"part":"第二部分","score":"1.5","ans":"1","topic":"E","stem":"辦辦理房貸業務應「加強人頭戶檢視」之態樣，下列敘述何者正確？A.借戶於本行申辦房屋貸款，於寬限期到期後再核給寬限期B.多戶借戶還本繳息資金係由同一人或建築業者關係人提供繳納C.短期間各類案件來源(含代書/房仲轉介/整批房貸)之案件，客戶所留存地址、電話、Email與其他借戶之聯絡資訊相同，且無合理關係","opts":["BC","ABC","AB","AC"],"ana":["•<strong>B與 C 為正確的人頭戶與炒房檢視指標<\/strong>：","•<strong>B 正確<\/strong>：不同人房貸之還款資金，竟由同一個特定第三人或建商關係人匯入。","•<strong>C 正確<\/strong>：多筆新案所留通訊資料完全一致且地緣關係不合理者。","•A 則屬授信展期寬限期條件管理，非人頭篩選要點。故正確為 B、C，選 (1)。"],"labels":["1","2","3","4"],"plain":"辦辦理房貸業務應「加強人頭戶檢視」之態樣，下列敘述何者正確？A.借戶於本行申辦房屋貸款，於寬限期到期後再核給寬限期B.多戶借戶還本繳息資金係由同一人或建築業者關係人提供繳納C.短期間各類案件來源(含代書/房仲轉介/整批房貸)之案件，客戶所留存地址、電話、Email與其他借戶之聯絡資訊相同，且無合理關係BCABCABAC•B與 C 為正確的人頭戶與炒房檢視指標：•B 正確：不同人房貸之還款資金，竟由同一個特定第三人或建商關係人匯入。•C 正確：多筆新案所留通訊資料完全一致且地緣關係不合理者。•A 則屬授信展期寬限期條件管理，非人頭篩選要點。故正確為 B、C，選 (1)。"},{"year":"111","no":16,"part":"第一部分","score":"2","ans":"4","topic":"E","stem":"有關本行集團關係戶之管理，何者錯誤？","opts":["兩家企業之授信額度合計達新臺幣20億元者，已符合集團控管認定標準","集團關係戶新增授信時，應知會集團主責分行，並副知法人金融業務處","行員專用系統「以關係戶統編查詢TEJ集團名單」功能，可輔助判斷授信戶之集團歸屬","授信新戶需同步申請集團限額時，得先經核准授信案件後，再行核備限額"],"ana":["•(4) <strong>錯誤<\/strong>：為加強同一關係人/集團授信限額（Group Limit）控管，若授信新戶同時需要申請集團額度時，<str 錯誤？個人授信戶於本行授信總餘額在新臺幣 300 萬元(含)以下之借戶得免徵同一關係人資料表對於初次申辦授信業務之個人戶，應徵取「第一商業銀行授信業務蒐集個人資料應告知事項」對達應徵提報稅資料匡計年度收入者，其最近一年收入總額應依個人綜合所得稅結算申報書填寫以交易代號 9701 查詢授信對象是否為銀行法或金控法規範之利害關係人•(1) 錯誤：同一關係人（或集團同一關係企業）資料表，本質上僅限於「企業授信戶（法人戶、公司戶）」始須依標準徵提，個人戶除有擔任集團核心負責人或關係戶彙總外，個人借款戶「一律不適用」徵提同一關係人資料表之標準，故 (1) 隱含之限額標準不符對象規範。"},{"year":"114","no":14,"part":"第一部分","score":"2","ans":"4","topic":"E","stem":"有關本行「融資躉繳保費-信用貸款」規範，何者正確？","opts":["營業單位經理得於「個別分行授信權限額度核給範圍」個人無擔保放款權限，以免保人「信用貸款」辦理","借戶為本行利害關係人，應與其他消費者無擔保貸款額度合計，不得逾新臺幣 180 萬元","同一擔保品承作副擔保貸款，合計貸放額度不得逾鑑價金額一成","以上皆是"],"ana":["•(4) <strong>正確<\/strong>：本行保費融資信用貸款之相關規範，包含經理得於權限內以無擔保免保人信用貸款辦理（1）、利害關係人無擔保消費者貸款額度合計受 180 萬元之限額約束（2），以及設定副擔保時成數與合計貸放成數之控管限制（3）。各選項敘述均完全正確，故選 (4)。"],"labels":["1","2","3","4"],"plain":"有關本行「融資躉繳保費-信用貸款」規範，何者正確？營業單位經理得於「個別分行授信權限額度核給範圍」個人無擔保放款權限，以免保人「信用貸款」辦理借戶為本行利害關係人，應與其他消費者無擔保貸款額度合計，不得逾新臺幣 180 萬元同一擔保品承作副擔保貸款，合計貸放額度不得逾鑑價金額一成以上皆是•(4) 正確：本行保費融資信用貸款之相關規範，包含經理得於權限內以無擔保免保人信用貸款辦理（1）、利害關係人無擔保消費者貸款額度合計受 180 萬元之限額約束（2），以及設定副擔保時成數與合計貸放成數之控管限制（3）。各選項敘述均完全正確，故選 (4)。"},{"year":"114","no":41,"part":"第二部分","score":"1.5","ans":"3","topic":"E","stem":"有關本行集團關係戶之管理，下列敘述何者有誤？","opts":["集團關係戶新增授信時，應知會集團主責分行，並副知法人金融業務處","[新]行員專用系統「以關係戶統編查詢 TEJ 集團名單」功能，可輔助判斷授信戶之集團歸屬","兩家企業之授信額度合計達新臺幣 25 億元者，已符合集團控管控標準","授信新戶需同步申請集團限額時，集團限額核備日不得晚於授信案件核准日"],"ana":["•(3) <strong>敘述錯誤<\/strong>：依據本行同一關係人及集團管理規範，兩家企業於本行之授信額度（或總額度）合計達 <strong>「新臺幣 20 億元」（而非 25 億元）<\/strong> 起，即已符合並達本行「集團控管之認定標準」。"],"labels":["1","2","3","4"],"plain":"有關本行集團關係戶之管理，下列敘述何者有誤？集團關係戶新增授信時，應知會集團主責分行，並副知法人金融業務處[新]行員專用系統「以關係戶統編查詢 TEJ 集團名單」功能，可輔助判斷授信戶之集團歸屬兩家企業之授信額度合計達新臺幣 25 億元者，已符合集團控管控標準授信新戶需同步申請集團限額時，集團限額核備日不得晚於授信案件核准日•(3) 敘述錯誤：依據本行同一關係人及集團管理規範，兩家企業於本行之授信額度（或總額度）合計達 「新臺幣 20 億元」（而非 25 億元） 起，即已符合並達本行「集團控管之認定標準」。"},{"year":"114","no":47,"part":"第二部分","score":"1.5","ans":"3","topic":"E","stem":"辦理個人授信戶之徵信作業，下列敘述何者錯誤？","opts":["應查詢監護輔助宣告資料","個人授信戶於本行授信總餘額在新臺幣 200 萬元(含)以下得免徵同一關係人資料表","對達應徵提報稅資料匡計年度收入者，其最近一年收入總額應依個人資料表填寫","徵取「其他收入說明書」者應檢視、查證其內容之真實性"],"ana":["•(3) <strong>敘述錯誤<\/strong>：個人總授信達新臺幣 2,000 萬元以上之 理「用途不明確之外幣借款保證」時，因其具有高度外匯資金流出與洗錢套利風險，<strong>「不得逕行運用」丁類額度<\/strong>，必須另行專案報經區域中心或總行授信審核處核准後始得辦理。"],"labels":["1","2","3","4"],"plain":"有關綜合授信額度，以下何者為非？本項額度應向區域中心 or 授信審核處申請核准最高額度合計不應超過借款企業「最近一年營業額」或「預計未來一年營業額之八成」孰高不包括出口押匯（含出口貼現）授信辦理用途不明確之外幣借款保證時，得逕行運用「丁類無擔保授信」項下之其他保證額度•(4) 錯誤：依據授信篇第五章「綜合授信額度」規範，辦理「用途不明確之外幣借款保證」時，因其具有高度外匯資金流出與洗錢套利風險，「不得逕行運用」丁類額度，必須另行專案報經區域中心或總行授信審核處核准後始得辦理。"},{"year":"109","no":26,"part":"第二部分","score":"1.5","ans":"4","topic":"F","stem":"有關備付(本息)本票之徵取，下列何者正確？","opts":["所徵無第三者背書之本票，抬頭人不可為第一銀行","本票到期日一年內不對發票人請求時，即喪失追索權","綜合額度得依總額度金額徵取","所徵本票有到期日，於額度屆期或停用重新申請新額度時，應重徵"],"ana":["•(4) <strong>正確<\/strong>：備付本票（或備償本票）若有填載到期日者，一旦授信額度到期（屆期）或額度停用重開時，因為舊本票可能面臨票據時效消滅或與新約定授信條件不符之問題，<strong>營業單位必須重新徵提新本票<\/strong>。","•(1) 錯誤：抬頭人必須為本行。 (2) 錯誤：本票對發票人之請求權時效為三年。 (3) 錯誤：應以總額度之 110% 徵提。"],"labels":["1","2","3","4"],"plain":"有關備付(本息)本票之徵取，下列何者正確？所徵無第三者背書之本票，抬頭人不可為第一銀行本票到期日一年內不對發票人請求時，即喪失追索權綜合額度得依總額度金額徵取所徵本票有到期日，於額度屆期或停用重新申請新額度時，應重徵•(4) 正確：備付本票（或備償本票）若有填載到期日者，一旦授信額度到期（屆期）或額度停用重開時，因為舊本票可能面臨票據時效消滅或與新約定授信條件不符之問題，營業單位必須重新徵提新本票。•(1) 錯誤：抬頭人必須為本行。 (2) 錯誤：本票對發票人之請求權時效為三年。 (3) 錯誤：應以總額度之 110% 徵提。"},{"year":"110","no":9,"part":"第一部分","score":"2","ans":"2","topic":"F","stem":"下列敘述何者錯誤？","opts":["若綜合額度核准日為110.7.1，則應於110.9.1前徵取綜合授信契約","若綜合額度核准日為110.6.1，且核准期限一年，於110.7.1簽妥契約，則契約到期日為111.6.1","若出口押匯核准日為110.6.25，且核准期限一年，則額度到期日為111.6.30","若於110.8.1核准非循環額度-短期放款(無新設定擔保)，則額度動用期限(即批覆書有效期限)為110.12.1"],"ana":["•(2) 錯誤：綜合授信額度核准期限為一年，契約動用期間應自「額度核准日起算」（即 110.6.1起算至 111.6.1）。但契約書本身的簽署與約定，應以實際簽署日或特別約定期日為準。若於110.7.1 簽妥契約，契約到期日原則上應與核准到期日相符，但 (2) 選項在實務契據期間與核准期間的起訖日期對照上有誤。"],"labels":["1","2","3","4"],"plain":"下列敘述何者錯誤？若綜合額度核准日為110.7.1，則應於110.9.1前徵取綜合授信契約若綜合額度核准日為110.6.1，且核准期限一年，於110.7.1簽妥契約，則契約到期日為111.6.1若出口押匯核准日為110.6.25，且核准期限一年，則額度到期日為111.6.30若於110.8.1核准非循環額度-短期放款(無新設定擔保)，則額度動用期限(即批覆書有效期限)為110.12.1•(2) 錯誤：綜合授信額度核准期限為一年，契約動用期間應自「額度核准日起算」（即 110.6.1起算至 111.6.1）。但契約書本身的簽署與約定，應以實際簽署日或特別約定期日為準。若於110.7.1 簽妥契約，契約到期日原則上應與核准到期日相符，但 (2) 選項在實務契據期間與核准期間的起訖日期對照上有誤。"},{"year":"110","no":22,"part":"第二部分","score":"1.5",
